ews.","",[]],["Yellow-Bellied Chickenshit",[],2,13,14,"For starting a boss battle that ended with neither side dead.","",[]],["Johnny Quest",[],2,13,14,"For completing a quest without dying.","",[]],["Hadji",[],2,13,14,"For completing a quest in an unusual enough way. One of the rare repeatable achievements.","",[]],["Upgrade",[],2,13,11,"A rare, powerful scroll that enhances an item. Carl's first came from a Platinum Quest Box.","Spell (from a scroll)",[["How it works","Reading it starts a 20-minute timer to choose what to upgrade. Mordecai says they usually appear deeper in the dungeon, but famous crawlers get them early."]]],["Clarabelle",[],2,15,1,"A level 40 Crocodilian bouncer at the Desperado Club, the same race as Florin.","Crocodilian, level 40",[["Role","Guards the club's vestibule and asks for your manager. She overcharges the team on hired guards (500 gold instead of 400), and Carl notices."]]],["Pustule",[],2,16,1,"The level 30 hobgoblin who runs Hobgobs and Boom Sticks, the explosives shop. The first living hobgoblin Carl meets.","Hobgoblin, level 30",[["Role","Carl's main supplier of goblin dynamite, smoke curtains and Hob-Lobbers. Pleasant, and fond of an ugly price."]]],["Krasue",[],2,16,3,"Level 16 floating heads with their organs dangling underneath. They prowl the third floor at night and rip open chests.","First met at level 16",[["In the game","\"Who comes up with this shit?\" They leave victims bloodless with their chests torn open."]]],["Hobgoblin Hob-Lobber",[],2,17,10,"A fused, fragmenting hobgoblin grenade. \"Effect: It blows shit up.\"","",[["In use","Carl buys the last of Pustule's stock. He'll need a Sapper's Table to modify them."]]],["Shambling Berserker",[],2,18,3,"A level 12 third-floor brute that roams as a neighborhood boss-type threat. Carl is glad to watch it from above.","First met at level 12",[]],["Salvatore",[],2,20,1,"A level 16 City Elf Root Druid and temple \"wand bearer\" who calls Donut a blasphemer and leads a mob of elves.","City Elf, level 16",[["What happened","He and his friends tortured someone to get Donut's name, then came for her with reinforcements."]]],["Assassin",[],2,22,14,"For killing a ranking NPC town official.","",[]],["Ultimate Extreme Power",[],2,22,14,"For killing a medium settlement's acting magistrate, which makes you responsible for running it.","",[]],["CockBlock",[],2,22,14,"For killing an NPC another crawler needed for their quest. You get their reward. Do it again and they learn who you are.","",[]],["Bandit",[],2,26,14,"For completing a quest in an unusual way without really earning it. Repeatable.","",[]],["I'm on a train",[],2,27,14,"For boarding a train on the Iron Tangle.","",[]],["Drek",[],2,27,3,"Level 6 monster babies that pack the Nightmare Express train cars at the start of the fourth floor. \"Everybody loves babies, right?\"","First met at level 6",[["In the game","Carl and Donut wake up surrounded by cars full of them."]]],["Jikininki",[],2,27,3,"Level 17 ghoul janitors of the Iron Tangle Rail System. Lucia Mar rips one's head off on the recap show.","First met at level 17",[]],["Limp Richard",[],2,28,1,"A mole man who runs Limp Richard's Sundries, a general store at the Nightmare Express stop.","Mole Man, level 36",[["Role","Leans on the counter reading while the team browses. One of the Iron Tangle's few shopkeepers."]]],["They like me",[],2,28,14,"For being one of the first five crawlers to reach 500 trillion followers.","",[]],["Cuck Aquaman",[],2,28,14,"For a ruling so controversial that courts got involved and the AI's decision was overturned.","",[]],["Enchanted Necklace of the Haute Bourgeoisie",[],2,28,10,"Bonuses: +5 Dexterity.","",[["What it is","The second smallest of the \"chains of leadership,\" set with a tiny yellow jewel. From a fourth-floor box."]]],["Bang Bro",[],2,28,11,"A 5-mana spell that temporarily enchants an equipped item. Carl got it from a boss box on the fourth floor.","Cost: 5 Mana",[["How it works","Lasts 5 minutes plus a minute per level. It boosts whatever item Carl has equipped."]]],["Enchanted Tiara of Mana Genita",[],2,28,10,"Bonuses: +3 Intelligence.","",[["What it is","A crystal tiara fit for royalty that replaced the crown Donut lost. Not as good as the old one, but it has solid perks."]]],["Well-Rested",[],2,29,14,"For sleeping well enough to wake up fully refreshed.","",[]],["Martha Stewart",[],2,30,14,"For crafting at a workbench for the first time.","",[]],["Cave Mudge Bonker",[],2,30,3,"A level 19 pig-bodied Cave Mudge with a nail-studded club. Crawlers call them \"Bonkers.\"","First met at level 19",[["Context","Pours off the trains along with the Shock Chompers while Carl and Donut hold the platform."]]],["Pollyslog",[],2,31,3,"A level 22 monster from prehistoric kua-tin mythology, seen on the Iron Tangle's platforms.","First met at level 22",[]],["Pierre",[],2,31,1,"A level 25 Grapple, the Yellow Line porter on the Nightmare Express, with dying-moss hair.","Grapple. Yellow Line Porter, level 25",[["Role","A non-combatant train worker in uniform and a \"Porter\" hat."]]],["Literal Fire Ants",[],2,31,3,"A level 1 trap monster: fire ants that are actually on fire.","",[["What happened","They surge out of a trapped suitcase and set Vernon's wife's drawings ablaze. It's Carl's wake-up call to train Find Traps."]]],["Red Cornet",[],2,32,3,"A level 21 devolved Lepus that drinks potions mid-fight. \"What did you expect in an opera? A happy ending?\"","First met at level 21",[]],["Astrid",[],2,35,1,"A level 125 Bloodlust Sprite, assistant manager of the Desperado Club, who leaves a trail of red sparkles.","Bloodlust Sprite, level 125",[["Who she is","Severe, with raven hair in a tight bun, in a tuxedo like the bouncers. Carl raises Clarabelle's overcharge with her."]]],["Locomotive Breath",[],2,37,14,"For causing a train derailment.","",[]],["Levi the Seventh",[],2,38,1,"A level 7 symbiote: a Troll Flesher and a Hobgoblin Skellie sharing one body, worn like a gross mask.","Troll Flesher and Hobgoblin Skellie Symbiote, level 7",[["What it is","Two creatures in one. Carl's first close look at what a symbiote really is."]]],["Fire Brandy",[],2,40,1,"A level 75 Lesser Demon, the exhausted \"fire(wo)man\" of the Nightmare Express. She teaches Carl to drive a train.","Lesser Demon, level 75",[["Role","She keeps the engine fire going and teaches Carl the controls in crisp, matter-of-fact language."],["Her story","She has two new babies. Carl wonders whether she'll get to keep them when the floor ends."]]],["Kept A Rollin'",[],2,40,14,"For driving a train.","",[]],["Three Cheers for Slaughter",[],2,40,14,"For killing three boss monsters with a single attack.","",[]],["Babababoon",[],2,42,3,"A level 17 baboon monster on the fourth floor, suffering from the DTs (stage two of three), with red exclamation marks overhead.","First met at level 17",[["Context","Withdrawal debuffs are part of the Iron Tangle's drug allegory."]]],["Festering Ghoul",[],2,43,3,"A level 18 wooden-skinned ghoul covered in sores, a side effect of the Rev-Up Amazing Cure-All Vitamins.","First met at level 18",[["Context","The Rev-Up scheme from the first floor comes back on the fourth floor as a plague."]]],["Widget",[],2,43,1,"A level 19 Grease Gremlin, the Iron Tangle's steam engine train technician. Unbothered by ghoul hordes.","Grease Gremlin, level 19",[["Role","He knows the trains and the Escape Velocity line, and he laughs at the idea of hiking to the stairwells."]]],["Madison",[],2,43,1,"A level 10 human Iron Tangle Human Resources Associate, an NPC who doesn't think she's a prisoner.","Human, level 10",[["Moment","When Carl's team offers to set her free, she's offended by the suggestion."]]],["Blister Ghoul",[],2,48,3,"A level 20 ghoul spawned at station 72. Its defining trait is tenacity.","First met at level 20",[]],["Mentally Unstable Clothing Hoarder",[],2,51,14,"For carrying 500+ of the same stackable clothing item.","",[]],["Enchanted Wrestling Belt of the Great Gorgo",[],2,51,10,"A championship wrestling belt that boosts the wearer, with a mysterious name engraved on it: Christopher Pallies.","",[["Context","Found on the fourth floor. Neither Carl nor Katia knows who Christopher Pallies is."]]],["Razor Fox",[],2,53,3,"A level 22 fox monster in stage three of the DTs that charges down the train tracks.","First met at level 22",[["In the world","The Razor Fox Kite City is one of the fifth-floor map choices."]]],["Krakaren Crotch Dumpling",[],2,53,3,"A level 1 squirming Krakaren spawn. The AI introduces it with a mock kindergarten story time.","",[]],["Enchanted Auto Buckler of the Peach Pit",[],2,55,10,"A buckler that forms out of metal on command. Katia mostly uses it to add mass.","",[]],["Jabbering Jibber-Jabber",[],2,59,3,"A level 35 minion of the Mimic Rex: a giant slobbering mouth of needle teeth and nothing else.","First met at level 35",[]],["The Bubbles",[],4,1,7,"The fifth floor's name. The map is split into separate quadrants (land, water, desert).","The fifth floor",[["Arrival","Carl arrives ranked third, with 7 quadrillion followers and an 800,000-gold bounty."],["What's there","Hump Town, the Necropolis of Anser, the Water Quadrant and the Akula, and Pandinus."]]],["Clay",[],4,1,1,"Clay the camel, a Dromedarian gatekeeper who collects the toll at Hump Town's door.","Dromedarian, level 30",[["Personality","Laid back (\"Yo\"). He warns that Club Vanquisher types aren't welcome."]]],["Let There Be Chaos",[],4,2,14,"For summoning a god into the dungeon.","",[]],["Divine Epiphany",[],4,2,14,"For seeing a deity, a common achievement for crawlers who live long enough.","",[]],["Indomitable",[],4,2,14,"For being physically attacked by a deity and surviving. Only a handful of crawlers ever have.","",[]],["Smushed for Daddy",[],4,2,14,"For being stepped on by a deity and surviving.","",[]],["Hail Mary",[],4,2,14,"For an attack that caused 100+ casualties more than 100 km away, through portals in Carl's case.","",[]],["Extinction Event",[],4,2,14,"For killing every last member of a non-unique species on a floor with a single attack. This is what gives Carl the Extinction Sigil.","",[]],["Water Breathing",[],4,2,11,"A scroll that lets you breathe underwater for as many seconds as your Intelligence stat.","Spell (from a scroll)",[["In use","Donut's scroll fills Carl with dread. On the fifth floor, the whole team stocks up for the Akula mission."]]],["Enchanted Toe Ring of the Leprous Bandit",[],4,2,10,"A unique toe ring from Carl's \"Spicy\" platinum box, courtesy of the AI's foot obsession.","",[]],["Enchanted Gnome FarSeerer",[],4,2,10,"A ceramic-like gnome telescope for sighting long-range bombing targets. On a Gnomish Dreadnought it makes gravity bombs 75% more accurate.","",[["Context","Skarn uses one to watch the desert patrol, and it's credited with the gnomes' air superiority."]]],["Male Thorny Devil",[],4,3,3,"A level 34 spiky lizard, about the size of a grizzly bear, common in desert worlds. It runs like a crocodile.","First met at level 34",[]],["Svern",[],4,6,1,"A level 49 Changeling Principal in Hump Town, caught Exhausted after Louis's attack.","Changeling Principal, level 49",[["What happened","Carl uses Talon Strike to keep him down. They can't afford to be diplomatic with changelings."]]],["Wynne",[],4,6,1,"A level 50 Dirigible Gnome flesh mechanic, a healer who can bring the long-dead back to life, kept chained up by Henrik.","Dirigible Gnome Flesh Mechanic, level 50",[["Who he is","Great-uncle of Commandant Kane. Starved, scabbed and pale when Carl finds him."],["The quest","\"Free Wynne from his bondage.\" Freeing him promises easier access to the gnomes' flying platform."],["Why it matters","His rare ability is exactly what Henrik wants for raising Quetzalcoatlus."]]],["Low Thi",[],4,6,0,"A level 25 human crawler with the class \"D-Bag Geek,\" part of the tomb-raider group in Hump Town.","Crawler #4,778,551, Human, D-Bag Geek, level 25",[["First meeting","He greets Carl with \"You destroyed the map.\""],["Later","He and the other surviving tomb raiders, Morris and Bobby, show up on the list marked \"Possessed.\""]]],["Total, Utter Failure",[],4,7,14,"For failing a quest less than five minutes after getting it.","",[]],["Ruckus",[],4,9,4,"A house-sized, spring-operated \"chicken hawk\" sentinel: a level 55 borough boss and a leftover security robot from the Akula.","Level 55 Borough Boss",[["What it is","A giant buzz-ard that roosts nearby every night, according to Juice Box. Actually it's a robot that lost contact with the Akula and was reactivated to hunt the captain's enemies."]]],["Cannonball",[],4,13,14,"For surviving a fall from a great height.","",[]],["You're the reason why daddy drinks",[],4,13,14,"For annoying the System AI enough that it started an \"acceleration action,\" then fixing the problem.","",[]],["Chris Andrews",["Chris Andrews 2","Chris"],4,14,0,"Brandon's taller brother, a crawler from the Meadow Lark group who later took a rock-creature race.","Igneous, Zulu Warrior, level 35",[["First floor","Level 6 when Carl meets him, fighting beside Brandon."],["Later","He picked a rock-creature race. At the end of the fifth floor his name appears marked \"Enslaved,\" next to Maggie My's."]]],["Bonnie",[],4,16,1,"A level 5 juvenile Dirigible Gnome who loves only two things: her pet pig Sausage, and getting what she wants.","Dirigible Gnome. Juvenile, level 5",[["Moment","She cheerfully invites the team to \"test\" her new attraction, while the body of a gnome commander lies nearby."],["Connection","Denise is hers, and so is the carnage."]]],["Denise",[],4,16,4,"Bonnie's terrifying guardian. When she gets mad, magic stops working, and she killed Commandant Kane.","Level 53 Borough Boss",[["What happened","The team finds Kane's corpse, \"ripped to shreds by Denise.\" Her anger also drains the magic keeping their balloon up."]]],["Wild Goose Chase",[],4,16,14,"For fetching what you thought was an important potion. Magic doesn't work there, so it's lemonade.","",[]],["Hobgoblin Disco Ball",[],4,18,10,"A hobgoblin smoke curtain infused with vodka magic. It shines in rainbow opalescence. \"Effect: It's a real trip.\"","",[]],["Ghazi",[],4,21,1,"A Larracos College mage obsessed with the half-naiad Lika. His scheme to free Yarilo set Psamathe loose.","Human, level 43, Glass Mage",[["His scheme","He went after the Gate of the Feral Gods for \"research,\" really to bargain with Yarilo. He wanted Lika to love him."],["What went wrong","Psamathe answered, posing as Yarilo. She \"made Lika real\" and had him marry her on the spot. His new \"wife\" is really the Sand Ooze."],["His real wife","Tish, whose furious goodbye note he left behind."]]],["Sand Ooze",[],4,22,4,"\"Mrs. Ghazi\": a level 52 borough boss, the sand ooze familiar of Psamathe, which keeps coming back.","Level 52 Borough Boss",[["What it is","Psamathe's minion. Ghazi thinks of it as his wife. Killing it doesn't stick while Psamathe remains."]]],["Concierge Shark",[],4,23,3,"Level 41 tiger-shark mobs with a terrifying color and eyes, from the bite-first school of underwater hospitality.","First met at level 41",[]],["Milquetoast",[],4,23,14,"For winning an important boss battle without killing the boss.","",[]],["I was in the pool",[],4,23,14,"For spending 60+ seconds fully underwater and surviving. Honorary mudskipper.","",[]],["Potion of Bloodlust",[],4,23,10,"A berserker potion that Mordecai warns about. The last person he saw drink it killed half their own party.","",[]],["Big Boy Blue",[],4,25,3,"A level 40 jellyfish, the largest kind you'll find. Not naturally hostile (white dot), drifting and bumping around the water quadrant.","First met at level 40",[]],["Lusca",[],4,26,4,"Lusca, the Octo-Shark Brood Mother Queen: a level 82 city boss with surfboard-sized teeth. Fought as a televised special event.","Level 82 City Boss",[["The fight","Announced by Kevin and Magnificent Troy. She's a mouthbrooder, carrying her young in her mouth, and her babies swarm the sub."],["Setting","Fought from inside the Akula submarine in the water quadrant."]]],["Who Let the Gods Out?",[],4,27,14,"For letting a feral god into the realm. Other gods hate feral gods.","",[]],["Rock Bottom",[],4,28,14,"For diving more than 1,000 meters down, without a deep-diving suit, and surviving.","",[]],["Fight the Power",[],4,28,14,"For being named co-defendant with the AI in a Syndicate Court case and winning. Carl gets seven at once.","",[]],["Janet Jackson's Nipple",[],4,28,14,"For being featured during a live special event, the crawl's equivalent of a Super Bowl halftime show.","",[]],["Soft Vore",[],4,28,14,"For being swallowed by a much bigger monster and getting out unchewed.","",[]],["Flex in the City",[],4,28,14,"For killing a city boss with five or fewer crawlers.","",[]],["Potion of Dinosaur Repellent",[],4,28,10,"A potion to drink \"if your party is attacked by a pack of dinosaurs.\" Mordecai's \"uh-oh\" when it appears says it all.","",[["Foreshadowing","Getting it on the fifth floor hints at what's coming next."]]],["Ring of Water Breathing",[],4,28,10,"A sparkling blue ring for breathing underwater indefinitely. Carl, Katia and Tran all got the same one as a reward.","",[]],["Enchanted Anarchist's Battle Rattle",[],4,28,10,"Carl's sleeveless jacket. Weak at first, but it can hold as many upgrade patches as he can collect.","",[["Why it matters","It grows into one of Carl's most important pieces of gear as he adds patches. Donut grumbles about the embroidery."]]],["Meat Hooks",[],4,30,11,"A spell that hooks and drags targets. Donut took the scroll from a third-floor elf who used it to pull Mongo into an alley.","Spell (from a scroll)",[["In use","Carl remembers the scroll on the fifth floor when they need to pull something out."]]],["Man of God",[],4,32,14,"For pledging yourself to a god. Now there are consequences for your actions.","",[]],["Disarming Personality",[],4,32,14,"For ripping off a fellow crawler's arm with your bare hands.","",[]],["Enchanted Handcuffs",[],4,32,10,"Red-velvet \"enchanted handcuffs\" with an innuendo-heavy description, from one of the AI's crude prize boxes.","",[]],["Ping",[],4,32,11,"A 5-mana detection spell, also called \"Here piggy, piggy\" or \"The Night Dread,\" that reveals hidden or small creatures nearby.","Cost: 5 Mana",[["In use","Carl casts it to check for hidden NPCs or tiny gods around camp."]]],["Slit",[],4,34,3,"A level 200 Feral Minor Demon, one of many demons captured and thrown into the Nothing. It appears in the final chaos of the fifth floor.","Feral Minor Demon, level 200",[["What happened","Carl throws Samantha with all his strength, and Slit screeches and goes after her."]]],["Ian",[],5,1,1,"A level 30 Bush Elf registration attendant at the sixth floor's arena, with a mopey, theater-kid air.","Bush Elf, level 30",[["Role","A non-combatant NPC handling registration as the sixth floor begins."]]],["Funeral Bell",[],5,2,3,"Level 95 mushroom-capped monsters in red-trimmed robes, dripping water. The AI apologizes in advance for the description.","First met at level 95",[]],["Tootsie",[],5,2,2,"A level 25 Night Weasel scout, the pet of Hunter Zabit, whose presence blocks Carl from calling for help.","Night Weasel Scout, level 25",[]],["I Wanna Go Home",[],5,6,14,"For teleporting to a stairwell station within 30 hours of the floor opening.","",[]],["Mass Casualty Event",[],5,6,14,"For setting off an IED in a populated area that killed 250+ non-mobs, on purpose.","",[]],["Goiter",[],5,10,1,"A level 42 bugbear council member of a sixth-floor settlement, who smells like pickled beets and vodka, according to Donut.","Bugbear, level 42",[]],["Enchanted Collar Charm of the Effete Bourgeoisie",[],5,11,10,"Bonuses: +8 Dexterity, +4 Intelligence.","",[["What it is","The middle size of the chains of leadership, in collar-charm form for Donut. Carl's version is a necklace."]]],["Insurgent",[],5,11,14,"For leaving an explosive on a well-traveled path that later killed its intended target.","",[]],["Double-Billed",[],5,12,14,"For being one of the first five crawlers billed in two shows at once, on purpose.","",[]],["Enchanted Obsidian Bracelet of the Raggle Rouser",[],5,23,10,"Bonuses: +10 Constitution, +5 Dexterity.","",[["What it is","Upgraded three times already. Donut demands it immediately (\"Give it to me now, Carl\"). Carl's only request: don't burn everyone alive."]]],["Future Huntress",[],5,25,2,"A level 50 Wire-Haired Orc \"Boring Ol' Fighter\" from the Skull Empire, a new hunter who hadn't leveled up even once.","Wire-Haired Orc, level 50, Boring Ol’ Fighter",[["Context","Her first foray into battle was very likely her last."]]],["Premature Questjaculation",[],5,28,14,"For finishing a quest before the AI could even give it to you.","",[]],["Automaton Table",[],5,33,3,"A level 5 walking table in an empty studio, with a paperback book sitting on it.","First met at level 5",[]],["Uprooted",[],5,36,14,"For forcing a Rooted-in-Place boss to move, then killing it.","",[]],["Bisected",[],5,36,14,"For teleporting into a solid object. An admin action saves you from losing a limb.","",[]],["Desecrated",[],5,36,14,"For finding a desecrated temple: attendants murdered, treasury looted.","",[]],["Temple Defiler",[],5,36,14,"For breaking a desecrated temple's shrine with your own flesh when you're not a member. Gods take that personally.","",[]],["That's not how you use arrows, dumbass",[],5,36,14,"For stabbing someone with an arrow by hand.","",[]],["It itches when I pee",[],5,36,14,"For infecting another combatant with a venereal disease.","",[]],["This little piggy made a boom boom",[],5,36,14,"For pushing a bomb into place with your bare foot.","",[]],["What big muscles you have",[],5,36,14,"For raising base Strength above 100.","",[]],["Enchanted Silver Bracelet of the Ab-solar",[],5,43,10,"A silver bracelet set with garlic-bulb gems, and an anti-vampire description that quotes a famous vampire romance in mocking mixed case.","",[]],["B'sieging",[],5,51,14,"For using siege equipment to attack a boss from far away.","",[]],["Simoom",[],5,51,5,"A level 75 heavy battle rhino mount that walks with a parade animal's stomp. It carries a curtained, perfumed litter on its back.","Heavy Battle Rhino Mount, level 75",[]],["Iota",[],5,53,2,"A level 50 hunter of the Crafter Alliance, a Coin Tinker who refuses to fight or beg when cornered.","Crafter, level 50, Coin Tinker",[["Moment","\"Just get it over with.\" He's resigned when he lands in Carl's lap."]]],["Sex Pervert",[],5,55,14,"For equipping a nipple ring.","",[]],["Haxor the Destroyer",[],5,58,2,"A level 50 Dreadnought merchant and Unaffiliated Hunter, with ground-down horn bumps. He's more of a seller than a destroyer.","Dreadnought, level 50, Merchant",[]],["Enchanted Hammer of Fast Forward",[],5,62,10,"A small enchanted hammer given to Donut, who can't even hold it. Its purpose seems connected to Dmitri's stick.","",[]],["Enchanted Stick of Cascadia's Screams",[],5,62,10,"A stick that isn't a wand but \"can do something truly magical\" when used correctly. It seems to pair with the Hammer of Fast Forward.","",[["Mystery","Nobody, not even Mordecai, knows who Cascadia is."]]],["The Great Race",["Seventh floor"],5,75,7,"The new floor added at the last minute: an engineering marvel funded with help from the Valtay Corporation.","The seventh floor",[["What's known","The original seventh floor gets pushed back to eighth, with the difficulty raised to match."]]],["Valtay",["Valtay Corp","Valtay Corporation"],1,47,9,"A name Carl first sees stamped on expensive high-tech gear in the dungeon's shops: personal shields, pulse pistols and communication relays. Who or what is behind Valtay Corp becomes a question he keeps coming back to.","",[["What Carl learns","Valtay products (relays, personal shields, pulse pistols) are high-end tech. The Valtay are parasitic aliens who wear host bodies and keep them alive with a secretion, distant cousins of the Scree."],["Why it matters","The Valtay Corporation becomes Carl's sponsor, and the panel shows argue about Valtay trying to take over the crawl."]]],["Rat-Kin",["Rat-Kins","Rat Hooligan"],1,3,9,"Rat-people who walk on two legs. Hooligans are the clever, quick and very ugly branch of the family, and Mordecai is one when Carl first meets him.","",[["Mordecai","Starts as a level 50 Rat Hooligan guildmaster in a black vest and sandals. He changes forms as the floors change."]]],["Bugaboo",["Bugaboos"],1,35,9,"A big, shaggy, solitary monster from the lower floors that likes to ambush crawlers. Mordecai turns into one when his form changes between floors.","",[["What it looks like","A huge, hairy, obsidian bear with no neck, enormous owlish eyes and comically skinny legs. One of Mordecai's later forms."]]],["Gnome",["Gnomes"],1,9,9,"Small folk who show up all over the dungeon as NPCs and mobs. The Bopcas that look after saferooms are gnome-like creatures.","",[["Kinds","Bopca Protectors are gnome-like. The fifth floor's first phase, \"The Gnomes,\" is ruled by Dirigible Gnomes."]]],["Dwarf",["Dwarves","Dwarfs"],1,9,9,"Stocky, bearded folk who turn up as NPCs, shopkeepers and the occasional mob from the first floor on.","",[["Kinds","Night Dwarves (squat and purple-skinned, a race option), Fathom Dwarves (Eunice's brawling family), and dwarf conductors on the Iron Tangle (Vernon, Tizquick)."]]],["Gnoll",["Gnolls"],1,12,9,"Hyena-like humanoids. They show up in early mob packs and in the names of loot such as riot-force gear.","",[["Known gnolls","Growler Gary the bartender, and the CrawlCon guards Frito and Moxo."]]],["Orc",["Orcs"],1,16,9,"Heavy, pig-headed humanoids that are among the first big brutes Carl fights. Orc blood also shows up in some crawlers' mixed races.","",[["Known orcs","GumGum, a level 5 orc NPC in an apron who asks adventurers for help and is later found dead. The Skull Empire's royals are orcs too."]]],["Tuskling",["Tusklings"],1,26,9,"A boar-like warrior aristocracy of knights and their courtesans. Under the right drunken, war-crazed conditions, a gathering of them can fuse into the monstrous Ball of Swine.","",[["The Ball of Swine","At least 30 knights and their \"lady loves\" fused into one battle formation, the Porkchop Express. One of the rarest and deadliest formations."]]],["Kobold",["Kobolds"],1,30,9,"Small reptilian folk who ride danger dingoes and work as their handlers. Where you find the dingoes, kobolds aren't far behind.","",[["Flavor","Fond of black metal bands like Dimmu Borgir and Satyricon. Their DNA is nearly the same as a chihuahua's."]]],["Naiad",["Naiads","Half-Naiad","Half Naiad"],2,6,9,"Water folk whose Naiad Confederacy is known for drowning outsiders. Signet's mother was a naiad, which makes Signet half naiad and half high elf.","",[["Signet","\"My mother was a Naiad.\" She taught Signet grace, and the Water Lily heirloom magic."]]],["Ogre",["Ogres"],2,6,9,"Huge, brawny humanoids. On the third floor they show up as circus strongmen and in the shapes of Signet's tattoo monsters.","",[]],["Amazonian",["Amazonians"],2,7,9,"A warrior race. Hekla picks it on the third floor and pairs it with the Shield Maiden class.","",[["Hekla","After the change she's a foot taller and much broader, and she leads Brynhild's Daughters as an Amazonian Shield Maiden."]]],["Crocodilian",["Crocodilians"],2,15,9,"An intelligent, thick-skinned, semi-aquatic reptile race. Clarabelle at the Desperado Club is one, and so is the shotgun-carrying crawler Florin.","",[["Known ones","Clarabelle (a level 40 Desperado Club bouncer) and Florin (a Shotgun Messenger near the top of the leaderboard)."]]],["Null",["Nullian","Nullians","the Null","Grays"],2,19,9,"The aliens Earth knew as the Grays. Other races see them as nasty and unpleasant, and they are the likely culprits behind Earth's old abduction stories.","",[["Reputation","Whole star systems refuse entry to Nulls, which makes it hard for them to earn a living."]]],["Saccathian",["Saccathians","Sacs"],2,19,9,"A common alien race with tentacled faces, often called Sacs. Princess D'Nadia, a talk-show regular, is one.","",[["Known ones","Princess D'nadia of the Prism (rare royalty), the bounty hunter Gennrik, and Sydnee Iglacia."]]],["Doppelganger",["Doppelgangers"],2,21,9,"Katia's race. Doppelgangers shape their bodies like clay and can move or add mass to become almost anything. It is a notoriously hard race to master, and it reads as human to anyone examining her.","",[["Katia","Shows as \"Human\" when examined, because that's what she's mimicking. Holding a form takes practice. Changing shape quickly still hurts."]]],["Tigran",["Tigrans"],2,23,9,"Tiger-like humanoids. Daniel Bautista is one, in very loud colors.","",[["Bautista","A level 18 Tigran Swashbuckler who looks like a reject from Thundercats, \"a tiger that was vomited on by a Lisa Frank notebook.\" Carl likes him."]]],["Caprid",["Caprids"],2,26,9,"Walking, talking goat-folk. Prepotente is one.","",[["Prepotente","Travels with Miriam Dom's goats and ranks third on the board early on."]]],["Frost Maiden",["Frost Maidens"],2,26,9,"An ice-magic race. Elle picks it and pairs it with the Blizzardmancer class.","",[["Elle","A blue-skinned, white-haired elf who floats. Hard to recognize from the old woman she was in the Meadow Lark."]]],["Half-Elf",["Half-Elves","Half Elf"],2,26,9,"A mixed elf race chosen by some crawlers, including Quan Ch. High elves treat half-elves as outcasts.","",[]],["Grulke",["Grulke Infantry"],3,2,9,"A rare, militaristic race of toad soldiers who make huge leaps and attack with their tongues. Mordecai becomes one on the Iron Tangle.","",[["Mordecai","Becomes a level 50 Grulke Infantry with a puffy throat pouch on the Iron Tangle."],["Plushies","\"Grulke Infantry\" is the most common figure in Jaxbrin's collectible line, which is what Louis summons."]]],["Igneous",[],3,8,9,"A rock-creature race. Igneous crawlers grind and scrape like stone when they move. Chris Andrews picks it.","",[["Chris Andrews","Seven and a half feet tall, level 35, with the class Zulu Warrior. He goes silent with Imani after the change."]]],["Mantaur",["Mantaurs","ManTauR"],3,11,9,"A strange, engineered take on the centaur that is human on both halves, built for strength and dexterity. They work as the Iron Tangle's train engineers.","",[["Grull","Mantaurs worship Grull, so Carl worries about what his gauntlet might summon around Gore-Gore."]]],["Night Elf",["Night Elves"],3,19,9,"A dark-elf race in the drow tradition. Frank Q picks it and pairs it with the Blood Assassin class.","",[["Frank Q","Only level 17 when Carl sees him again on the fourth floor, far behind."]]],["Nagini",["Naginis","Half Nagini"],3,21,9,"A cobra-like serpent race. Eva Sigrid is half nagini and half orc.","",[["Eva Sigrid","Level 27 at first, with four arms, one large skull and three small ones. A Nimblefoot Enforcer who mocks Katia."]]],["Nodling",["Nodlings"],3,25,9,"The race of the Popov brothers, Dmitri and Maxim, who share one body with two heads.","",[]],["Dromedarian",["Dromedarians"],4,1,9,"A common, once-nomadic camel-like race from dry worlds. They can hold enough water to go about two months without a drink. They run much of the fifth floor's desert towns and bars.","",[["Clay","A level 30 gatekeeper with a hump like an overstuffed backpack. He smokes the cigarette Carl gives him. City hall is Dromedarians only."]]],["Vampire",["Vampires"],4,34,9,"Vampirism shows up in the dungeon as a race. By the end of the fifth floor, Miriam Dom is listed as one on the top-ten board.","",[["Love Vampire","Donut has a \"Love Vampire\" skill, which she insists isn't the same thing as a vampire."]]],["Dryad",["Dryads"],5,1,9,"Tree-folk who live in settlements across the sixth floor's jungle.","",[]],["Bush Elf",["Bush Elves"],5,1,9,"Jungle elves of the sixth floor who disappear the moment you blink.","",[["In the game","The AI describes them as the \"regular joes\" of the forest: once a proud people, now worn down and stuck in cubicle-style jobs. Ian works registration at the arena."]]],["Draconian",["Draconians"],5,5,9,"A dragon-like alien race. Several of the sixth floor's hunters, including Chin'dua, are draconians.","",[["Chin'Dua","A level 50 Striver, unaffiliated, first seen outside a bar called the Scuttlebutt."]]],["Yenk",["Yenks"],5,13,9,"Tall humanoid aliens with ridged foreheads and bony exoskeletons. Some of them are sixth-floor hunters who tend to work alone.","",[["Seen","One levitating Yenk draws an anti-air missile from the guards. Mordecai clarifies it isn't a mantis."]]],["Were-castor",["Were-castors","Were-beaver","Were-beavers"],5,14,9,"Were-beavers that switch between fuzzy humanoid and beaver form. Several of them travel with Signet, including Clint and Holger.","",[["The joke","\"Not caster. Were-castors.\" They're small beaver-type creatures."]]],["Goriff",["Goriffs"],5,60,9,"Blue humanoid aliens with antennae like twin elephant trunks. The Goriff hunters carry pulse rifles and electrified armor.","",[]],["Prince Maestro",["Maestro"],1,41,1,"Orc host of the brutal talk show Death Watch Extreme Dungeon Mayhem, and a member of the Skull Empire's royal family.","",[["Who he is","A crude, sneering orc showman who calls his audience \"piglets\" and works the crowd into chanting \"Death Watch!\" He's royalty in the Skull Empire, whose Skull Clan he brags has won six of the last ten Faction Wars."],["His show","Crawlers are pulled into the studio as \"guests\" and set up for cruelty. In the episode where Carl and Donut appear, he tries to force Li Jun and Zhang to choose who gets saved, including Li Jun's sister, Li Na."],["Why it matters","Carl's run-in with him on air is the first time Carl publicly turns a show's cruelty back on its host, and it puts Carl on the Skull Empire's radar."]]],["Grull",["War God Grull","Exalted Grull"],1,25,6,"The war god of the orcs, whose name is on Carl's War Gauntlet. Using it against his followers can summon him.","",[["What it is","A god of war and bloodshed, worshipped by orcs and similar warrior races. Gore-Gore shouts \"In the name of the exalted Grull\" as a battle cry."],["Carl's connection","Carl's Enchanted War Gauntlet of the Exalted Grull boosts Strength and Iron Punch. Mordecai warns that using it against Grull's worshipers can call the god down, and that King Rust has been paying to send those worshipers after Carl."],["On the floors","Grull's followers become a recurring threat once the gods start appearing in the dungeon."]]],["Henrik",[],4,6,1,"A changeling in Hump Town on the fifth floor who keeps the gnome Wynne prisoner and tortures him for a spell.","",[["What he is","He looks like an ordinary level 30, but he flashes an ID to get past guards. He's actually a changeling, a shapeshifter who can wear other people's faces."],["His scheme","He holds the Dirigible Gnome flesh mechanic Wynne captive, drugging him and trying to force out a spell that would give flesh to the ghost queen Quetzalcoatlus."],["Why it matters","Katia spots him slipping toward Weird Shit Alley, which leads Carl's group to his hidden prisoner and into the necropolis plot."]]],["Li Na",[],1,42,0,"Li Jun's younger sister, a crawler who fights with chains and took an unusual demon-like race.","",[["Who she is","The one member of Li Jun's crew who didn't work at the same warehouse. She shows up on Prince Maestro's show as the \"doll reaching for the sword\" whose fate the host tries to use as a bargaining chip."],["How she fights","She chose an odd, demon-like race and swings chains in combat."],["Her group","She crawls alongside her brother Li Jun and his best friend Zhang, who refused to betray each other on Death Watch."]]],["Zhang",[],1,42,0,"Li Jun's bald best friend and fellow crawler, who refused to sell anyone out on Prince Maestro's show.","",[["Who he is","A human who worked at the same warehouse as Li Jun. The Maestro introduces him as \"the bald one we'll just call Zhang.\""],["Death Watch","When the Maestro pressures him over Li Na, Zhang begs him to save Li Jun and Li Na. Li Jun insists they all stand together instead."],["On the floors","He keeps crawling with Li Jun and Li Na as a tight three-person group."]]],["Sir Ferdinand",["Ferdinand"],1,23,5,"A cat from Donut's old life whose name she lets slip, and pointedly won't explain.","",[["Who he is","Donut mentions him while bragging that she'd never end up \"matted and filthy,\" and again when she thinks she's dying: \"Find Ferdinand, tell him I loved him.\""],["The mystery","Asked about it later, she flatly denies knowing anyone named Ferdinand."],["The truth comes out","Carl later points out that the cat's real name was Gravy Boat, owned by a neighbor on the first floor of their building."]]],["Lexis",[],1,27,13,"Associate producer for the interview show Dungeon Crawler After Hours with Odette, and the first show staffer to greet Carl and Donut.","",[["Role","She meets them in the green room, speaks Syndicate Standard in a light, almost cartoonish voice, and walks them through what will happen before going on air."],["Why it matters","She's Carl and Donut's first look at how the shows behind the crawl are actually run."]]],["Over City",[],2,1,7,"The third floor's world: a sprawling ruined city in the sky, built along wooden streets above an unseen ground.","",[["What it is","A huge, mostly ruined urban map where the third floor takes place. Village guards keep the populated areas safe during the day only."],["Dangers","After dark, monsters move through the Over City Ruins, and guards won't help."],["Atmosphere","Wooden streets, crumbling buildings and scattered villages, with NPC populations in different states of decay."]]],["Hump Town",[],4,1,7,"The dromedarian (camel-folk) town on the fifth floor's desert map, where you pay a toll to get in and nobody likes Club Vanquisher types.","",[["What it is","A walled town run by Dromedarians, entered through a big double door with a mallet knocker and a sign: \"Bang twice to enter.\""],["Rules","Clay the camel collects a toll at the gate. City hall is for Dromedarians only. Club Vanquisher types aren't welcome."],["Layout","Inns and shops, Hump Street, and Weird Shit Alley in the northeast corner."]]],["Weird Shit Alley",[],4,1,7,"The seedy back corner of Hump Town, against the northeast wall.","",[["What it is","The part of Hump Town where the stranger trades and stranger people end up. The gate guard tells newcomers that if they're into weird stuff, that's where to go."],["Why it matters","Henrik the changeling heads that way, and following him uncovers the prisoner hidden inside."]]],["Level Collapse",["Collapse"],1,2,12,"The deadline for each floor. When the timer runs out, the floor collapses and anyone still on it dies.","",[["How it works","Every floor shows a countdown (\"Time to Level Collapse\"). Crawlers have to find a stairwell and go down before it hits zero."],["Strategy","The timer drives everything: how long to grind, when to rest, and when to push for the stairs. Later floors play with the rules around it."]]],["Desperado Pass",[],1,19,10,"The pass that gets a crawler into the Desperado Club, the exclusive VIP lounge found on later floors.","",[["How you get it","Carl earns his early on, with a joke about now running with the kids who sit in the back of the bus."],["What it gives","Access to the Desperado Club and its services, which becomes a regular base for the team. Katia gets hers on the fifth floor, so the group adds a third bodyguard."]]],["Pony",[],3,32,5,"Miriam Dom's goat, part of the shepherd's flock.","",[["Who he is","One of the goats the human Shepherd Miriam Dom travels with. She scolds him like a misbehaving child."],["With Miriam","Her class gives her goats a big role in combat and travel. Pony is the one we first hear her talking to by name."]]],["Magistrate Featherfall",["Featherfall"],2,17,1,"The magistrate who runs a third-floor village, and a Dark Cleric who's hiding something.","",[["Who he is","The village's top authority now that the old regional government is gone. His signed Gate Pass works like a get-out-of-jail-free card inside his township."],["What Carl finds","His chambers are magically locked, and digging into them reveals more than a simple village official."],["Why it matters","He ties into the third floor's quest about missing people and hidden evil."]]],["Quetzalcoatlus",[],4,6,6,"The ghost queen of the necropolis on the fifth floor. Henrik is trying to give her flesh again.","",[["What it is","A spectral, pterodactyl-like queen tied to Anser, the dead emperor. Her name keeps coming up in whispered plots."],["The danger","Wynne says Henrik is torturing him for a spell that would make Quetzalcoatlus physical again."],["The necropolis","Everything about her leads back to the Necropolis of Anser and the stalemate there."]]],["Leon the Commissar",["Leon"],4,10,1,"A level 44 Dirigible Gnome negotiator, the Wasteland's ambassador and a stickler for rules.","",[["Role","He comes to inspect prisoners held as collateral and casts a spell to check they aren't changelings."],["Personality","A master politician who sticks to protocol. He keeps his cool even when there's a murder right behind him."],["Why it matters","He's the face of the gnomes' diplomacy, and his checks shape how Carl's team can use the hostage deal."]]],["Manasa",[],2,19,13,"A famous cobra-headed Naga pop singer and panelist on Danger Zone with Ripper Wonton. She isn't really a Naga anymore.","",[["Who she is","A huge silver-and-black cobra-headed singer who appears by hologram on the panel show. Evo explains she isn't part of the Blood Sultanate."],["The twist","The real Manasa died long ago. What appears now is something else, still performing."],["Politics","On air she sides with the Valtay in the fight over who will run the crawl."]]],["Cici",[],1,14,5,"One of Lucia Mar's two rottweilers. Donut picks a very public feud with them.","",[["Who she is","A rottweiler that entered the dungeon with Lucia Mar and grew far more powerful, tearing through monsters beside her."],["The feud","Donut challenges Cici and Gustavo 3 on air, and the show treats it like a boss fight with a full \"Versus\" screen."]]],["Gustavo",[],1,14,5,"Lucia Mar's other rottweiler, Gustavo 3, Cici's partner in mayhem.","",[["Who he is","The second of Lucia's dogs. The \"3\" is part of his name."],["Fighting style","With Cici, he's a vicious frontline attacker who works in tandem with Lucia's mace."],["The feud","He's the other target of Donut's televised challenge."]]],["Lika",[],4,21,6,"A legendary half-naiad trobairitz, a bard-cleric sworn to celibacy, and the object of Ghazi's obsession.","",[["Who she is","A famous performer and holy woman whose vows of celibacy put her out of anyone's reach."],["Ghazi's obsession","Ghazi built a shrine with a plaque declaring his love, got a chest tattoo of her, and tried to bargain with Yarilo, the banished god of Lust, to make her love him."],["Why it matters","That bargain goes wrong and frees something far worse into the fifth floor."]]],["Psamathe",[],4,21,6,"A banished lesser deity accidentally set loose on the fifth floor, always with her sand-ooze familiar.","",[["What she is","Not a full god but a lesser deity, one of the banished. She's identified by the ooze that follows her."],["How she got out","Ghazi was trying to summon Yarilo and pulled her out instead. Her ooze keeps reforming no matter how often it's killed."],["The threat","She ends up riding inside the pterodactyl ghost in the necropolis, which gives the fifth floor's main plot its twist."]]],["Blood Sultanate",["Sultan","Sultanate"],1,7,8,"The Naga royal house that rules the ninth floor's faction in the Faction Wars. Donut is unexpectedly in its line of succession.","",[["What it is","The Naga's ruling dynasty. A Syndicate faction that's usually knocked out first in the Faction Wars."],["Donut's crown","Wearing the Enchanted Crown of the Sepsis Whore permanently put Donut in their royal line. On the ninth floor, royals have to kill the Sultan and every other family member before they can go down."],["History","Long ago the Naga ran their own season of the crawl and it lost money. They're still recovering."]]],["Naga",["Nagas"],1,43,9,"A serpentine race, cobra- and snake-like people. Their royal house is the Blood Sultanate.","",[["What they are","Snake-bodied, cobra-hooded people with forked tongues. Other races use \"Naga\" as an insult: \"Do I look like a Naga to you?\""],["In the galaxy","They once hosted a season of the crawl, a famous financial disaster that also saw a record number of Celestial boxes. Drakea, author of a Cookbook edition, ranted about them at length."],["Known Naga","The pop singer Manasa, sort of."]]],["Vengeance of the Daughter",[],2,9,13,"The program running the third floor's Signet storyline. Carl figures out its name and starts negotiating with its producers.","",[["What it is","One of the many shows that sponsor quest lines in the dungeon. This one revolves around Signet and her father's circus."],["Carl's play","After poisoning Grimaldi, Carl speaks directly to the show's producers. He offers an exclusive deal on future elite quests in exchange for them letting things play out."],["Why it matters","It's the first time Carl treats the shows as people he can bargain with, not just an audience."]]],["Quint",[],2,15,1,"A floating drug dealer, half opossum and half spinning dervish, who works as pharmacist at the Desperado Club.","",[["Who he is","The top half is a sharp-toothed, beady-eyed opossum. The bottom half is a constant whirl. He's the club's pharmacist on duty."],["Mordecai's old acquaintance","He greets Mordecai like an old regular and is surprised he isn't free yet."],["What he sells","Drugs and potions, including the kind of substances Carl is careful not to get hooked on."]]],["Akula",[],4,9,7,"A giant submarine in the fifth floor's Water Quadrant, guarded by robots.","",[["What it is","A huge sub full of robotic security. Its loss of contact is why the automaton Ruckus wandered off."],["What happens there","Taking its bridge liberates the Water Quadrant, which other crawlers fight through."]]],["The Hoarder",["Hoarder"],1,11,4,"A level 7 neighborhood boss on the first floor: a woman buried in her own rubbish, with leashed creatures around her.","",[["The fight","Trapped in her junk pile with the madness in her head spilling out, she fights with whatever she's collected. Carl smashes his way through her pets with a chain-wrapped fist."],["Loot","She drops only a Neighborhood Map, a scrap of paper."],["Why it matters","One of the first bosses Carl and Donut beat as a team."]]],["Kevin",[],4,26,13,"The lizard-man play-by-play announcer who calls the big fifth-floor boss battle, alongside Magnificent Troy.","",[["Role","He calls the action like a sports broadcaster, shouting names and plays in stadium-style echo."],["On air","He announces Lusca's arrival and keeps the commentary going while the crawlers fight inside the sub."]]],["Magnificent Troy",[],4,26,13,"Orc color commentator who works the fifth floor's special boss event alongside Kevin.","",[["Role","He breaks down the fight like a football play, drawing circles around Lusca's mouth and explaining the brood mother's habits."],["Personality","A showman. He's sorry Princess Donut isn't there to round out the team."]]],["The Juicer",["Juicer"],1,24,4,"A level 9 neighborhood boss, a steroid-pumped gym bro who throws weights around a first-floor gym.","",[["The fight","He's surrounded by troglodytes in a gym. Carl's team blinds the room and goes for him while he hurls equipment at random."],["Personality","All \"bro\" talk and muscle, even blinded and half-dead."],["Loot","The fight leaves Carl with a bizarre troglodyte-head boxing glove."]]],["The Apothecary",["Apothecary"],3,30,1,"The better translation of \"Krakaren\": a fungal-like life form spreading across the universe, able to synthesize elements.","",[["What it is","Something that's spreading through the galaxy and making a lot of people nervous. It gets the name Apothecary because it can create elements."],["The name game","Calling it \"the Krakaren\" deliberately twists the translation to make it sound monstrous."],["Why it matters","It changes how Carl sees the Krakaren creatures he's been fighting since the first floor."]]],["Tucker",[],2,19,13,"A smug human stand-up comedian on the Danger Zone panel. Donut keeps \"forgetting\" his name.","",[["Who he is","A stuffy, middle-aged comic appearing by hologram. Carl dislikes his punchable grin on sight."],["On air","He talks down to everyone about Borant and the Valtay. Donut needles him by calling him \"Butler,\" which nearly gives Princess D'nadia a laughing fit."]]],["Vermillion line",[],3,21,7,"A Nightmare Express train line on the fourth floor that still has power and a working train. A thousand stranded crawlers gather there.","",[["What it is","One of the subway lines on the Iron Tangle. Unlike most, its track is clear and the power is on."],["Why it matters","A big group of survivors gathers at station 101 to wait for the stairwells, which makes it a key rescue point."]]],["Frito",[],5,32,1,"A gnoll guard at the production facility during the sixth-floor panel event. Partnered with Moxo.","",[["Role","He and Moxo escort Carl around the studio. Frito sets up the glowing training panel for Carl's skill module."],["Personality","Gruff and practical, mainly worried about everyone getting \"their hides stripped\" if they're late."]]],["Moxo",[],5,32,1,"Frito's partner, the other gnoll guard escorting Carl through the production facility.","",[["Role","He keeps Carl moving between training, the studio and the panel, nudging him along when he dawdles."]]],["Ricky Joe",[],2,20,1,"A juvenile Fathom Dwarf on the third floor, a salamander-torturing kid whose antics set off a disastrous street brawl.","",[["Who he is","A level 2 dwarf child from a big, chaotic family. He's crushed when his pet salamander Benjamin stops moving."],["What happens","The family drama spirals into violence in the street, and Ricky Joe ends up badly hurt."],["Why it matters","It's an early, darkly comic look at how unhinged the third floor's NPC families are."]]],["Taranis",[],3,33,6,"The sun god and father of Grull. In fifth-floor lore he strides across the sky each day, chased by his red brother Hellik.","",[["In the pantheon","Grull is the child of Taranis and Apito, which makes Taranis part of the line contending for the Celestial Throne. Emberus is his youngest brother."],["Day and night","Locals explain the short darkness on the fifth floor through him: Hellik catches up four hours before dark, and Taranis drives him off with a storm."]]],["Hellik",[],4,3,6,"The red sun god, brother of Taranis and twin of Emberus, obsessed with killing them both.","",[["In the pantheon","Often called one of the most unhinged gods, he's locked in a deeply dysfunctional rivalry with his brothers."],["Rules","Worshippers of Emberus are forbidden from carrying any gear blessed by Hellik."]]],["Gravy Boat",[],2,19,5,"The neighbor's tomcat back home. Donut's secret \"Ferdinand,\" and the father of many kittens.","",[["Who he is","He belonged to Marjory on the first floor of Carl's building, came to Donut's window when she was in heat, and fathered litters all over the neighborhood."],["The reveal","Donut tells a romantic story about a cat named Ferdinand. Carl bursts out laughing and corrects her."],["Loose ends","At the end of Book 4, a pair of hunters on the surface are hunting for a cat named Gravy Boat."]]],["Rebecca W",[],1,12,0,"A crawler found dead near the first floor's main corridor, killed by Frank Q. She's how Carl learns crawlers kill each other.","",[["What Carl finds","Her large, pulsing corpse marker sits less than 200 meters from a safe area. Her inventory is picked clean except for an apple core."],["Why it matters","\"Killed by Crawler Frank Q\" is Carl's first proof that other crawlers are a threat, and it sets up his confrontation with Frank."]]],["Mistress Tiatha",["Tiatha"],1,22,1,"Guildmaster of the Meadow Lark group's tutorial guild on the first floor.","",[["Role","Brandon's group learned the dungeon from her. She explained that borough and city bosses guard stairwells on the first few floors."],["Why it matters","Her advice shaped how the retirement home survivors got through the first floor, including the hard choices about residents who couldn't keep up."]]],["Ralph",[],1,45,4,"A level 11 neighborhood boss on the first floor: Ralph the Frenzied Gerbil, beloved pet of a pimped-out kobold.","",[["The fight","He's a fist-sized ball of fur and rage. When Carl's boom jug wipes out the kobolds, including his owner, Ralph goes berserk."],["How it ends","One of the dingoes Carl had fed earlier pounces and swallows him whole. Kindness turns out to be the winning move."]]],["Talon Strike",[],3,2,11,"A kick skill from the Skyfowl settlement gem: fast foot jabs that hit like a bird's talons.","",[["How Carl got it","It comes with the Poor Sapphire, a gem tied to a Skyfowl settlement on the third floor. The gem also gives Dexterity and pays taxes every 10 days."],["In use","It's a skill, not a spell. Carl uses it to stomp the heads of downed enemies, and Donut finds it disgusting."]]],["Royal Chariot",["Chariot"],4,4,10,"The armored vehicle the team builds on the fifth floor. Donut named it before it was finished.","",[["What it is","A desert transport Katia drives, with a raised swivel seat for Carl and defenses he adds himself."],["The name","Donut takes one look at it, announces it's the Royal Chariot, and leaves on Mongo."]]],["Gennrik",[],4,34,2,"A tentacle-faced Saccathian bounty hunter working the Earth's surface alongside Sadir.","",[["Role","He scans the ruined surface for marks, including a cat named Gravy Boat. Talk of searching for \"a man and a goat\" hints at a bigger contract."],["Personality","Crude and amused. He chuckles at his partner's injuries and pushes them to move on when a hunt goes cold."]]],["Sadir",[],4,34,2,"A bitter bounty hunter on the surface of Earth, chasing non-crawler survivors for the corporations.","",[["Role","He and Gennrik track creatures and people left on the planet's surface after the collapse."],["Personality","Resentful of the corporations that profit from the crawl, but he takes the job anyway because it pays."]]],["Rory",[],1,15,1,"A goblin with facial piercings who Donut names and bosses around during the first floor's vehicle deal.","",[["Who they are","A captured goblin. Rory and Lorelai end up helping Carl get the goblin engineers to build him a vehicle, in exchange for meth."],["What happens","Both disappear while the engineers work and come back completely blitzed."]]],["Lorelai",[],1,15,1,"Rory's fellow goblin, who sniffs out that Carl's meth was made in the dungeon.","",[["Who she is","The second goblin Donut names. She grabs one of the baggies and immediately knows it wasn't brought in from outside."],["Why it matters","She's part of the strange goblin side quest that ends with Carl getting his first vehicle."]]],["Sapper's Table",["Sapper’s Table"],1,19,10,"The workbench Carl needs to build, modify and rig his explosives and traps.","",[["What it is","A table you buy from a safe room store. Some crafting menus, like the weapons workshop, only open while you're standing at one."],["Uses","Attaching proximity triggers to traps, programming alarm songs, and building more complicated bombs. It's central to Carl's whole style."]]],["Character Actor",[],2,1,12,"The class Donut's Former Child Actor subclass comes from. It lets her take on a different specialty each floor.","",[["How it works","Every floor, she picks a role or specialty and gets its abilities. It's extremely versatile but never quite as good as the real thing."],["Donut's version","Former Child Actor is a rare branch that requires specific achievements."]]],["Black Inquisitor General",[],2,7,12,"Lucia Mar's triple class, a cleric, magic-user and warrior combined.","",[["What it is","A rare triple class that mixes divine magic, arcane magic and frontline fighting."],["Why it matters","It helps explain how Lucia sits at number one on the leaderboard so early."]]],["Forsaken Aerialist",[],2,26,12,"Prepotente's class: an acrobatic, high-flying fighter style.","",[["On the leaderboard","Prepotente the Caprid stays near the top of the rankings with it."]]],["Shepherd",[],2,26,12,"Miriam Dom's class, built around commanding and protecting a herd of goats.","",[["How it works","Her goats are her army. They fight, scout and travel with her, and the class grows stronger through them."],["On the leaderboard","It keeps her in the top ten for floor after floor."]]],["Yarilo",[],4,21,6,"The banished god of Lust. Ghazi tried to free him in exchange for a single wish, but it wasn't Yarilo who answered.","",[["The bargain","Ghazi wanted the legendary Lika to fall in love with him. In return he would free Yarilo from the Nothing."],["The twist","The council concluded that Psamathe had been pretending to be Yarilo all along."]]],["Tripper",[],4,28,11,"A trap spell that trips and snares whoever walks into it. Carl gets it as a cast-once-every-five-hours bonus from gear.","",[["How Carl got it","A late fifth-floor item grants a level-15 Tripper spell every five hours, plus Detect Traps and a remote-detonator perk."],["Use","It's built for an ambush fighter like Carl, who pulls enemies into prepared ground."]]],["Theobold",[],5,63,1,"A level 35 High Elf footman who runs entry procedures at the Butcher's Masquerade.","",[["Role","He handles guests at the queen's ball and recites the security sweep, the timeline and the dress code."],["Personality","Stiff and rule-bound. He won't be drawn on hypotheticals and insists fighting won't be tolerated."]]],["Bopca Protector",[],1,9,9,"Small, magical gnome-like caretakers who run the dungeon's saferooms, like Tally.","",[["What they are","Non-combatant NPCs, barely taller than the counter, who look after saferooms (often fast-food restaurants on the first floor)."],["Known ones","Tally, the first one Carl meets, and Sebastian, who brushes Donut's fur and gives her his brush."],["Why it matters","A saferoom with a Bopca running it means food, rest and safety."]]],["The Bloom",["Bloom"],1,36,8,"An ultra-nationalist kua-tin political movement, now usually just called \"the Party.\"","",[["What it is","A hardline faction among the kua-tin. Mordecai compares it to Axis-era nationalism."],["Positions","They see the Plenty and other galactic changes as insidious plots."],["Connection","A rep tied to the Bloom tries to take over handling Carl's team's account."]]],["King Rust",[],1,47,1,"The ruler of the Skull Empire, father of Prince Maestro. He took a keen interest in Carl.","",[["Who he is","The orc king, who came to Earth orbit during the crawl."],["Politics","Criticized at home for spending too much on the crawl and the Faction Wars, he answered by disowning the Maestro."],["Carl's problem","He's been spending money to send Grull's worshipers after Carl."]]],["The Silk Road",["Silk Road"],2,15,7,"The open market behind one of the Desperado Club's doors. Cheaper than Quint, but the stuff isn't as good.","",[["What it is","One of the club's many rooms, a bazaar of goods and services."],["Notes","Mordecai takes the team there during the recap show, when the music stops."]]],["Imperial Security Trooper",[],2,26,12,"Quan Ch's class: an armored, gear-driven trooper style that grows with the right equipment.","",[["How it works","It leans on tech and armor. Quan's magic jacket sends him rocketing up the rankings."]]],["Blizzardmancer",[],2,26,12,"Elle McGib's ice-magic class, which she later builds on as she evolves.","",[["How it works","A frost caster that freezes and controls the battlefield, a natural fit for her Frost Maiden race."]]],["Bogatyr",[],3,25,12,"Maxim Popov's class, a heroic warrior style named after the champions of Slavic folklore.","",[["How it works","The frontline half of the Popov brothers' shared build. He's paired with Dmitri's Illusionist, so the two Nodling heads fight as one."]]],["Illusionist",[],3,25,12,"Dmitri Popov's class, which works through illusion and misdirection.","",[["How it works","It deceives instead of overpowering. Illusions fade into existence, which tells them apart from changelings, who transform from the mouth outward."]]],["Physicker",[],2,26,12,"Ifechi's class: a field-medic healer.","",[["How it works","A support class built on healing and medicine. It keeps Ifechi on the top-ten board."]]],["Street Monk",[],2,26,12,"Li Jun's unarmed-combat class: a brawler-monk who fights with fists and feet.","",[["How it works","Martial arts without weapons. It's the kind of class Mordecai once suggested to Carl for his own fist-heavy style."]]],["Monster Truck Driver",[],2,21,12,"Katia Grim's class, as baffling as it sounds when Carl first sees it.","",[["How it works","Mordecai can't look up new classes anymore, so even he isn't sure at first. It's built around vehicles and driving, which turns out to fit her perfectly once the team gets wheels."],["Fit","Together with her Doppelganger race, it makes Katia one of the most adaptable members of the team."]]],["Shotgun Messenger",[],2,26,12,"Florin's class: a gun-toting courier who rides shotgun.","",[["On the leaderboard","It keeps Florin the Crocodilian in the top ten across several floors."]]],["Legatus",[],4,4,12,"Bogdon Ro's class: a commander-type, named after a Roman legion's commanding officer.","",[["On the leaderboard","Bogdon stays in the lower top ten through the fifth floor."]]],["Veriluxx",[],4,7,13,"The company behind Veriluxx RealPet Companions, which sends Carl's team a \"benefactor box\" that's really a product sample.","",[["What happened","Donut is thrilled to get a box from them. Loita explains it's not a real benefactor box but a sample sent to selected crawlers to attract more sponsors."],["Advice","Don't badmouth the product on air if you want a real box later."]]],["Commandant Kane",["Kane"],4,6,1,"Commander of the Dirigible Gnomes' Dreadnought Wasteland, and great-nephew of the prisoner Wynne.","",[["Who he is","The gnomes' military leader on the fifth floor. He keeps a mirrored twin of Henrik's watch, which is used to set ransom times."],["Why it matters","The hostage deal, the balloon pick-ups and the gnome negotiations all go through his authority."]]],["Crixus",[],4,12,1,"A Dirigible Gnome sniper aboard the balloon Vahana.","",[["Role","He crews the Vahana alongside Hicks under Leon. He knows the history of the necropolis and reacts fast when the missiles start flying."]]],["Hicks",[],4,12,1,"The Dirigible Gnome pilot of the balloon Vahana.","",[["Role","He flies the Vahana while Leon gives orders. Carl watches him to memorize the controls."]]],["Explosives Handling",["Dangerous Explosives Handling"],1,19,11,"Carl's core bomb-crafting skill line. It reveals extra information about explosives and makes building them safer and stronger.","",[["How it works","As it levels up, examining explosive items shows more detail (like deflagration type), and it improves how Carl handles and builds bombs."],["The skill family","Explosives Handling, Dangerous Explosives Handling, Goblin Explosives and IED all climb together as Carl crafts. Building his own jugs sends them up fast."]]],["Escape Plan",[],2,2,11,"A Compensated Anarchist skill that reveals hidden doors and ways out, as long as Carl knows where he's trying to go.","",[["How it works","It makes secret exits easier to spot and helps plot routes out. On the Iron Tangle he learns it can't invent a map it doesn't have."],["Source","One of the bonuses that came with Carl's Compensated Anarchist class, alongside Find Traps and Backfire."]]],["Ringmaster Grimaldi",["Pestiferous Vine"],2,10,4,"The ringmaster of the third-floor circus. He turns out to be a Pestiferous Vine, a level 85 elite City Boss.","",[["The reveal","Outside the tent, posters show a jolly dwarf ringmaster. Inside, the real Grimaldi is a monstrous plant as tall as the tent."],["The fight","Carl comes in with a plan worked out with Mordecai to poison the vine at its core, and then has to stay alive while it works."],["Connection","He's at the center of Signet's storyline and the Vengeance of the Daughter quest."]]],["Apollon the Mighty",["Apollon"],2,10,1,"A scarred, tattooed ogre strongman, an elite who sells \"Iced Cream\" at Grimaldi's circus.","",[["Who he is","Part of the circus troupe. He runs a frozen-treat stand at the bottom of the bleachers."],["With Carl","He and Carl lock eyes during the Grimaldi crisis, and Carl strolls over and casually asks for an ice cream cone."]]],["Ripper Wonton",[],2,12,13,"Host of the panel show Danger Zone. He's a Setonix, a race everyone calls quokkas.","",[["Who he is","A round-table host who leads conversations among crawlers and galactic celebrities. Donut finds him \"positively adorable.\""],["The show","Danger Zone with Ripper Wonton seats Carl and Donut alongside holographic panelists like Manasa, Tucker and Princess D'nadia."]]],["Evo",[],2,19,13,"The director of Danger Zone with Ripper Wonton, who greets Carl and Donut personally before the panel.","",[["Role","He introduces each panelist and briefs the crawlers before everyone else comes on."]]],["Drakea",["Crawler Drakea"],3,8,0,"Author of the Dungeon Anarchist's Cookbook's 22nd edition, and the most prolific note-writer in it. Drakea survived the last Naga-run season.","",[["In the Cookbook","Emotional and long-winded, with page after page of tips and furious rants about the Nagas."],["Their season","A crawler during the final, disastrous Naga-run season, and partly responsible for what happened to the Nagas."],["Style","Mordecai remembers Drakea as a famous crawler with a class like Carl's, but more magic-based."]]],["Forkith",["Crawler Forkith"],3,8,0,"A 20th-edition Cookbook contributor whose short, practical notes confirm and correct other crawlers' tricks.","",[["In the Cookbook","Confirms the healing-potion smoke trick against undead, updates advice on backpacks and inventory, and warns about deities."]]],["Coolie",["Crawler Coolie"],3,32,0,"A 19th-edition Cookbook contributor whose advice about deities is blunt: avoid all three kinds of summoning.","",[["In the Cookbook","Writes the key section on deity summonings, including the involuntary kind Carl's gauntlet causes. Also describes being taken to a ship in low orbit for a program."],["Tone","Haunted. One note promises revenge on a god for a sister named Barkith."]]],["Herot",[],3,17,0,"Author of the Cookbook's 16th edition, including a long essay on the nature of NPCs.","",[["In the Cookbook","Writes thoughtfully about whether NPCs are real people and what happens to them, which Carl thinks about more and more."]]],["Crowd Blast",[],3,29,11,"Katia's upgraded Rush ability: she slams through packed enemies like a wrecking ball.","",[["How she got it","From a shield that turns her Rush into Crowd Blast and adds Constitution and a Rooted in Place skill."],["In action","She uses it to plow through hallways packed with Krakaren monsters and ghouls on the Iron Tangle."]]],["Laundry Day",[],3,32,11,"A spell for stripping biological armor, mentioned as a way to remove a god's flesh suit.","",[["What it does","In theory it, or the cruder \"Take That Shit Off,\" can peel off armor made of flesh, as long as you've already gotten past the invulnerability."]]],["Feather Fall",[],4,10,11,"A potion (and effect) that slows a fall. Common later on, but rare on the fifth floor.","",[["Why it matters","The plan needs it, but Mordecai says the seed pods to brew it are scarce until the sixth floor."]]],["Smush",[],1,8,11,"An early skill of Carl's that boosts stomping and crushing enemies underfoot.","",[["How he got it","At level three, along with Foot Soldier for kicks."],["Growth","It keeps leveling as Carl fights, and it's part of his whole unarmed, stomp-everything style."]]],["Iron Punch",[],1,12,11,"A punching skill that makes Carl's fists hit like iron.","",[["How it works","More damage on closed-fist strikes. His Grull gauntlet adds two levels, and it stacks with Pugilism and Powerful Strike."]]],["Iron Skin",[],1,12,11,"A potion (and skill) that hardens the drinker's natural armor for a few minutes.","",[["In use","Carl gets a stack of them early and makes both himself and Donut drink one before risky fights."]]],["Pugilism",[],1,5,11,"The art of beating people with closed fists. One of Carl's earliest combat skills.","",[["How it works","Each level boosts fist damage. Combined with Unarmed Combat, it makes Carl's punches stronger than most early weapons."]]],["Powerful Strike",[],1,6,11,"A skill that adds raw power to a single blow.","",[["How it works","Carl boosts it with the Toe Ring of the Splatter Skunk and his Grull gauntlet. With Iron Punch and Pugilism, his fists hit as hard as a light weapon."]]],["Determine Value",[],1,19,11,"An appraisal skill that tells you what loot is worth. Carl keeps getting potions for it.","",[["How it works","Higher levels give better price estimates. Carl gets several skill potions for it from Looter Boxes, and the menu text mocks him about collectible card games."]]],["Find Traps",["Find Trap"],2,2,11,"A skill that warns of nearby traps. It came with Carl's class, but it has to be trained before it warns in time.","",[["How it works","The Compensated Anarchist class gave it +5. The first time it fires is on the Iron Tangle, almost too late."],["Lesson","After the fire-ant trap, Carl resolves to train it seriously."]]],["Fireball",[],1,39,11,"The classic fire spell. Mordecai uses it to explain why skills above level 15 are such a big deal.","",[["Scaling","A level 15 Fireball ruins most monsters' day. A level 16 Fireball is about four times as strong."],["In the dungeon","Also shows up on gimmick items like the \"Fireball or Custard\" scratch-off ticket."]]],["Heal",[],1,5,11,"Carl's basic healing spell, a lifesaver in the early floors.","",[["In use","Carl casts it mid-fight to stop bleeding after shrapnel tears into him. His tiny mana pool means he gets only a cast or two."],["Not to be confused with","Heal Critter, the pet-only version Donut gets."]]],["Fear",[],2,2,11,"A cheap debuff spell that comes with Carl's class and makes enemies panic.","",[["How he got it","A bonus from choosing the Compensated Anarchist class. It costs three mana."],["Advice","Mordecai tells him to use it in every fight on the third floor to train it up."]]],["Wall of Fire",[],4,2,11,"Donut's 15-mana escape spell: a wall of fire about 10 meters wide and two meters high.","",[["How she got it","The spellbook was in her final platinum box at the start of the fifth floor."],["In use","Mordecai calls it an escape spell. It doesn't always go to plan. Against waves of exploding gerbils, casting it turns out to be a mistake."]]],["Poison Cloud",[],5,24,11,"A toxic-cloud effect. On the sixth floor, Carl finds a throwing machine that adds it to anything it launches.","",[["How it shows up","A contraption with magical bamboo stalks makes every thrown object carry Poison Cloud. It has a 90-second cooldown."]]],["Charm Animal",[],5,43,11,"A potion that has to be brewed for one specific animal, and it needs a special ingredient.","",[["Why it matters","Carl gets a recipe for it on the sixth floor and shares it along with a photo of Mongo. It's tailored to a single target, not any animal."]]],["Size Up",[],5,48,11,"A scroll of a buff spell. Prepotente is hoarding more than forty of them.","",[["How it shows up","Carl spots the stack among Prepotente's things and quietly takes two."]]],["Divine Intervention",[],4,14,11,"A 60-second invulnerability aura that comes with a god-summoning grenade.","",[["How Carl got it","The celestial grenade summons a god for sixty seconds and protects whoever threw it for the same time."],["In use","It saves Carl from the heat of a summoned god's floating head. He doesn't even realize he's protected until afterward, and Donut wasn't covered."]]],["Bomb Maker's Workshop",["Bomb Maker’s Workshop"],5,1,10,"The advanced explosives crafting menu Carl unlocks at the start of the sixth floor.","",[["What it gives","Better bomb crafting than the Trap Maker's Workshop, plus faster explosives training. It came with his sixth-floor class upgrade, along with a Sapper's Table level and Explosives Handling."]]],["Hobgoblin Pus",[],1,17,10,"A C4-like goblin explosive that's set off by a proper trigger. It's much more stable than goblin dynamite.","",[["Why Carl loves it","It's controlled and remote-detonated, unlike unpredictable goblin dynamite. He gets globs from boss boxes and hides them in walls and shelves as surprise charges."]]],["Goblin Copper Chopper",["Chopper"],1,16,10,"Carl's first vehicle: a goblin steam-bike with a sidecar for Donut, held together with chewing gum.","",[["What it is","A rickety junkyard motorbike with an unreliable steam engine. It's the goblins' preferred assault vehicle."],["How he got it","Through the strange deal with the goblins Rory and Lorelai on the first floor."],["In use","A Chopper Pilot skill grows as he drives. At level 5 he can push the throttle for more speed."]]],["Looter Box",[],1,19,10,"A gold reward box Carl earns for carrying over a ton of weight in his inventory. It keeps giving him Determine Value potions.","",[["What it gives","Mostly skill potions, so far always for Determine Value."]]],["Randall",[],1,27,1,"An elderly Meadow Lark resident with a walker, traveling with Brandon and Yolanda's group.","",[["Who he is","One of the retirement home residents Carl's group helps protect. He wanders into dangerous rooms without realizing it."],["On the train","He's thrown from the last car when a train lurches forward, right as a monster forms nearby."]]],["Faction Wars",[],1,43,13,"A war game on the ninth floor, where galactic factions send their own forces into the dungeon to compete.","",[["How it works","Nine factions fight on the ninth floor. Tourists and managers playing it get protection packages, so they're kicked out instead of truly dying."],["The players","The Skull Clan has won six of the last ten. The Blood Sultanate is usually knocked out first and only has a seat because it bought one early."],["Seasons","Not every season includes it. The Squim Conglomerate's battle royale format skips Faction Wars entirely."]]],["Skull Clan",[],1,43,8,"The ruling family of the Skull Empire, the orc royal line that includes King Rust, Prince Maestro and their siblings.","",[["Reputation","They've won six of the last ten Faction Wars and placed top three every time."],["Carl's view","On Odette's show, Carl says he doesn't know anything about the Skull Clan or its king, and the audience loves it."]]],["Squim Conglomerate",[],1,4,13,"A rival corporation that runs crawls as all-out battle royales instead of dungeons.","",[["Their format","An entire world fights, for example \"Battle for the Planet Aryl.\" There's no Faction Wars or Celestial Ascendency segment."],["Why it matters","It shows that Borant's dungeon format is only one of many kinds of crawl."]]],["Pork Boy Snick",[],1,44,13,"A viral video tied to Carl's feud with Prince Maestro. It appears out of nowhere right after their on-air clash.","",[["What it is","A video by an unknown creator, very \"generous\" in how it depicts Carl, that trends across the galaxy's social media within hours."],["Why it matters","It turns Carl's on-air feud with the Maestro into a phenomenon. Donut finds it hilarious."]]],["Incubus",["Incubi"],2,1,9,"Mordecai's race on the third floor. Called the \"Gigachad of the Over City,\" incubi are the male counterpart of succubi.","",[["What they are","Smooth, seductive and ultimately deadly, built on charm."],["Weakness","Alcohol. Mordecai learns this the hard way during a long night in an Over City pub."],["Fun fact","Donut tries to get Carl to pick Incubus or Changeling for his own race."]]],["Naughty Boys Employment Agency",[],2,2,8,"An invite-only quest guild Carl got access to through his class. It offers special quests with special rewards.","",[["What it is","A high-end jobs board. Normally a membership costs 500,000 gold, but Carl's Compensated Anarchist class included it."],["Mordecai's take","At first he's never heard of it and guesses it's a quest-giving guild."]]],["Water Lily",[],2,8,11,"An heirloom sleep curse from the naiad royal line. Signet's mother taught her the spell, and it puts Donut and Heather into enchanted sleep.","",[["What it does","Puts the target into a deep, magical sleep that's hard to break. Heirloom magic, the strongest kind."],["Why it matters","It drives the third floor's Signet storyline and the hunt for a cure."]]],["Gordo",[],2,4,1,"The Bopca who runs the saferoom pub where Carl's team stays on the third floor. Devoted to Donut.","",[["Who he is","Primly scandalized by Mordecai's antics (\"This is a family establishment!\"), but eager to fetch anything Donut asks for."],["Moment","He's found passed out at the table, snoring like a chainsaw, after a long night with Mordecai."]]],["King Finian",[],2,6,1,"The High Elf king who ruled the Liana Sector of the Hunting Grounds, and Signet's notoriously lecherous father.","",[["Who he is","Infamous for his affairs. That's how Signet came to be half naiad and half High Elf."]]],["Sensation Entertainment",[],2,12,13,"The company behind the program Carl and Donut sign with on the third floor. Based in the galaxy's central systems.","",[["What it is","A production company from one of the more integrated center systems, where audiences go for scripted drama in a way the kua-tin don't."]]],["Princess Formidable",[],3,12,1,"The youngest sister of Prince Maestro and Crown Prince Stalwart of the Skull Empire. She becomes Katia's sponsor.","",[["Role","She sponsors Katia, and her gifts seem aimed more at needling her brothers than at helping."]]],["Dismemberment Limited",[],3,12,7,"A Nightmare Express line on the fourth floor. Trains come every 48 minutes, and Katia plans a shortcut through it.","",[["Why it matters","Jumping lines to catch the Dismemberment Limited is part of Katia's route across the Iron Tangle. Bautista confirmed it stops where they need it to."]]],["Princess Posse",[],3,20,13,"Donut's fan base: her loyal viewers, who she says get their \"daily Donut fix.\"","",[["What it is","The fandom Donut cultivates on purpose. It brings in real money and donations."]]],["Celestial Ascendency",[],3,32,13,"The gods' own game, played on the 12th floor, where rich sponsors back deities competing for the Celestial Throne.","",[["How it works","Gods like Apito and Eris are sponsored by wealthy players who pay extra. Gods sometimes get called away from it, for example by summonings on lower floors."],["Players","Grull is one of the few trueborn heirs. Emberus believes he's the best candidate for the throne."]]],["Extinction Sigil",["Extinction Sigil Tattoo"],4,2,10,"A lizard-foot tattoo the game puts on Carl for killing so many Wall Monitors. Lizards now hate him.","",[["What it does","It marks him for the Wall Monitor race. Lizard-class mobs deal 20% more damage to him."],["Donut's take","She thinks it looks like a cute gecko-foot freckle."]]],["Changeling Principal",[],4,6,9,"A high-ranking changeling: a skilled shapeshifter that can stay disguised as a specific person for a long time.","",[["Known ones","Svern (level 49) and Henrik on the fifth floor."]]],["Vahana",[],4,11,10,"The oldest balloon left on the Dirigible Gnomes' dreadnought Wasteland, used for prisoner exchanges.","",[["Crew","Pilot Hicks and sniper Crixus, led by Leon the Commissar."],["Why it matters","Carl's
