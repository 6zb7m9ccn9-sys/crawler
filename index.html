r. He has no patience for the show and a lot of anger at it, and he survives the first two floors on traps, his fists and stubbornness. Along the way he links up with Brandon's group from the Meadow Lark retirement home and makes enemies of Frank Q and Maggie My. He also discovers that blowing things up is a strategy that gets him noticed."],[2,0,"On the third floor Carl becomes a real explosives specialist and turns a circus district into one large trap. He gets involved with the half-elf Signet and Grimaldi's circus and kills Miss Quill. His habit of ignoring the showrunners' script makes him a fan favorite, which in turn makes him a target."],[3,0,"On the Iron Tangle Carl inherits The Dungeon Anarchist's Cookbook and starts adding his own notes to it. Teaming up with Imani, Elle, Bautista and Li Jun, he coordinates hundreds of crawlers across the subway network. He also survives Hekla's plot against Katia, and his rivalry with Borant grows more personal."],[4,0,"In the bubbles of the fifth floor Carl leads the air quadrant. He manages gnomes, an air castle and the Mad Dune Mage, and ends up at the Necropolis of Anser. He deals with Maggie My for good, picks up Louis, Firas and the cursed doll head Samantha, and at the end of the floor accidentally lets a feral god into the world."],[5,1,"Carl picks a new class for the sixth floor and is immediately hunted. This floor's hunters are paying off-worlders who are there to collect crawler scalps."],[5,5,"His answer to being hunted is to raid Zockau, the hunters' own city. That move sets the tone for the whole floor."],[5,35,"After he wounds the mantis hunter Vrah with an arrow carrying a very embarrassing disease, he becomes the most talked-about crawler of the season."],[5,56,"Carl starts planning how he and his allies will get through the Butcher's Masquerade at the High Elf castle."],[6,1,"Carl and Donut land in Havana's capitol building on the eighth floor, The Ghosts of Earth, after the crawl skipped a floor entirely. They drop to number three on the leaderboard."],[6,3,"His celestial box gives him the Scavenger's Daughter, a divine back patch for his jacket. Its hidden one-time Mysterious Bone Key can open any lock, at the cost of one of his own bones."],[6,12,"On Rosetta's show, the interview turns to his dead mother. It's the first of several times this floor uses his past against him."],[6,16,"The Orisha shrine fight goes badly. Ogun smites Anton, and Carl carries that with him."],[6,18,"As a worshipper of Emberus he can enter Club Vanquisher, where Pater Coal gives him the Martyr's Path."],[6,19,"Katia tells him about the Crown of the Sepsis Whore, and he commits to a dangerous plan to get her out of it."],[6,33,"He and Katia carry out the Guild of Suffering assassination inside the Desperado Club. It works, and it costs him."],[6,39,"By phase two he's level 68, fighting his way along a road of frozen deckmasters in the Florida Keys."],[6,45,"The floor makes him walk through a recorded memory of his father's last days. He sees things he never knew, including the existence of a half-brother."],[6,47,"His suffering pleases Emberus, who raises him to Devotee."],[6,49,"Alone on Christmas night, he rides his father's motorcycle north to a homeless shelter in Homestead to follow a lead."],[6,51,"There he hears the Residual Paulie's speech and gets a rare, direct conversation with Orren."],[6,62,"With the stairwells broken, he and Pony come up with a theory for saving the crawlers who don't have keys, and he spreads the word."],[6,69,"In the fight with Amayon, he gets his Martyr's Path to go off when it matters most."],[6,71,"Combined with Shi Maria during the battle, he wakes to find her eye tattooed on his chest."],[6,72,"He leaves the floor swearing to make his brother's death count."]],"Princess Donut":[[1,0,"Donut is Bea's prize-winning Persian show cat. In the tutorial guildhall she eats an enhanced pet biscuit and becomes a talking crawler. She is vain, dramatic and obsessed with her fans, and she is also braver than Carl expects. On the first floors she learns Magic Missile and fights with a lot of attitude. She starts going by \"Princess Donut\" and insists everyone else does too."],[2,0,"On the third floor Donut grows into a real spellcaster and a celebrity. She picks fights with rival pets such as Lucia Mar's rottweilers. Raising baby Mongo becomes the center of her world."],[3,0,"On the Iron Tangle she is busy with her fan club, her charm skills and her friendship with Katia. She is also one of the people Hekla tries to pull away from Carl's party."],[4,0,"On the fifth floor Donut is a full party leader, and her charm and negotiation skills carry several of Carl's schemes. She is heartbroken about her past, but she still insists on being the star of every room."],[5,17,"Donut appears on Odette's show, where the reunion with Bea is set up and plays out live."],[5,35,"Donut fights Lucia Mar on her own. The recap shows the fight in full, and it becomes one of the highlights of the floor."],[5,56,"Donut puts together a dance act with Mongo, Kiwi and the dinosaurs for the Butcher's Masquerade talent show."],[6,1,"Donut gives up Viper Queen and picks Master Telephone Psychic. She gets Brain Freeze, Bad Attitude, Why Are You Hitting Yourself? and a much bigger map."],[6,4,"She's outraged by the squad flag, a pair of heart-print boxers, and outraged again to meet a Havana brown cat girl."],[6,9,"As squad leader she runs the deck and turns out to be a real card strategist."],[6,19,"She learns the truth about Katia's crown and how it could set the two of them against each other."],[6,24,"Her new citrine tiara gives her the Hover skill, which she uses constantly."],[6,37,"She's sent alone into a real card fight on live TV and wins it."],[6,43,"While Carl recovers, she tells him she's trying to be more like him. He tells her to be herself."],[6,56,"A mistake under pressure leaves her convinced she's doomed Imani. Carl talks her back into fighting."],[6,62,"The Princess Posse doesn't leave anybody behind, she declares, though the line is borrowed from a movie."]],"Mongo":[[1,0,"Donut gets Mongo as a hatchling at the end of the second floor. He starts as a tiny, peeping chick-sized dinosaur."],[2,0,"By the third floor Mongo is a Mongoliensis, a fast, velociraptor-like predator. He is devoted to Donut, always hungry and vicious in a fight. When things get too dangerous he rides in a magical pet carrier."],[3,0,"On the Iron Tangle Mongo keeps growing. Donut treats him as her baby and panics whenever he is in danger."],[4,0,"On the fifth floor he is a reliable fighter. His most satisfying moment comes at the very end, when he puts a final stop to the Frank Q and Maggie My story."],[5,11,"In Point Mongo, a region full of dinosaurs, Mongo meets other Mongoliensis, including Kiwi, a pink-feathered female who leads the local pack."],[5,49,"Mongo and Kiwi start fighting side by side, with Kiwi's pack following along."],[5,73,"At the masquerade, Mongo and Kiwi tear into Vrah together."],[6,7,"Mongo starts the floor by eating a duende that happens to be named Mordecai."],[6,37,"In the phase-two choosing arena he ends Donut's fight in one leap."],[6,72,"He loses a wing in the chaos at the end of the floor. Donut says one of the upgraded potions might grow it back."]],"Mordecai":[[1,0,"Mordecai is Carl and Donut's game guide. He runs the guildhall they return to between floors and cannot leave it. On the first floors he is a level-50 Rat Hooligan. He is gruff and drinks too much, but he quietly cares about them. He teaches them how the crawl really works, and in the guild he tells Carl to feed Donut the biscuit that changes her. By the third floor his body has changed into a Bugaboo, a large, shaggy, owl-eyed creature."],[2,0,"Mordecai's form keeps changing between floors. He brews potions, explains what the rules allow and keeps Carl from getting himself killed. The showrunners are watching more closely now, so he has to be more careful about what he says."],[3,0,"On the Iron Tangle Mordecai spends a lot of time in the crafting rooms. He brews potions and supplies for the party and helps Carl make sense of the Cookbook."],[4,0,"On the fifth floor he becomes a planner and alchemist. He tells the party exactly which monsters to stay away from and keeps the stock of potions and explosives coming."],[5,21,"On the sixth floor Mordecai is still the strategist behind the scenes. He pushes Carl to use his head instead of charging in."],[5,67,"Someone from Mordecai's old crawl turns up. It is a reminder that he was a crawler himself once."],[5,75,"Mordecai has been part of the party for the end of the floor. He expects to drop out of it automatically when they go down to the next floor."],[6,0,"The prologue shows his own crawl long ago with Odette, his brother Uzzi, Chaco and Hold Steady, and how it ended in betrayal."],[6,2,"His eighth-floor form is a pink, one-eyed Hills Cyclops who sounds like Patrick Star."],[6,20,"He has secretly been looking after Ruby and the other vulnerable changelings."],[6,30,"He works out what Katia has been taking and gets the cures brewing."]],"Katia":[[2,0,"Katia Grim is introduced on the third floor as a member of Hekla's guild. She has an odd class, Monster Truck Driver. Her race is listed as human, but she is really a doppelganger who can reshape her body. She ends up joining Carl, Donut and Mongo."],[3,0,"On the Iron Tangle Katia grows into her powers. She can add or move mass to become a wall, a battering ram or a giant. She falls into a hard position between Carl's party and her old guildmates. When Hekla turns on her, Katia kills Hekla with a battering-ram move."],[4,0,"On the fifth floor Katia sews, builds and leads, and she becomes much more confident. By the end of the floor she has her own team and is no longer just Carl's sidekick."],[5,21,"On the sixth floor Katia leads her own group alongside Elle, Bautista, Florin and others. They raid towns and hunt hunters."],[5,43,"Katia spends much of the floor chasing Eva Sigrid's team. Hekla's old ally is a grudge she will not drop."],[5,65,"At the masquerade, Katia has to be physically held back from attacking Eva."],[6,15,"Mid-fight, she sends Carl an urgent message: repair Yemaya's shrine, not Ogun's."],[6,19,"She has the Crown of the Sepsis Whore. Eva put it on her in her final moments. Her way out is the Orchid of Eileithyia's Grace, locked in the Night Wyrm's box."],[6,28,"She finds a Desperado Club drug den and doesn't wake up for hours."],[6,30,"Mordecai finds she's hooked on four drugs, and treatment begins."],[6,33,"With Carl she pulls off the Guild of Suffering job and gets the orchid."]],"Bea":[[1,0,"Beatrice is Carl's ex-girlfriend and Princess Donut's owner, and she showed Donut competitively. She was out of town when the world ended, so Donut was left with Carl. Donut talks about her often. Carl has mixed feelings about her."],[5,18,"Bea is alive. She appears on Odette's show, where it comes out that Odette rescued her and is using her as leverage against the Borant Corporation."],[5,19,"The on-air reunion is hard on Donut, and Carl has to deal with what it leaves behind."]],"Zev":[[1,0,"Zev is a kua-tin from the Borant Corporation who works as Carl and Donut's publicist and handler. She books interviews and appearances and tries to keep them on-message."],[2,0,"Kua-tin can't be filmed, so Zev's conversations with Carl are some of the most candid in the series. She warns him as much as her job lets her."],[5,6,"On the sixth floor Zev is still their contact for shows and appearances. She keeps passing them updates on their ratings."],[5,20,"Carl suspects that Donut and Zev have some kind of private signal system."],[5,62,"Zev warns Carl, more than once, not to try anything clever at the masquerade. As usual, he does not listen."],[6,7,"Zev books Carl and Donut on a sponsor-owned interview program and warns them off any talk of Bea."],[6,45,"She confirms that the memories of Carl's father were recorded from real life."]],"Odette":[[1,0,"Odette hosts Dungeon Crawler After Hours, one of the most-watched talk shows about the crawl. She wears a distinctive bug-like helmet."],[2,0,"Carl and Donut keep coming back to her show. Off the air she gives Carl blunt advice about how the galaxy and the show work, and it is clear she has an agenda of her own."],[5,17,"Odette brings Carl and Donut back onto her show and stages a reunion with Bea, whom Odette has been holding as leverage against Borant."],[5,20,"Afterward Odette passes Carl sensitive information through her assistant, Lexis, so it can't be traced back to her."],[6,0,"The prologue: Odette's own crawl, Mordecai's party, and a deal with Huanxin that went very wrong."],[6,7,"She takes several days off and moves into orbit for Faction Wars."],[6,36,"She announces live that she's sponsoring a goddess and entering the Celestial Ascendency herself."],[6,37,"She tells Carl, cryptically, that this is the season to end all the suffering."]],"Imani":[[1,0,"Imani C was a nurse at the Meadow Lark retirement home. When the dungeon opened, she, Yolanda and the brothers Brandon and Chris led residents into the dungeon and kept them alive. She is calm, capable and a healer. She is also willing to tell Donut off when Donut has earned it."],[2,0,"Yolanda and Brandon are dead, and Imani is the anchor of what is left of the Meadow Lark group."],[3,0,"On the Iron Tangle Imani and Elle run their own group of crawlers. They work closely with Carl and coordinate rail lines and stations across the subway."],[4,0,"On the fifth floor Imani's group is stranded on a floating island made of boats. She is one of the first people Carl turns to, and she insists on trying to save Chris after he changes."],[5,36,"On the sixth floor Imani is part of the crawler alliance that plans with Carl."],[5,61,"In the run-up to the masquerade Imani takes an active role in the fighting and coordinating."],[6,1,"She starts phase one in a western US indoor water park, in a different squad from Elle."],[6,28,"She's the first to get Katia through the aftermath of the drug den. She knows the warning signs."],[6,60,"She holds the church stairwell while Carl and Donut fight their way toward her."]],"Elle":[[1,0,"Elle McGibbons was a resident of the Meadow Lark retirement home who used a wheelchair. Carl helps push her into the storm shelter during the early chaos."],[3,0,"Elle comes into her own as a Frost Maiden Blizzardmancer. She can fly and freeze whole crowds of ghouls, and she has a sharp tongue. She often leads strike teams for Imani's group and breaks into the top-ten list."],[4,0,"On the fifth floor she is one of the strongest crawlers around. She can crash an air castle with her ice spells and has a knack for telling when someone is lying."],[5,21,"On the sixth floor Elle raids towns alongside Katia's group."],[5,53,"A group of hunters makes Elle one of their main targets."],[6,4,"Elle spots a bigfoot in Bermuda shorts. She goes on to build a \"squatch squad\" of totems."],[6,30,"She backs Carl's plan to force Katia back to the pool."],[6,63,"\"Okay, warlord,\" she says, handing Carl the plan."]],"Brandon":[[1,0,"Brandon An was a maintenance worker at the Meadow Lark retirement home. He and his brother Chris helped lead its residents into the dungeon. He fights with a lightning-charged maul. He is one of the first crawlers Carl really works with, and they set up chat together."],[2,0,"Brandon dies on the third floor protecting his team from shade gremlins. His last message, which mentions his estranged brother, stays with Carl."]],"Chris Andrews":[[1,0,"Chris is Brandon's quiet younger brother, also a maintenance worker at Meadow Lark. He fights next to Brandon on the first two floors."],[2,0,"Chris and Brandon have a falling-out and split up just before Brandon dies. Chris goes off on his own."],[3,0,"Chris picks a rock-creature race and cuts off contact with Imani. The crawlers who knew him say he has changed."],[4,0,"Chris's race is Igneous. He kills Frank Q in the Desperado Club and is banned from the club for it. Later he and Maggie My end up trapped together in a flooded tomb."],[6,1,"He's traveling with Li Na's group in Beijing."],[6,40,"He scouts ahead to the final boss and finds the way blocked by a giant vending machine that takes tokens."]],"Yolanda":[[1,0,"Yolanda Martinez was a nurse at Meadow Lark alongside Imani. She dies on the second floor protecting the group from a rage elemental, and the show replays her death in cruel slow motion."]],"Agatha":[[1,0,"Agatha is a homeless woman with a shopping cart full of spray paint who Carl runs into on the first floors. The show edits her out of a boss fight, and her disappearance bothers Carl."],[3,0,"Agatha turns up again at the end of the Iron Tangle. She is still pushing her shopping cart and still hasn't picked a class."],[4,0,"By the fifth floor Agatha is a low-level crawler with a strange habit of surfacing at important moments. Carl has decided to leave her alone."],[6,51,"Orren confirms that Agatha is a Residual, though not the same kind as Paulie."],[6,73,"The epilogue finally shows who Agatha really is and what she has been waiting for."]],"Frank Q":[[1,0,"Frank Q is one of the first crawlers to kill other crawlers. He and his partner Maggie My attack Carl and Donut in a saferoom, and Carl comes to hate them. They strip the bodies of crawlers they kill."],[3,0,"Frank becomes a Night Elf Blood Assassin. Carl learns that he has been killing in the hope of giving his daughter a chance."],[4,0,"Frank gives Carl the Ring of Divine Suffering. Soon after, Chris crushes his head at the Desperado Club bar."]],"Maggie":[[1,0,"Maggie My is Frank Q's partner. She and Frank claimed to work in customs enforcement. On a live show she swears to watch Carl and Donut die, and a sponsor gives her a legendary skill potion."],[4,0,"Maggie has become twisted and obsessed. A sponsor gives her a grenade meant to summon a pain god and kill Carl. After she and Chris end up trapped together in a tomb, she gets free and hunts Carl across the bubble. In the end Mongo kills her."]],"Hekla":[[1,0,"Hekla is an Icelandic crawler who is featured on the show early on."],[2,0,"Hekla builds an all-women guild called Brynhild's Daughters. As an Amazonian Shield Maiden she climbs the leaderboard. Katia starts out in her group."],[3,0,"Hekla is charismatic, scheming and armed with a powerful crossbow. She is friendly to Carl's party while trying to pull Donut and Katia away from it. When that fails she tries to kill Katia, and Katia kills her instead."]],"Eva":[[3,0,"Eva Sigrid is one of Hekla's Daughters and her close ally. She fights with whirling swords and takes part in the attack on Carl's party. She escapes after Hekla dies."],[4,0,"Carl learns that Hekla and Eva had planned to use Katia as bait."],[5,8,"Eva is now a half-nagini, half-orc Nimblefoot Enforcer on the top-ten list."],[5,36,"She has joined Team Cichociemni, a dangerous group, and Katia hunts her for most of the floor."],[5,51,"Eva's team is mostly wiped out, but she escapes yet again."],[5,64,"At the masquerade, Eva turns up as a guest."]],"Lucia Mar":[[1,0,"Lucia Mar is a young, fierce crawler who fights with her two rottweilers, Cici and Gustavo, and quickly becomes a frontrunner. She hates crowds and does terribly at publicity."],[2,0,"She becomes a Lajabless Black Inquisitor General and spends a long time at number one on the leaderboard. Donut's challenge to Lucia's dogs turns into a lasting feud."],[3,0,"On the Iron Tangle she keeps tearing through the dungeon, holding off ghoul hordes and smashing monsters into trains. At the end of the floor she kills Ifechi, which makes her Florin's sworn enemy."],[4,0,"On the fifth floor she finally loses the top spot."],[5,15,"The mantis-run Dark Hive claims her as one of their hunting targets."],[5,29,"She becomes a mayor. In her pretty form she fights a stegosaurus-like boss."],[5,35,"Lucia and Donut fight, and the recap shows the whole thing."],[5,63,"At the masquerade Lucia is near the top of Carl's list of people to watch."],[6,63,"The most isolated crawler in the dungeon passes along something that could bring everyone together."]],"Li Jun":[[3,0,"Li Jun is a street-monk crawler who briefly appears on the top-ten list. He leads his own group alongside Imani and Elle on the Iron Tangle. His best friend has complicated feelings about Li Jun's sister, who has become a demon."],[4,0,"On the fifth floor his team fights alongside Elle, Donut and Katia."]],"Prepotente":[[2,0,"Prepotente is a goat that ate an enhanced pet biscuit and became a crawler. Now a Caprid Forsaken Aerialist, he enters the top ten."],[3,0,"He is grandiose, theatrical and a real threat. He travels with Miriam Dom and enjoys long talks about hip-hop."],[4,0,"Prepotente is a skilled caster who can stack potions and spells to knock out province bosses."],[5,6,"Prepotente, Miriam and Bianca save Carl and Donut."],[5,8,"He changes class to Profane Vitiate."],[5,48,"Prepotente is devastated when Miriam dies."],[6,1,"He ditched the party before the floor started and is in the Bahamas, asking Carl to read him the lore book."]],"Miriam Dom":[[2,0,"Miriam Dom is a Shepherd crawler who entered the dungeon with her goats. She travels with Prepotente and Bianca."],[3,0,"She is one of the top-ranked crawlers. She and Prepotente lose out on a province-boss kill twice."],[4,0,"Miriam can cast spells that knock out huge bosses."],[5,6,"Miriam, Prepotente and Bianca rescue Carl and Donut."],[5,8,"She is now a vampire Shepherd."],[5,48,"Miriam dies protecting Prepotente."]],"Bianca":[[5,6,"Bianca Del Ciao is Miriam's hellspawn familiar, a goat so black it seems to swallow light."],[5,67,"Prepotente takes Bianca on stage with him at the masquerade."]],"Florin":[[2,0,"Florin is a Crocodilian crawler with a shotgun who makes the top ten."],[3,0,"His class is Shotgun Messenger, and on the Iron Tangle he is at number four. He travels with Ifechi, and at the end of the floor Lucia Mar kills her."],[4,0,"A recap gives Florin's background. He says he is French but has an Australian accent, and he was doing private security work in Africa when the world ended. He drops out of the top ten while he grieves."],[5,21,"Florin raids alongside Katia's group. He is withdrawn and grieving."],[5,63,"Florin learns that Queen Imogen is actually Ifechi."],[5,68,"The others try to keep Florin away from Lucia Mar."],[6,57,"He goes through a stairwell early to test Carl's trap idea, and it fails."],[6,63,"Lucia Mar helps the group, she says, because Florin asked."]],"Ifechi":[[3,0,"Ifechi is Florin's partner. At the end of the Iron Tangle, Lucia Mar kills her."],[4,0,"A recap tells her story. She was a medic who entered the dungeon with a group of soldiers. After a boss wiped them out, she wandered alone until she found Florin."],[5,63,"Queen Imogen of the High Elves turns out to be Ifechi."]],"Signet":[[2,0,"Signet is the half-elf daughter of the late High Elf king, covered in living tattoos that can fight for her. The high elves hunted children of mixed blood, so she ran away to Grimaldi's circus. Carl meets her as an elite NPC. Her story drives much of the circus district."],[5,13,"Signet comes back on the sixth floor as a powerful elite with an ogre bodyguard, Areson the Wise."],[5,14,"She tells Carl how Grimaldi freed her circus family, and how her half-sister Imogen destroyed her village."],[5,15,"Her quest is to kill the leaders of the Naiad Confederacy, who are dug in at Fort Freedom."],[5,29,"Edgar, a tortoise, gives her new tattoos."],[5,72,"At the masquerade she confronts her sister directly."]],"Grimaldi":[[2,0,"Grimaldi ran the traveling circus whose performers became the mobs of the third-floor circus district. He took Signet in. The circus has a dark history, and Grimaldi turns out to be very different from what he first seems."],[5,14,"Signet tells Carl that Grimaldi killed the parasites and set the circus family free."],[5,62,"After coming to this world, Grimaldi was planted beside a tree and grew into it."]],"Miss Quill":[[2,0,"Miss Quill is a Skyfowl who keeps glass cases of beanie-baby-style toys. She is entangled in the third floor's schemes, and Carl kills her."]],"Bautista":[[2,0,"Daniel Bautista is a Tigran Swashbuckler who killed the boss called The Divider."],[3,0,"Bautista is one of Carl's main contacts on the Iron Tangle. He is generous with information and leads a large group down the line. He loses many people getting them to a safe station."],[4,0,"On the fifth floor he clears all four castles in his quadrant, though most of the people in his bubble die."],[5,21,"On the sixth floor he raids towns with Katia's group."],[5,65,"At the masquerade he helps hold Katia back from Eva."],[6,2,"His box gives him a shape-changing ring."],[6,19,"He backs Katia through the crown crisis, exhausted but determined."]],"Louis":[[4,0,"Louis Santiago is a Pest Exterminator crawler. He is good-natured and a bit hapless, often drunk, and good for laughs. He and his friend Firas join Carl's group on the fifth floor."],[5,21,"On the sixth floor Louis floats above raids and helps direct them."],[5,36,"Katia has been teaching him combat moves, and he loves showing them off."],[6,22,"He's grieving Firas. Juice Box is relieved to hear Louis is all right."],[6,62,"He picks up his first player-killer skulls and hates it."],[6,65,"He steps in to take on an awful job himself so the others won't have to."]],"Firas":[[4,0,"Firas M is a Hammersmith crawler and Louis's friend. He is steadier than Louis and becomes a reliable companion on the fifth floor."],[5,21,"On the sixth floor he helps direct raids with Louis."]],"Samantha":[[4,0,"Samantha is the name her friends used for Psamathe, a minor goddess whose father banished her into the Nothing. What is left of her lives in a love-doll head that Carl's party carries around. She curses constantly and is eager for violence."],[5,13,"Samantha is a half-naiad, though she looks mostly human."],[5,22,"On the sixth floor she can now roll around on her own and bite people."],[5,37,"Lucia Mar's dog Gustavo chews on her for a while."],[5,71,"At the masquerade she does something reckless and important with a mouthful of crystals."],[6,4,"She's annoyed that the memory ghosts ignore her, and she makes up for it with threats."],[6,8,"A giant spider swallows her, and she decides the spider is her new best friend."],[6,26,"She tries to get Shi Maria to give her a body."],[6,32,"Inside the Desperado Club, she's the distraction in Carl's plan, and she has a history with the demon Minge."],[6,57,"When Carl needs a spell boosted at the last moment, she turns out to be the one who can do it."]],"Gwen":[[4,0,"Gwendolyn Duet leads the fifth floor's land quadrant team. She is blunt and capable, she calls Carl \"bomber guy,\" and Carl trusts her."],[5,36,"On the sixth floor she is part of the crawler alliance."]],"Juice Box":[[4,0,"Juice Box is a changeling NPC Carl meets at an inn on the fifth floor. She trades him information about a borough boss and ends up looking after a group of children in the personal space."],[6,21,"She turns up at the Faction Wars meeting wearing someone else's face and pulls off a bloody stunt."]],"Langley":[[4,0,"Langley leads a group of former car salesmen who have become archers on the fifth floor. At level 24 he is their strongest member."]],"Britney":[[4,0,"Britney Proskurina is a Pit Fighter from the water quadrant. She is the only one of Vadim's team to survive, and Carl's group takes her in."],[5,7,"On the sixth floor she is always angry."],[5,11,"She seems to have given up on everything."],[5,54,"She is teleported away, and the others go to rescue her."],[5,62,"Donut picks Britney to be her guest at the masquerade."],[5,72,"Britney turns out to be a brilliant guitarist."],[6,4,"She and Louis are trapped in a saferoom by a pileup of memory cars."]],"Dmitri":[[3,0,"Dmitri and Maxim Popov are two brothers fused into one two-headed Nodling crawler. They are dangerous, and they rank in the top ten."],[5,40,"On the sixth floor the Popovs are still high on the leaderboard."]],"Sledge":[[3,0,"The Sledge is a huge, quiet rock-creature bodyguard who protects Carl's party in the Desperado Club, usually with Bomo."],[5,3,"He comes back as one of the party's bodyguards on the sixth floor."]],"Bomo":[[3,0,"Bomo is a cretin bodyguard who works with the Sledge. He speaks in short, broken sentences and is fiercely protective."],[5,5,"On the sixth floor Bomo carries messages in and out of Zockau's saferoom."],[6,2,"Bomo is the only one of their four bodyguards left. The others went down with the high elf castle."],[6,14,"He wears double armor as the party's tank in the ghommid temple."]],"Orren":[[4,0,"Orren is a hooded Syndicate liaison who looks like the grim reaper and sounds like a British professor. He shows up when an issue goes over Borant's head."],[5,3,"He sits in on the sixth floor's negotiations as the Syndicate's representative."],[6,51,"After the Residual speech he pulls Carl aside and explains what the AI and the Syndicate are afraid of."]],"Emberus":[[4,0,"Emberus is a fire god who shows up looking for Orthrus. His attention is something every crawler wants to avoid."],[5,60,"Vrah summons Emberus to Zockau early on the sixth floor so that the town's guards can worship him."]],"Quasar":[[5,3,"Quasar is Carl's lawyer. He is a small, grumpy alien who vapes and is always ready to sue."],[5,62,"Quasar sets up a corporation for Carl and Donut and wants Donut's name on its board of directors."],[6,12,"Quasar stays close to Carl through the sponsor interviews and pays attention to every legal angle."],[6,36,"He's thrilled when Carl chooses Baroness Victory as adjutant."]],"Vrah":[[5,1,"Vrah is a mantis hunter. She cuts the heads off her kills and wears them."],[5,5,"Her little sister dies during Carl's raid on Zockau."],[5,10,"Vrah swears she will take Carl's head."],[5,35,"Carl shoots her in the throat with a gonorrhea arrow."],[5,74,"At the masquerade, Mongo and Kiwi kill her."]],"Circe Took":[[5,21,"Circe Took is a high-ranking mantis of the Hive. She is booked to moderate a CrawlCon panel."],[5,34,"Carl is accused of attacking Circe and knocking her off a podium."],[5,41,"Circe is Vrah's mother. She is furious and heads to the Earth system to deal with it herself."],[5,55,"Circe sponsors the god Diwata."]],"Diwata":[[5,35,"Diwata is a forest god whose temples are scattered around the sixth floor."],[5,61,"Diwata manifests in the realm."]],"Imogen":[[5,14,"Imogen is Signet's half-sister. She served as the late king's right hand and destroyed Signet's village."],[5,28,"Queen Imogen of the High Elves is a country boss, and she is Carl's next target."],[5,63,"Queen Imogen is Ifechi."],[5,75,"Imogen dies at the end of the masquerade."]],"Kiwi":[[5,11,"Kiwi is a female Mongoliensis with pink feathers who leads the dinosaurs at Point Mongo."],[5,49,"Kiwi and Mongo start fighting together."],[5,73,"Kiwi is turned into a bear and is lost to the party."]],"Big Tina":[[5,48,"Big Tina is an Allosaurus that has been turned into a vampire, building an army of undead monsters."],[5,52,"She is a level-80 city boss."],[5,72,"Big Tina is the centerpiece of Donut's act at the masquerade."]],"Prudence":[[5,44,"Prudence is an ursine barkeep and the mother of two cubs."],[5,71,"Prudence dies at the masquerade."]],"Areson":[[5,13,"Areson the Wise is a level-45 ogre who serves as Signet's bodyguard."]],"Holger":[[5,16,"Holger is one of Signet's were-beavers."]],"Clint":[[5,13,"Clint Smashgrab is one of Signet's were-beavers. He is bald and has one leg."]],"Nadine":[[5,14,"Miss Nadine is a Bearded Sage Caterpillar who travels with Signet."],[5,29,"Nadine dies during the castle assault."]],"Edgar":[[5,15,"Edgar is a talking tortoise in Signet's group."],[5,29,"Edgar tattoos Signet."]],"Chaco":[[5,64,"Chaco the Bard runs the prize counter at the masquerade."],[6,0,"The prologue reveals Chaco's part in the end of Mordecai and Odette's crawl."]],"Pearson":[[5,58,"Pearson is a changeling who was a dromedarian bartender on the previous floor."],[5,63,"Pearson poses as Signet."]],"Zabit":[[5,67,"Zabit is one of the hunters at the masquerade."]],"Li Na":[[6,1,"Li Na starts in Beijing's Galaxy Soho with hundreds of other crawlers."],[6,8,"She enters the top ten at number nine."],[6,24,"She keeps quiet watch over Donut in the Desperado Club."]],"Tserendolgor":[[6,5,"\"Ren\" vets the Havana trio for Carl. She knows Paz only a little."],[6,57,"She and her squad guard the capitol stairwell against Quan."],[6,60,"Her last message asks everyone to make the show pay."]],"Quan Ch":[[6,18,"Quan, a former champion at a nerdy card game, does very well under the T'Ghee system."],[6,53,"In phase three he's the one-armed threat racing for the capitol key."],[6,58,"His fight at the capitol ends with Donut getting the kill credit."]],"Astrid":[[6,19,"The Guild of Suffering's target turns out to be Astrid, the bloodlust sprite who runs the Desperado Club."],[6,32,"The plan goes ahead. Astrid's final words haunt Carl."]],"Tran":[[6,3,"He's still grieving Gwen, his friend from early in the crawl."],[6,67,"In a huge battle on top of a skyscraper, his wheelchair is sparking but he's alive."]],"Clarabelle":[[6,30,"She waves Carl and Donut into the Desperado Club without a word."]]},"BIOS":{"Carl":"Carl entered the dungeon on the night the world ended, stepping outside in boxers and a leather jacket to chase his ex-girlfriend's cat. A former Coast Guard rescue swimmer, he's practical, stubborn and quick-tempered, and he hates being a puppet for the show even as he turns into one of its biggest stars. He fights with a war gauntlet and a growing arsenal of homemade explosives and traps, and he is fiercely protective of Donut, Mongo and the friends he picks up along the way. His running feud with the showrunners, and his refusal to play along quietly, shape much of how the crawl treats him.","Princess Donut":"Princess Donut was a prize-winning tortoiseshell Persian show cat belonging to Bea. After eating an enhanced pet biscuit she became a full crawler who can talk, cast spells and level up. She is vain, dramatic and obsessed with her fans and followers, but she is also brave and devoted to Carl, and she grows into a serious spellcaster known for spamming Magic Missile. She treats Mongo as her own baby.","Bea":"Beatrice, Carl's ex-girlfriend, owned Princess Donut and showed her competitively almost every weekend. She was away when the collapse happened and left Donut in Carl's care. Donut still talks about her often, and Carl's feelings about her are complicated.","Mordecai":"Mordecai is the game guide assigned to Carl and Donut. Bound to the dungeon and unable to leave it, he trains them in the guild hall between floors, brews potions and alchemical supplies for them, and explains how the crawl really works. His body changes form from floor to floor, but his gruff manner, love of drink and quiet loyalty stay the same. He is the closest thing the party has to a mentor.","Mongo":"Donut got Mongo as a tiny hatchling at the end of the first book's floors, and he grew from a peeping, chick-sized dinosaur into a powerful velociraptor-like Mongoliensis. He is Donut's beloved pet: endlessly loyal, always hungry, and devastating in a fight. He rides in a magical pet carrier when he needs to stay safe.","Katia":"Katia Grim started out traveling with Hekla's group before becoming a steady member of Carl's party. Her abilities let her change her body's mass and shape, so she can become a wall, a shield, a battering ram or a giant. Thoughtful and reliable, she often acts as the party's anchor in a crisis.","Zev":"Zev is a kua-tin from Borant, the company running Earth's crawl. She handles Carl and Donut's publicity, booking interviews and appearances and trying to keep them on-message for the show. Cameras switch off around kua-tin, which makes her conversations with Carl unusually candid.","Odette":"Odette hosts Dungeon Crawler After Hours, one of the most-watched talk shows covering the crawl. Carl and Donut appear on her program repeatedly. Off the air she offers Carl blunt advice about how the galaxy and the show work, and she has an agenda of her own.","Borant Corporation":"Borant is the kua-tin-run company that claimed Earth under Syndicate rules and produces this season of Dungeon Crawler World. It controls the dungeon's systems, sponsorships and broadcasts, and its financial pressures and corner-cutting ripple through the whole crawl.","Syndicate":"The Syndicate is the galaxy-spanning government whose laws let Earth be seized for its mineral rights. It licenses the crawl, oversees the corporations that run it, and sets the rules everyone, including Borant, has to follow.","Desperado Club":"The Desperado Club is a members-only refuge inside the dungeon that Carl and Donut can enter with their pass. Its several floors hold shops, bars, guilds and services, and it becomes a regular stop between fights. A Desperado pass rules out membership in the rival Club Vanquisher.","Hekla":"Hekla is an Icelandic crawler who built an all-women guild of Amazonian shieldmaidens, styled as Brynhild's Daughters. Strong, charismatic and ambitious, she ranks high on the leaderboard and is an important but complicated figure in Carl's world.","Imani":"Imani led a group of residents and staff out of the Meadow Lark retirement home when the dungeon opened, keeping many of them alive through the early floors. Calm, capable and caring, she becomes a trusted ally whose group Carl and Donut keep crossing paths with.","Elle":"Elle McGibbons was an elderly resident of the Meadow Lark retirement home when the dungeon opened. She became a Frost Maiden Blizzardmancer, gaining real power, and her sharp tongue and fearlessness make her a standout in Imani's group.","Lucia Mar":"Lucia Mar is a young, ferocious crawler who fights alongside her two rottweilers, Cici and Gustavo. She is unpredictable and dangerous, climbs the leaderboard quickly, and keeps turning up as a wild card in Carl's story.","Frank Q":"Frank Q entered the dungeon with his partner Maggie; the two had been working a surveillance job when the world ended. He turned to killing other crawlers early, and his path collides with Carl's in ugly ways.","Maggie":"Maggie entered the dungeon alongside her partner Frank Q. Her story with Carl and Donut becomes one of the darker threads of the early books.","Prepotente":"Prepotente is a goat who, like Donut, became a full crawler after eating an enhanced pet biscuit. Grandiose, theatrical and unpredictable, he travels with Miriam Dom and their other goat, Bianca, and proves to be a formidable fighter.","Miriam Dom":"Miriam Dom is a Shepherd-class crawler who entered the dungeon with her goats. She travels with Prepotente and Bianca and becomes one of the top-ranked crawlers.","Signet":"Signet is the half-elf daughter of the late High Elf king, covered in living tattoos and able to summon allies. Hunted because of her mixed blood, she ran away to join Grimaldi's circus and was later branded a traitor. Carl meets her as an elite NPC, and her history with the elves becomes increasingly important.","Scolopendra":"Scolopendra is a catastrophic monster whose spores and invasion transformed and destroyed much of the land, twisting circus performers and creatures alike into the horrors crawlers fight. The aftermath of her cataclysm shapes the floors that follow.","Louis":"Louis Santiago is a Pest Exterminator crawler who joins Carl's group on the fifth floor alongside his friend Firas. Good-natured and a bit hapless, he provides plenty of comic relief while still pulling his weight.","Firas":"Firas is a Hammersmith crawler and Louis's friend who joins Carl's group on the fifth floor. He is steadier than Louis and becomes a reliable companion.","Samantha":"Samantha is the name her friends used for Psamathe, a minor goddess banished by her father. What's left of her is bound to a disembodied doll head that rolls along with Carl's party, cursing constantly and with surprising eagerness for violence.","Gwen":"Gwendolyn Duet is a blunt, capable crawler from the fifth floor's land quadrant who calls Carl \"bomber guy.\" She becomes one of the people Carl trusts on that floor.","The Cookbook":"The Dungeon Anarchist's Cookbook is a magical book passed down from crawler to crawler across many seasons. Each owner adds notes, recipes, warnings and tricks, so it's packed with hard-won advice from past editions. It becomes one of Carl's most valuable resources.","Dmitri":"Dmitri and Maxim Popov are two brothers fused into a single two-headed Nodling crawler. Dangerous and high-ranking, they are one of the top-ten threats Carl keeps an eye on.","Sledge":"The Sledge is an enormous, mostly silent bodyguard who protects Carl's party inside the Desperado Club, often alongside Bomo. He says little but shows real loyalty.","Bomo":"Bomo is a cretin bodyguard who works with The Sledge in the Desperado Club. He speaks in short, broken sentences and is fiercely protective of the party.","Orren":"Orren is a hooded, grim-reaper-like Syndicate liaison with the voice of a British professor. He shows up when matters rise above Borant's level.","Emberus":"Emberus is a furious fire god who appears hunting for Orthrus. Gods in the dungeon are dangerous, and his attention is something no crawler wants."},"SCORE":{"5":{"book":"Book 5: The Butcher’s Masquerade","total":902,"chapters":[{"n":1,"label":null,"start":14,"pages":19.5,"key":2,"mode":"dorian","bpm":63,"mood":"calm","I":0.404,"V":-0.086,"segs":[[0.35,0.41,7],[0.4,0.12,7],[0.34,-0.12,7],[0.33,-0.15,8],[0.29,0.05,8],[0.24,0.1,8],[0.27,-0.08,8],[0.22,0.02,8],[0.34,0.02,8],[0.43,-0.11,0],[0.49,-0.24,0],[0.47,-0 const LEAD_OCT = { piano:0, flute:0, horn:-12, cello:-24, violin:0, celesta:12, pluck:0, choir:0 };
async function buildLead(ctx, B, M, out) {
  const { rnd, prog, secs, ch, beat, dur } = M, notes = [];
  const scale = []; const sc = scaleOf(ch.key, ch.mode);
  const chordAt = x => { let c = prog[0]; for (const p of prog) { if (p.t <= x) c = p; else break; } return c; };
  const pool = (p) => { const s = scaleOf(ch.key, p.mode), out = []; for (let m = 60; m <= 84; m++) if (s.includes(m % 12)) out.push(m); return out; };
  // this chapter's motif: scale steps + rhythm, seeded by the chapter
  const mr = rng((M.book*1000 + ch.n)*7 + 3), mlen = 5 + Math.floor(mr()*3), motif = [0];
  for (let k = 1; k < mlen; k++) motif.push(motif[k-1] + [-2,-1,1,2,3,-3,1,2][Math.floor(mr()*8)]);
  const mrh = motif.map((_, k) => k === mlen-1 ? 4 : [1,1,2,1,2,3][Math.floor(mr()*6)]);
  const push = (inst, m, d, t) => { const mm = m + LEAD_OCT[inst]; notes.push({ t, key: inst+"|"+mm+"|"+d.toFixed(3), inst, m: mm, d }); };
  secs.forEach((sec, si) => {
    const set = LEADSET[sec.mood], slow = sec.mood === "grief" ? 1.5 : sec.mood === "humor" ? 0.6 : 1;
    let t = sec.t0 + (si ? 1.5 : 6) + rnd()*3, first = true;
    while (t < Math.min(sec.t1, M.read - 8) - 2) {
      const p = chordAt(t), P = pool(p), inst = set[Math.floor(rnd()*set.length)];
      const root = P.findIndex(m => (m - p.c[0]) % 12 === 0 && m >= 62); let at = t;
      if (first || rnd() < 0.35) { // state the motif, anchored on the chord root
        const base = root < 0 ? 3 : root;
        motif.forEach((st, k) => { const m = P[Math.max(0, Math.min(P.length-1, base + st))], d = beat*slow*mrh[k]*(sec.mood==="triumph"?1.5:1); push(inst, m, d, at); at += d; });
        first = false;
      } else { // a free phrase around chord tones
        let i = Math.max(0, root < 0 ? 4 : root + Math.floor(rnd()*3) - 1); const n = 3 + Math.floor(rnd()*4);
        for (let k = 0; k < n; k++) { const d = beat*slow*(k === n-1 ? 3 + Math.floor(rnd()*2) : [1,1,2,2,1][Math.floor(rnd()*5)]);
          push(inst, P[Math.max(0, Math.min(P.length-1, i))], d, at); at += d; i += (rnd() < 0.5 ? -1 : 1) * (rnd() < 0.7 ? 1 : 2); }
      }
      t = at + (sec.mood === "combat" ? 4 : sec.mood === "humor" ? 3 : 7) + rnd()*(sec.mood === "grief" ? 16 : 11);
    }
  });
  // harp-like arpeggio flourishes at the openings of warm and wondrous sections
  const bank = {}, uniq = [...new Map(notes.map(x => [x.key, x])).values()];
  for (let i = 0; i < uniq.length; i += 24) await Promise.all(uniq.slice(i, i+24).map(async x => bank[x.key] = await bake(x.d + (["piano","celesta"].includes(x.inst) ? 6 : 1.8), (c, o) => { c._B = B; LEADS[x.inst](c, o, mtof(x.m), 0, x.d, 0.85); })));
  notes.forEach(x => play(ctx, bank[x.key], out, x.t));
}

/* rhythm beds per mood: one bar baked per chord, looped while that mood holds */
async function buildRhythm(ctx, B, M, out) {
  const { prog, beat, dur, Iat } = M, bars = {};
  const pat = {
    spiccato: (cx, o, c) => [0,0,1,0,0,1,2,1].forEach((v, j) => { const t = j*beat/2, lp = filt(cx,"lowpass",1300,0.7); lp.connect(env(cx, t, j%2 ? 0.11 : 0.16, 0.015, 0.3)).connect(o);
        [-6,6].forEach(dt => { const s = tone(cx,"sawtooth",mtof(c[v] + (v===2 ? -12 : 0)),t,0.45); s.detune.value = dt; s.connect(lp); }); }),
    pizz: (cx, o, c) => [[0,0,0.2],[1,2,0.1],[2,1,0.14],[3,3,0.1]].forEach(([b, v, a]) => { const t = b*beat, lp = filt(cx,"lowpass",1800,0.8); lp.connect(o);
        tone(cx,"triangle",mtof(c[v] + (v===0 ? 12 : 0)),t,0.5).connect(env(cx,t,a,0.003,0.28)).connect(lp); }),
    harp: (cx, o, c) => [2,3,4,1,3,4,2,4].forEach((v, j) => { const t = j*beat/2, m = c[v] + 12; tone(cx,"triangle",mtof(m),t,2.4).connect(env(cx,t,0.07,0.004,1.9)).connect(o);
        tone(cx,"sine",mtof(m+12),t,1.2).connect(env(cx,t,0.02,0.004,0.8)).connect(o); }),
    pulse: (cx, o, c) => { [81, 82, 74].forEach((m, i) => { const s = tone(cx,"sawtooth",mtof(c[0] + 36 + (i===1 ? 1 : i===2 ? -7 : 0)),0,4*beat+0.1); s.detune.value = i*3-3;
        const g = cx.createGain(); for (let k = 0; k < 4*beat*8; k++) { g.gain.setValueAtTime(k%2 ? 0.004 : 0.012, k/8); } s.connect(filt(cx,"bandpass",2400,0.9)).connect(g).connect(o); }); }
  };
  const gT = gain(ctx, 0); gT.connect(out); loop(ctx, B.taiko, 0).connect(filt(ctx,"lowpass",2600)).connect(gain(ctx,1.5)).connect(gT);
  const gH = gain(ctx, 0); gH.connect(out); loop(ctx, B.heart, 0).connect(filt(ctx,"lowpass",300)).connect(gain(ctx,0.9)).connect(gH);
  const gF = gain(ctx, 0); gF.connect(out); loop(ctx, B.frame, 0).connect(filt(ctx,"lowpass",1800)).connect(gain(ctx,0.8)).connect(gF);
  const pts = []; for (let t = 0; t < dur; t += 4*beat) pts.push(t);
  const moodAt = t => { let m = prog[0].mood; for (const p of prog) { if (p.t <= t) m = p.mood; else break; } return m; };
  const ramp = (node, fn) => { let prev = fn(0); node.gain.setValueAtTime(prev, 0); pts.forEach(t => { const v = fn(t); if (Math.abs(v-prev) < 0.02) return; node.gain.setValueAtTime(prev, t); node.gain.linearRampToValueAtTime(v, t+3); prev = v; }); };
  ramp(gT, t => moodAt(t) === "combat" ? 0.5 + 0.5*Iat(t) : moodAt(t) === "triumph" ? 0.35 : 0);
  ramp(gH, t => moodAt(t) === "tension" ? 0.35 + 0.5*Iat(t) : 0);
  ramp(gF, t => moodAt(t) === "intrigue" ? 0.25 + 0.35*Iat(t) : moodAt(t) === "humor" ? 0.2 : 0);
  const kinds = new Set(prog.map(p => RHY[p.mood]).filter(Boolean));
  for (const kind of kinds) {
    const g = gain(ctx, kind === "pulse" ? 0.9 : kind === "harp" ? 0.8 : 1); g.connect(out);
    for (const p of prog) { if (RHY[p.mood] !== kind) continue; const k = kind + "|" + p.c.join(",");
      if (!bars[k]) bars[k] = await bake(4*beat + (kind === "harp" ? 2.5 : 0.5), (cx, o) => pat[kind](cx, o, p.c));
      const s = ctx.createBufferSource(); s.buffer = bars[k]; const gg = ctx.createGain(); const v = 0.6 + 0.5*p.i;
      gg.gain.setValueAtTime(0, p.t); gg.gain.linearRampToValueAtTime(v, p.t + 1.5); gg.gain.setValueAtTime(v, p.t + p.len - 1.5); gg.gain.linearRampToValueAtTime(0, p.t + p.len);
      if (kind !== "harp") { s.loop = true; s.loopEnd = 4*beat; } s.connect(gg).connect(g); s.start(p.t); s.stop(Math.max(p.t + 0.1, Math.min(p.t + p.len, dur - 4)));
      if (kind === "harp") for (let t2 = p.t + 4*beat; t2 < p.t + p.len - 2*beat; t2 += 4*beat) { const s2 = ctx.createBufferSource(); s2.buffer = bars[k]; s2.connect(gg); s2.start(t2); }
    }
  }
}

$("tabSearch").addEventListener("click", () => showTab("search"));
function mini() { $("miniPlay").textContent = P.paused ? "▶" : "❚❚";
  $("miniTxt").textContent = current === null ? "Nothing playing" : (P.paused ? "Paused · " : "Playing · ") + "Bk " + curBook + " · " + name(BOOKS[curBook].chapters[current]); }
["play", "pause", "loadeddata", "ended"].forEach(ev => P.addEventListener(ev, mini));
$("miniPlay").addEventListener("click", toggle);
fillChapters(); paintWhere();
try { const t = localStorage.getItem("crawlTab"); showTab(["sound","dash","search"].includes(t) ? t : "sound"); } catch (e) { showTab("sound"); }
mini();

let syncT = 0;
function pushSync() { syncT = 0; try { google.script.run.withFailureHandler(() => {}).saveState(JSON.stringify(prefs)); } catch (e) {} }
function queueSync() { if (!syncT) syncT = setTimeout(pushSync, 15000); }
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(syncT); pushSync(); } });
window.addEventListener("pagehide", () => { clearTimeout(syncT); pushSync(); });
function applyRemote(s) {
  if (!s) { pushSync(); return; } let r; try { r = JSON.parse(s); } catch (e) { return; }
  if ((r.savedAt || 0) <= (prefs.savedAt || 0)) { if ((prefs.savedAt || 0) > (r.savedAt || 0)) pushSync(); return; }
  Object.assign(prefs, r); if (prefs.book !== 6) { prefs.book = 6; prefs.ch = 0; prefs.done = false; } /* Book 6 only for now */ try { localStorage.setItem("crawl", JSON.stringify(prefs)); } catch (e) {}
  fillChapters(); paintWhere(); refreshAll(); setStatus("Synced: picked up your place from your other session.");
}
try { google.script.run.withSuccessHandler(applyRemote).withFailureHandler(() => {}).loadState(); } catch (e) {}


</script>
