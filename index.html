<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Crawler">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Crawler</title>
<style>
  :root { --bg:#14110f; --panel:#1f1a17; --panel2:#171310; --line:#3a312b; --ink:#efe6dc; --dim:#a89a8c; --accent:#e0703a; --good:#7fbf6a; --dead:#6f655c; --amber:#e6b422; --blue:#5fa8e0; }
  * { box-sizing:border-box; }
  html { background:#14110f; }
  html, body { overflow-x:hidden; max-width:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
  svg { max-width:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom)); }
  h1 { font-size:26px; margin:4px 0 0; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:14px; margin:2px 0 14px; font-style:italic; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label, summary { display:block; font-size:13px; color:var(--dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
  summary { cursor:pointer; margin:0; }
  details[open] summary { margin-bottom:14px; }
  select, input[type=number] { width:100%; font-size:17px; padding:11px; border-radius:10px; border:1px solid var(--line); background:#100d0b; color:var(--ink); }
  .row { display:flex; gap:10px; align-items:end; }
  .row > .grow { flex:1; min-width:0; }
  button { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  button:disabled { opacity:.4; }
  .gap { height:12px; }
  .note { font-size:13px; color:var(--dim); margin:8px 0 0; }
  audio { display:none; }

  /* where-I-am bar */
  .where { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .where .row select { font-size:16px; padding:10px; }
  .where .bk { display:none; } /* Book 6 only for now */
  #safe, .curve, .card.arc { display:none; } /* still computed, just not shown */
  .done { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px; font-size:15px; padding:11px; border-radius:12px; background:#100d0b; color:var(--dim); }
  .done.on { background:var(--good); color:#0f1a0b; border-color:var(--good); font-weight:700; }
  .done .bx { width:20px; height:20px; border-radius:6px; border:2px solid currentColor; display:inline-flex; align-items:center; justify-content:center; font-size:13px; line-height:1; }
  .safe { font-size:13px; color:var(--dim); margin:8px 2px 0; }
  .safe b { color:var(--ink); font-weight:600; }

  .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:0 0 14px; position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0; }
  .tabs button { display:flex; align-items:center; justify-content:center; gap:7px; font-size:15px; font-weight:650; padding:13px 6px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--dim); }
  .tabs button.on { background:var(--accent); color:#1a0f08; border-color:var(--accent); }
  .tabs svg { width:20px; height:20px; flex:none; }

  /* player */
  .title { font-size:19px; font-weight:600; margin:0; }
  .meta { color:var(--dim); font-size:13px; margin:2px 0 0; }
  .page { color:var(--accent); font-size:15px; margin:4px 0 12px; min-height:22px; }
  .scrub { position:relative; padding-top:4px; }
  .curve { position:absolute; left:0; right:0; top:0; width:100%; height:32px; pointer-events:none; display:block; }
  input[type=range] { width:100%; accent-color:var(--accent); margin:0; height:28px; }
  .times { display:flex; justify-content:space-between; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .transport { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .transport button { min-width:56px; height:52px; font-size:15px; padding:0 8px; }
  .transport #play { width:72px; height:72px; border-radius:50%; border:0; background:var(--accent); color:#1a0f08; font-size:28px; font-weight:700; }
  #status { color:var(--dim); font-size:14px; margin:12px 0 0; }
  #status:empty { margin:0; }
  .mix { display:grid; grid-template-columns:90px 1fr 44px; gap:8px 10px; align-items:center; font-size:15px; margin-bottom:16px; }
  .mix span:last-child { color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  .check { display:flex; gap:10px; align-items:center; font-size:15px; text-transform:none; letter-spacing:0; color:var(--ink); margin:14px 0 0; }
  .check input { width:20px; height:20px; accent-color:var(--accent); }
  .arc h3, .dash h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 8px; font-weight:600; }
  .arc svg { width:100%; height:110px; display:block; }
  .arc .lg { display:flex; gap:14px; font-size:12px; color:var(--dim); margin-top:6px; flex-wrap:wrap; }
  .arc .lg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

  /* dashboard */
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0; }
  .stat .k { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .stat .v { font-size:22px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; line-height:1.15; }
  .stat .s { font-size:13px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .stat.wide { grid-column:1 / -1; }
  .stat svg { width:100%; height:34px; display:block; margin-top:6px; }
  .sheetcard { background:linear-gradient(180deg,#221c18,#1a1512); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; position:relative; overflow:hidden; }
  .sheetcard .top { display:flex; gap:14px; align-items:center; }
  .badge { width:64px; height:64px; flex:none; }
  .sheetcard h2 { margin:0; font-size:21px; line-height:1.2; }
  .sheetcard .tag { font-size:13px; color:var(--dim); margin-top:2px; }
  .lvl { margin-left:auto; text-align:center; flex:none; }
  .lvl .n { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .lvl .t { font-size:10px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:14px 0 0; font-size:14px; }
  .kv dt { color:var(--dim); white-space:nowrap; }
  .kv dd { margin:0; min-width:0; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .pills button, .pills span { font:inherit; font-size:13px; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#100d0b; color:var(--ink); }
  .pills .lab { border:0; background:transparent; color:var(--dim); padding-left:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; width:100%; }
  .castwall { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .cw { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; font:inherit; font-size:14px; color:var(--ink); text-align:left; min-width:0; }
  .cw .dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--good); }
  .cw.dead { color:var(--dim); }
  .cw.dead .nm { text-decoration:line-through; text-decoration-color:#6f655c; }
  .cw.dead .dot { background:var(--dead); }
  .cw.changed .dot, .cw.lost .dot, .cw.hurt .dot { background:var(--amber); }
  .cw.away .dot { background:var(--blue); }
  .cw .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .cw small { color:var(--dim); font-size:11px; flex:none; }
  .floors { display:flex; flex-direction:column; gap:0; }
  .fl { display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid #2a231f; font-size:14px; }
  .fl:last-child { border:0; }
  .fl .no { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--dim); }
  .fl.here .no { border-color:var(--accent); background:var(--accent); color:#1a0f08; }
  .fl.past .no { border-color:#5a4a3e; color:var(--ink); }
  .fl .bk { color:var(--dim); font-size:12px; }
  .fl.skip .nm { color:var(--dim); font-style:italic; }
  .dash .card { padding:14px; }

  /* search (carried from v9) */
  .searchbox { display:flex; align-items:center; gap:10px; background:#100d0b; border:1px solid var(--line); border-radius:14px; padding:2px 14px; margin-bottom:12px; }
  .searchbox:focus-within { border-color:var(--accent); }
  .searchbox svg { width:20px; height:20px; color:var(--accent); flex:none; }
  .searchbox input { flex:1; border:0; background:transparent; color:var(--ink); font-size:18px; padding:13px 0; outline:none; min-width:0; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin:0 -16px 6px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; font-size:14px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); white-space:nowrap; }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip small { opacity:.6; margin-left:3px; font-size:12px; }
  .gmeta { color:var(--dim); font-size:13px; margin:6px 0 10px; }
  .ghead { display:flex; align-items:center; gap:8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:20px 0 8px; }
  .ghead::after { content:""; flex:1; height:1px; background:var(--line); }
  .ge { background:var(--panel); border:1px solid var(--line); border-left:4px solid; border-radius:12px; padding:11px 14px; margin-bottom:9px; }
  button.ge { display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  button.ge:active { transform:scale(.99); }
  .ge .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ge .nm { font-weight:650; font-size:17px; }
  .ge .pill { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:650; }
  .ge .wh { color:var(--dim); font-size:12px; margin-left:auto; white-space:nowrap; }
  .ge .new { background:var(--accent); color:#1a0f08; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px; letter-spacing:.06em; }
  .ge .more { color:var(--dim); font-size:12px; margin-left:4px; }
  .ge p { margin:6px 0 0; font-size:15px; color:#d9cec2; }
  .ge .st { font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  mark { background:#e0703a55; color:inherit; border-radius:3px; padding:0 1px; }
  .ach { display:flex; flex-wrap:wrap; gap:6px; }
  .ach button { font:inherit; font-size:13px; padding:5px 10px; border-radius:999px; background:#e6b42214; border:1px solid #e6b42255; color:var(--ink); }
  .ach button b { font-weight:400; color:var(--dim); font-size:11px; margin-left:4px; }
  .mini { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 10px; margin-bottom:12px; font-size:14px; color:var(--dim); }
  .mini button { width:38px; height:38px; border-radius:50%; border:0; background:var(--accent); color:#1a0f08; font-weight:700; padding:0; flex:none; }
  .empty { color:var(--dim); text-align:center; padding:28px 10px; }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet[hidden] { display:none; }
  .sheet .panel { width:100%; max-width:560px; max-height:86vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0; padding:18px 18px 36px; border-top:4px solid; }
  .sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .sheet .hd { display:flex; align-items:center; gap:10px; }
  .sheet .hd .ic { font-size:26px; }
  .sheet .hd h2 { margin:0; font-size:22px; line-height:1.2; flex:1; }
  .sheet .x { width:44px; height:44px; border-radius:50%; padding:0; font-size:18px; flex:none; }
  .sheet .pill { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; font-weight:650; margin:8px 0 4px; }
  .sheet .lead { font-size:16px; line-height:1.5; margin:10px 0 0; }
  .sheet .pbk { font-size:12px; font-weight:650; color:var(--accent); margin:14px 0 2px; letter-spacing:.04em; }
  .sheet .pbook .bio { margin:4px 0 0; }
  .sheet .bio { font-size:15px; line-height:1.55; color:#d9cec2; margin:10px 0 0; }
  .sheet .facts { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:16px 0 0; font-size:14px; }
  .sheet .facts dt { color:var(--dim); }
  .sheet .facts dd { margin:0; }
  .sheet h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:20px 0 8px; font-weight:600; }
  .tl { display:grid; grid-template-columns:34px 1fr; gap:6px 8px; align-items:center; font-size:12px; color:var(--dim); }
  .tl .row { display:flex; gap:2px; flex-wrap:wrap; }
  .tl .row i { width:5px; height:12px; border-radius:2px; background:var(--line); }
  .tl .row i.on { background:var(--accent); }
  .tl .row i.lock { opacity:.25; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  .links button { font:inherit; font-size:14px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#100d0b; color:var(--ink); }
  .sheet .xs { margin:14px 0 0; display:grid; gap:10px; }
  .sheet .xr { background:#100d0b; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .sheet .xl { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 3px; }
  .sheet .xt { margin:0; font-size:15px; line-height:1.5; color:#d9cec2; }
</style>
</head>
<body>
<main>
  <h1>Crawler</h1>
  <p class="sub" id="sub"></p>

  <div class="where" id="whereBox">
    <div class="row">
      <div class="bk"><label for="book">Book</label><select id="book"><option value="5">Book 5</option><option value="6">Book 6</option></select></div>
      <div class="grow"><label for="chapter">Chapter I'm reading</label><select id="chapter"></select></div>
    </div>
    <button class="done" id="done" aria-pressed="false"><span class="bx"></span><span id="doneTxt">I've finished this chapter</span></button>
    <p class="safe" id="safe"></p>
  </div>

  <nav class="tabs" role="tablist">
    <button id="tabSound" class="on" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Sound</button>
    <button id="tabDash" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Crawl</button>
    <button id="tabSearch" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>Search</button>
  </nav>

  <section id="paneSound">
    <div class="card">
      <p class="title" id="title">Nothing playing</p>
      <p class="meta" id="tmeta"></p>
      <p class="page" id="page"></p>
      <div class="scrub"><svg class="curve" id="curve" viewBox="0 0 1000 32" preserveAspectRatio="none" aria-hidden="true"></svg>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position in chapter" disabled></div>
      <div class="times"><span id="tNow">0:00</span><span id="tLeft">0:00</span></div>
      <div class="transport">
        <button id="prev" aria-label="Previous chapter">⏮</button>
        <button id="back" aria-label="Back 15 seconds">−15s</button>
        <button id="play" aria-label="Play">▶</button>
        <button id="fwd" aria-label="Forward 30 seconds">+30s</button>
        <button id="next" aria-label="Next chapter">⏭</button>
      </div>
      <p id="status"></p>
      <audio id="player" preload="auto"></audio>
      <div class="row" style="margin-top:12px">
        <div class="grow"><input id="pageIn" type="number" inputmode="numeric" min="1" placeholder="Jump to page" aria-label="Jump to page"></div>
        <button id="pageGo">Go</button>
      </div>
      <p class="note" id="pageNote"></p>
    </div>

    <div class="card arc">
      <h3 id="arcTitle">The book so far</h3>
      <svg id="arc" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-label="Emotional arc of the chapters you've read"></svg>
      <div class="lg"><span><i style="background:#e0703a"></i>brighter</span><span><i style="background:#8a7f76"></i>neutral</span><span><i style="background:#5f8fd0"></i>darker</span><span>height = intensity</span></div>
      <p class="note">Only chapters you've finished are drawn. The line above the scrubber fills in as the track plays.</p>
    </div>

  </section>

  <section id="paneDash" class="dash" hidden></section>

  <section id="paneSearch" hidden>
    <div class="mini"><button id="miniPlay" aria-label="Play or pause">▶</button><span id="miniTxt">Nothing playing</span></div>
    <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><input id="gq" type="search" placeholder="Search names, places, cards, gods…" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div class="chips" id="gchips"></div>
    <p class="gmeta" id="gmeta"></p>
    <div id="glist"></div>
  </section>

  <div class="sheet" id="sheet" hidden><div class="panel" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
</main>
<script>
const DATA = {"GLOSS":[["Carl",[],1,1,0,"Crawler #4,122 and the series' narrator. A former Coast Guard rescue swimmer who went into the dungeon barefoot in his boxers and became a Primal, specializing in explosives and his war gauntlet.","",[]],["Princess Donut",["Donut"],1,1,0,"Bea's prize-winning show cat, turned into a talking, spellcasting crawler by an enhanced pet biscuit. Carl's partner, a fan favorite, and a big believer in her own celebrity.","Crawler #4,119, Cat, level 1",[]],["Bea",["Miss Beatrice","Beatrice"],1,1,1,"Carl's ex-girlfriend and Donut's original owner. She was off on vacation when the world ended, leaving Donut with Carl.","",[]],["Mordecai",[],1,2,1,"Carl and Donut's game guide, a former crawler who now works for the dungeon. Gruff, deeply experienced, and quietly on their side.","Rat Hooligan, level 50",[]],["Mongo",["Male Mongoliensis"],1,46,5,"Donut's pet Mongoliensis, a small dinosaur raised from a hatchling who grows into a fierce, loyal velociraptor-style fighter. Peeps a lot.","First met at level 1",[]],["Mongoliensis",[],1,46,9,"Mongo's species: a feathered, velociraptor-like dinosaur.","",[["What it is","A feathered, beaked dinosaur with a long tail and rows of tiny, sharp teeth. A pet-class mob."],["Mongo","Donut picks a baby male (level 1, not yet bonded) from the pet reward room at the end of the first floor. He grows into a terrifying, loyal fighter who screeches when excited."]]],["Crawler",[],1,1,12,"A person forced into the World Dungeon. Crawlers descend floor by floor, levelling up for an audience across the galaxy.","",[["The rules","Anyone who enters the World Dungeon has to find a staircase and go down before each floor's timer runs out. Entrances shrink floor by floor, down to the 18th level, which has two entrances and one exit."],["Life as a crawler","Leveling, loot boxes, achievements, and an audience of quintillions watching every move."],["Crawler numbers","Every crawler gets a number. Carl is #4,122."]]],["Dungeon Crawler World",[],1,3,13,"The intergalactic reality show the dungeon is filmed for. Earth's version is one season of a long-running franchise.","",[["What it is","The franchise. Every season, a new Dungeon Crawler World debuts across the Syndicate's three billion star systems, and quintillions of viewers get hooked."],["How it airs","An introductory episode and regular recap shows \"tunnel\" across the galaxy. Floor events are timed around them."]]],["World Dungeon",[],1,1,7,"The planet-wide dungeon built under Earth's surface after the Syndicate seized the planet. Each floor has its own theme and rules.","",[["How it started","Under Syndicate rules, Earth failed to appeal a mineral reclamation. Borant, given regency over the solar system, chose \"option 3\": the 18-Level World Dungeon."],["Structure","Each lower level is longer and stranger, with fewer entrances. Loot nobody claims can end up on the Syndicate market."]]],["Syndicate",[],1,1,8,"The galactic government whose rules allowed Earth to be seized for its minerals. It oversees the crawl and the companies that run it.","",[["What it is","A government of more than three billion independent star systems. Its codes (like the Precious Elemental Reserves Code) let Earth be taken."],["Its rules matter","Syndicate law, courts and taxes constantly shape the crawl, from lawsuits to rules on how hosts pay for Celestial boxes."]]],["Borant Corporation",["Borant"],1,4,8,"The company that seized Earth and runs this season of the crawl. Its staff are kua-tin.","",[["Role","Holds regency over Earth's system and all broadcast rights to the crawl. Its kua-tin staff work as the dungeon's Admins."],["Money troubles","Running a crawl is expensive, and Borant's finances and legal fights become a plot thread of their own."]]],["Kua-tin",[],1,35,13,"Small aquatic aliens who run Borant, sometimes called mudskippers. Cameras always switch off when one is present.","",[["What they are","The dominant species of the Borant System and owners of the Borant Corporation. Crawlers are told to recognize them on sight."],["Rules around them","Cameras always turn off when kua-tin are present, and violence against them (as Admins) means instant execution."],["Politics","Factions like the Bloom, an ultranationalist party, are part of kua-tin society."]]],["Mudskipper",[],2,1,13,"Slang for the kua-tin who run Borant.","",[["Usage","An insult used by crawlers, the AI and galactic celebrities alike. Tucker uses it on air. The AI calls crawlers \"honorary mudskippers\" for underwater feats."]]],["Zev",[],1,35,13,"A kua-tin who serves as Carl and Donut's Borant PR and handler. She sets up their interviews and appearances.","",[]],["Odette",[],1,27,13,"Host of the talk show Dungeon Crawler After Hours. She interviews Carl and Donut on air and gives Carl advice off it.","",[]],["Desperado Club",[],1,19,8,"A members-only club inside the dungeon for crawlers holding a Desperado pass, with shops, guilds and bars spread over several floors. Holding one rules out the rival Vanquisher pass.","",[["What it is","A sprawling club behind its own door on many floors, with bars, a casino, a market (the Silk Road), guild halls, a pharmacist (Quint) and more."],["The catch","Holding a Desperado Pass means you can never get a Vanquisher pass."],["People","Clarabelle the bouncer and Astrid the assistant manager. Drink tickets come from boxes."],["Middle-floor map (Book 6)","The book prints a map of the middle floor just before Chapter 31. Going in from the main entrance at the bottom, the casino is on the left and the stairs are above it. The guard office and the pet-and-coat check run along the front wall, and the big restaurant fills the center. Rooms ring the restaurant: the Badger Bar, the guild rooms, the kitchens and the bathrooms. On the right side are the Penis Palace, the Ladies of Ill Refute, the Souk Bazaar and a corridor of more shops. The map also marks what's hidden: the Gray Market, a secret passage behind the bathrooms leading to the Chemist and a drug den, a hidden pet room, and a concealed strip on the left wall with a secret potion shop, a burglar's supply shop, the Jeweler and the Demon Tamer's guild area. Meat Shields sits up in the top-left corner.",30]]],["Club Vanquisher",[],2,1,8,"The rival club to the Desperado. A crawler can hold a pass to only one of them.","",[["How it works","Mordecai says once you have access to one club, you're generally barred from the other. On the Iron Tangle, stations ending in 9 have a Vanquisher."],["Reputation","Hump Town turns away \"Club Vanquisher types.\""]]],["Saferoom",[],1,5,12,"A protected rest stop. Mobs can't enter, and there's usually a Bopca-run bar, food, and personal space.","",[["How they work","Mobs can't come in. Many have food, restrooms, and a Bopca proprietor. In Over City towns, inns count as saferooms."],["Iron Tangle","Every transfer station has a saferoom."]]],["Bopca",[],1,39,9,"The gnome-like NPCs who run saferooms. Several of them are Protectors.","",[["Known Bopca","Tally (Carl's first saferoom), Sebastian (who brushes Donut's fur), Gordo (the third-floor pub), Wendita (Nirula's on the Iron Tangle)."],["Personality","Small, house-proud and often charmed by Donut."]]],["Personal space",[],1,10,12,"A crawler's private, upgradable room reached from saferooms. Carl's party uses theirs as a base and crafting space.","",[["How it works","Available to buy from the fourth floor on. Prices aren't negotiable, even for royalty, as Wendita tells Donut."],["Use","The team's home base for crafting, planning and resting."]]],["Neighborhood Boss",[],1,24,12,"A local boss mob, one rank below borough and city bosses.","",[["How it works","Entering a boss's lair triggers the AI's \"Boss Battle!\" announcement and a \"Versus\" screen with both sides' mugshots."],["Examples","The Hoarder (level 7), the Juicer (level 9), Ralph the Frenzied Gerbil (level 11)."]]],["Borough Boss",[],1,30,12,"A boss one step above neighborhood bosses; it guards a larger area.","",[["How it works","\"B-B-B-Boss Battle!\" The AI's announcement gets even louder. Early borough and city bosses guard stairwells."],["Firsts","The first borough boss killed on the first floor was a \"pile of mouths and eyeballs,\" brought down by ten crawlers with shotguns and bows."],["Examples","The Ball of Swine (level 15), Ruckus."]]],["Floor",[],1,1,12,"A level of the dungeon. Each floor has a timer; when it runs out, anyone who hasn't found a stairwell dies in the collapse.","",[["How it works","Each floor gets a new theme, a welcome message and a Level Collapse timer, starting at five days on the first floor."],["So far","First and second floors (tutorial dungeon), third (the Over City), fourth (the Iron Tangle), fifth (the Bubbles), sixth (the Hunting Grounds)."]]],["Stairwell",[],1,3,12,"An exit down to the next floor. Reaching one before the timer runs out is how crawlers survive.","",[["How it works","Stairwells show on the map as squares (\"Stairwell to Floor Two\"). On some floors they only appear at certain spots, like specific Iron Tangle stations."],["Timing","Going down early earns achievements. Some stairwells sit behind bosses."]]],["Loot box",[],1,4,10,"Reward boxes in tiers (bronze, silver, gold, platinum, legendary, celestial and more) that crawlers earn for achievements and kills.","",[["How it works","Boxes come by tier and by type: Adventurer, Weapon, Apparel, Boss, Goblin, Fan, Quest, Asshole, Looter and more. Higher tiers glow brighter."],["Why it matters","Loot boxes are how crawlers get gear, spells and money. The AI tunes the contents to make the show better."]]],["Achievement",[],1,3,12,"A system-awarded accomplishment, often sarcastic, that usually comes with a loot box.","",[["How it works","Notifications stack up, often with the AI's commentary, and usually pay out in boxes."],["Tone","The AI uses them to mock, flirt (especially about feet) and occasionally praise."]]],["Sponsorship",[],1,40,12,"From the third floor on, outside viewers and factions can bid to sponsor crawlers and send them benefit boxes.","",[["How it works","Bidding opens on a crawler when they reach a new floor (from the fourth floor on). The winner sends benefactor boxes and appears in the Sponsorship tab."],["Carl's","The Valtay Corporation. Katia's: Princess Formidable of the Skull Empire."]]],["Top Ten",["Leaderboard"],1,35,12,"The ranked list of top crawlers by bounty and popularity. Making the list paints a target on you.","",[["How it works","The leaderboard fills after the third floor collapses. Each slot carries a bounty, from 100,000 up to 1,000,000 gold for number one."],["Why it matters","Making the list brings fame and Fan Boxes, plus a target on your back."]]],["Bounty",[],2,26,12,"The reward value placed on a top crawler, paid out to whoever kills them.","",[["How it works","Shown on your floor summary. Carl starts the fourth floor at rank 6 with a 100,000-gold bounty, and reaches 800,000 by the fifth floor."]]],["Primal",[],2,26,9,"Carl's race.","",[["What it is","A rare race option that was common in early seasons and almost never offered now. When Carl first looks, its 3D preview is empty."],["Carl's choice","Mordecai suggests Hobgoblin or Coal Engine. Carl picks Primal anyway."]]],["Compensated Anarchist",[],2,26,11,"Carl's class, focused on traps and explosives.","",[["What it is","A rare, exclusive Earth Class built on traps, bombs and chaos. It needs level-five explosives skills to unlock."],["Perks","Fear spell, Hide in Shadows, Find Traps, Backfire, Escape Plan, plus access to the Desperado Club and the Naughty Boys Employment Agency."],["Other options","The AI also offered Bomb Squad Tech and Prize Fighter."]]],["Former Child Actor",[],2,26,11,"Donut's class.","",[["What it is","A rare subclass of Character Actor that requires the \"Cut!\" achievement. Donut picks a new specialty every floor."],["Other options","Artist Alley Mogul and NecroBard (Carl was relieved)."]]],["The Cookbook",["Dungeon Anarchist's Cookbook","cookbook"],3,1,10,"A magical, ever-expanding book handed from crawler to crawler across seasons. Former owners from many editions fill it with notes, recipes and warnings.","",[["What it is","The Dungeon Anarchist's Cookbook, passed between crawlers across seasons. Each edition's owner adds notes, signed by edition number."],["Contributors","Drakea (22nd), Forkith (20th), Coolie (19th), Herot (16th), Allister (13th) and many others."],["How Carl uses it","Bomb recipes, warnings about gods, NPC theory. He reads it in saferoom restrooms, where it's safe to."]]],["Edition",[],2,1,13,"A numbered season of the crawl on a given world. Earth's is a later edition; Cookbook notes are signed by edition.","",[["Usage","Cookbook notes are signed by edition (\"Crawler Drakea, 22nd Edition\"). Recap specials are also labeled \"Special Edition.\""]]],["Imani",["Imani C"],1,22,0,"Imani C., who led a group out of the Meadow Lark retirement home through the early floors. Calm, capable, and a close ally.","Crawler #12,329,440, Obsidian Butterfly, Fire Spiritualist, level 24",[]],["Elle",["Elle McGib","Mrs. McGibbons"],1,22,0,"Elle McGibbons, a feisty retirement-home resident who became a Frost Maiden Blizzardmancer and travels with Imani's group.","",[]],["Brandon",["Brandon An"],1,22,0,"Brandon An, a member of Imani's retirement-home survivor group who carried a giant hammer early on.","Crawler #12,330,671, Human, level 6",[]],["Yolanda",["Yolanda Martinez","Yolanda Martinez 13"],1,22,0,"Yolanda Martinez, a nurse's aide from the Meadow Lark home and part of Imani's group.","",[]],["Agatha",[],1,22,0,"An unsettling older woman from Imani's retirement-home group.","Crawler #7,450, Human, level 2",[]],["Meadow Lark",[],1,22,7,"The retirement home where Imani, Elle and the rest of their group came from.","",[["Who's there","Brandon, Yolanda (a CNA), Imani, Elle, Chris Andrews and residents like Randall, many with walkers."],["Their story","Moving the elderly residents through the first floor means terrible choices, and their survival becomes a big part of Carl's early arc."]]],["Lucia Mar",[],1,14,0,"A young, dangerous crawler who fights alongside her two dogs, Cici and Gustavo. A recurring wild card.","",[]],["Frank Q",["Frank"],1,13,0,"An ICE agent who entered the dungeon with his partner Maggie and quickly turned to killing other crawlers.","Crawler #324,119, Human, level 8",[]],["Maggie",["Maggie My"],1,20,0,"Frank Q's partner from his surveillance job. Their story with Carl turns ugly.","Crawler #324,116, Human, level 9",[]],["Hekla",[],1,39,0,"An Icelandic crawler who leads an all-women guild of Amazonian shieldmaidens. A powerful and complicated ally.","",[]],["Brynhild's Daughters",["Daughters","Hekla's Daughters"],1,39,8,"Hekla's women-only fighting guild.","",[["Who they are","Hekla, an Icelandic shieldmaiden, built a large group of women crawlers around her. The announcer plays up the Nordic persona."],["Known members","Hekla, Eva, Silfa and others. Katia travels with them before joining Carl."]]],["Katia",["Katia Grim"],2,21,0,"A crawler and Carl's party member who can reshape her body and mass, becoming walls, shields and more. A steady partner in the group.","Crawler #9,077,265, Human, Monster Truck Driver, level 9",[]],["Li Jun",[],1,42,0,"A crawler and Street Monk, part of the extended group of allies.","",[]],["Ifechi",[],2,26,0,"A Physicker (healer) crawler who reached the top ten.","",[]],["Prepotente",[],2,26,0,"A goat turned crawler by a pet biscuit, like Donut. A grandiose, unpredictable Forsaken Aerialist who travels with Miriam Dom.","",[]],["Miriam Dom",["Miriam"],2,26,0,"A Shepherd-class crawler and goat owner who travels with Prepotente and Bianca.","",[]],["Florin",[],2,26,0,"A Crocodilian crawler and Shotgun Messenger who ranked in the top ten.","",[]],["Tserendolgor",["Ren"],2,57,0,"A dog-themed crawler whose name few can pronounce. Donut dislikes her on principle.","",[["What she's like","A German Shepherd-like crawler in a Vietnam-era helmet with holes cut out for her ears."],["Fifth floor","She sends Carl a panicked message from inside one of the bubbles during the late-floor crisis."]]],["Quan Ch",["Quan"],2,24,0,"A crawler who blames Carl and Donut for his troubles.","",[["First contact","Messages the crawler chat: \"Thanks a lot Carl and Donut you fucking assholes.\""],["On the board","A half-elf Imperial Security Trooper. A magic jacket sends him rocketing up the leaderboard."]]],["Signet",["Tsarina Signet"],2,6,1,"A half-elf daughter of the late High Elf king, covered in tattoos. She ran away to join the circus and was later branded a traitor. She becomes an important elite NPC with her own causes.","Half Naiad, Half High-Elf Summoner, level 60",[]],["Scolopendra",[],2,7,3,"A catastrophic monster whose spores and invasion transformed creatures and wrecked much of the land. Her cataclysm shapes the floors that follow.","",[["The cataclysm","Her poison cloud was a \"Nine Tier attack,\" hitting in nine different ways. Her spores turned the Over City's gentle lions into Mold Lions and much worse."]]],["Grimaldi",[],2,7,1,"Owner of Grimaldi's Traveling Circus, whose performers were twisted by Scolopendra's cataclysm.","",[]],["Sledge",["The Sledge"],2,40,1,"An enormous, mostly silent bodyguard who protects Carl's party in the Desperado Club alongside Bomo.","",[]],["Bomo",[],2,40,1,"A cretin bodyguard who works with The Sledge. Speaks in short, broken sentences.","",[]],["Cretin",[],2,40,9,"A big, simple-speaking bruiser race; Bomo is one.","",[["What they are","Big rock creatures. Bomo is one, hired as a bodyguard for Carl's team."]]],["Loita",[],2,47,13,"A kua-tin Borant representative who handled Hekla's group, and a Bloom party member who wants to take over Carl's account.","",[["Who she is","Hekla jokes that Zev \"sounds like our Loita,\" their handler. When her main account is gone, she angles to take over Carl and Donut's."],["Politics","She's Bloom, the ultranationalist kua-tin party."]]],["Eva",[],2,32,0,"One of Hekla's Daughters and a friend of Katia's.","",[]],["Miss Quill",["Quill"],2,18,1,"A Skyfowl gatekeeper who serves as assistant to the Magistrate. Fiercely devoted to her post.","Skyfowl, level 30",[]],["Bautista",["Daniel Bautista"],2,24,0,"A crawler who was pushed toward killing Miss Quill as part of a third-floor quest.","",[]],["Skyfowl",[],2,8,7,"Bird-like NPCs with a settlement on the third floor, said to be blessed by the goddess Apito.","",[["Where","A medium Skyfowl settlement lies about 34 kilometers north on the third floor's main road. Taking over a settlement gem ties its taxes and Talon Strike skill to Carl."],["Known Skyfowl","Miss Quill, assistant to the Magistrate."]]],["Apito",[],2,17,6,"The Oak Mother, a goddess at the head of the dungeon's pantheon.","",[["Who she is","The Oak Mother, mother of all gods, worshipped by the elves. City elves preach \"the good news about Apito.\""],["Family","Mother of Grull, with Taranis. The elf mothers abandoned Nekhebit for her."]]],["Remex",["Remex the Grand"],2,22,1,"A third-floor figure, neither alive nor dead, who was trying to bring himself back to full life.","Soul Leech Capacitor, level 1",[["What he is","The magistrate before Featherfall, now caught between life and death and casting a huge spell to come back."],["The quest","Ending his scheme is the heart of the third floor's magistrate storyline. He's hiding upstairs in a building with large double doors."]]],["Lajabless",[],2,7,9,"A race whose face shifts between great beauty and a skull.","",[["How it works","A two-phase form, one beautiful and one skull-faced and strength-based. Lucia Mar switches between them."]]],["Iron Tangle",[],2,27,7,"The fourth floor: a sprawling subway network of colored train lines and stations.","",[["What it is","A vast subway system of colored lines (Red, Yellow, Ochre, Mango, Vermillion, Mindaro, Grullo, and others), transfer stations with saferooms, and stairwells only at certain station numbers."],["Dangers","Ghoul janitors, Dreks, Bonkers, Shock Chompers, Wall Monitors, Krakaren drug labs, and derailments."],["Souvenir","A toddler's cap reading \"I rode the Iron Tangle.\""]]],["Nightmare Express",[],2,27,7,"A deadly train line in the Iron Tangle.","",[["What it is","A special line reached through transfer stations like number 83. Fire Brandy keeps its fires burning."],["Carl's ride","He learns to drive it."]]],["Vernon",[],2,31,1,"A dwarf conductor on the Iron Tangle's Yellow Line.","Yellow Line Train Conductor. Dwarf, level 32",[["Who he is","A level 32 dwarf conductor in a wrinkled uniform: \"Employees only.\" Donut presses him with questions."],["Connection","His late wife's drawings are among the things burned in the fire-ant trap."]]],["Gore-Gore",[],2,37,1,"A ManTauR train engineer on the Ochre Line.","ManTauR, level 40",[["Who he is","A level 40 ManTauR in Braveheart-style blue streaks. He's devoted to Grull, and his battle cry is \"In the name of the exalted Grull!\""],["What happened","Forced off his train, he has no idea what to do with himself. He later explodes in rage at \"posers\" outside Club Vanquisher."]]],["Tizquick",[],2,47,1,"A train conductor on the Mango Line.","",[["Who he is","A heartbroken dwarf conductor, found weeping in a puddle of tears at the station 60 portals. He might know the way through."]]],["Kravyad",[],2,37,9,"Dark-magic workers who handle employee transport in the Iron Tangle, with side effects on memory.","",[["What they do","Train workers who finish their shift get off at station 435 and take a tunnel back to base. The Kravyad \"prepare\" them with dark magic, which costs time and memory."]]],["Growler Gary",[],2,52,1,"A gnoll bartender found drunk after a massacre.","",[["Who he is","A level 25 gnoll bartender. A woman ripped out his throat, and somehow he didn't die."],["What he saw","Everyone in his bar was killed. He's too drunk to sit up when Carl finds him."]]],["Silfa",[],2,48,1,"A Wisteria Fairy holistic healer the party hired.","",[["Who she is","A level 25 Wisteria Fairy with Hekla's Daughters, buzzing around the cab. Carl hopes her healing works better than holistic medicine back home."]]],["Wendita",[],2,28,1,"A Bopca Protector who runs a saferoom bar.","",[["Where","Nirula's on the Iron Tangle, a fast-food saferoom."],["Moment","Thrilled to host Donut, but firm that personal space prices can't be negotiated, even for royalty."]]],["Chaco",[],2,33,1,"A wolf-man Song Bard who hosts the game show The Prize Carousel.","Pterolykos. Song Bard, level 66",[]],["Larracos",[],2,35,7,"Capital city of the disputed lands, reachable from the Desperado Club.","",[["What it is","The ninth floor's \"funnel city,\" with real NPC-run stores where faction leaders shop in person, because factions don't get the interface."],["Access","One of the guarded stairwells inside the Desperado Club leads there. Raucous cheering comes up from below."]]],["Hunting Grounds",[],2,35,7,"The sixth floor, where paying alien hunters come in to hunt crawlers.","",[["What it is","Below the Over City in that floor's lore. It's the next level down for the NPCs: another urban level, with much bigger villages."],["Factions","High Elves rule sectors like Liana. The Naiad Confederacy and others hold the rest."]]],["Kimaris",[],2,23,1,"An armored rider on a black horse whose remains Carl looted.","",[["What it is","A collectible plush (\"beanie baby\") of an armored soldier on a black horse, taken from Miss Quill. Sorted by value, it's the top item in Carl's inventory."]]],["Clockwork Triplicate",[],2,5,11,"One of Donut's spells.","",[["What it does","Creates clockwork copies of a pet or minion, all servos and electric parts. They vanish in a puff of smoke when it ends. It only works on pets and minions (\"So no clockwork Carl\")."],["Training","One of the few spells that works inside a saferoom, so Carl has Donut cast it over and over to level it up."]]],["Magic Missile",[],1,7,11,"Donut's signature attack spell, which she casts constantly.","Spell (from a tome)",[["Origin","The Tome of Magic Missile came in one of Donut's first boxes, right before her legendary box."],["In use","Her first cast misses and blasts the alley wall. After that, it's her go-to attack in almost every fight."]]],["Protective Shell",[],1,35,11,"A protective bubble spell. Carl can cast it from a pair of enchanted boxers.","",[["How Carl casts it","His enchanted boxers let him cast a level 15 Protective Shell once every 30 hours."],["In use","The barrier throws a charging monster back like a dog hitting the end of its leash."]]],["Orren",[],4,19,13,"A hooded, grim-reaper-like Syndicate liaison with the voice of a British professor.","",[]],["Louis",["Louis Santiago","Louis Santiago 2"],4,3,0,"Louis Santiago, a Pest Exterminator crawler who joined Carl's group on the fifth floor alongside Firas. Good-natured and a bit hapless.","",[]],["Firas",["Firas M"],4,3,0,"Firas M, a Hammersmith crawler and Louis's friend who joined Carl's group.","",[]],["Samantha",[],4,24,6,"Psamathe, a minor goddess banished by her father, whose spirit is bound to a doll head that rolls along with Carl's party. Extremely foul-mouthed.","",[]],["Gwen",["Gwendolyn Duet"],4,2,0,"Gwendolyn Duet, a blunt crawler from the fifth floor's land quadrant who calls Carl \"bomber guy.\"","Crawler #1,293,776, Human, Boring Ol’ Fighter, level 34",[]],["Juice Box",[],4,1,1,"A changeling who worked at a fifth-floor inn.","",[]],["Emberus",["Sun and Ash God Emberus"],4,28,6,"An angry fire god who showed up hunting for Orthrus.","Level 250",[]],["Langley",[],4,3,0,"A serious, grey-haired crawler who led a group on the fifth floor.","",[]],["Britney",[],4,20,0,"A fifth-floor crawler from the water quadrant, along with Vadim.","",[]],["Bactrian",[],4,3,9,"A camel-like race with a town on the fifth floor, locked in a standoff with the Dromedarians and the Dirigible Gnomes.","",[["Situation","The Bactrians have the same arrangement as the Dromedarians: something in their town hall keeps the gnomes from bombing them."]]],["Changeling",[],4,1,9,"A shape-shifting race that can disguise itself as others.","",[["How it works","Changelings switch forms as they grow. Adult changelings first become a generic version of the target race, then adjust the details. Juveniles like Skarn are clumsy at it."],["Mordecai","He was born a Skyfowl, became a Changeling on floor three of his own crawl, and changes form whenever his guildhall moves."],["Fifth floor","Henrik and Svern are Changeling Principals working in Hump Town."]]],["Gate of the Feral Gods",[],4,9,10,"A legendary artifact said to be buried in the Necropolis of Anser; it was the object of a submarine captain's obsessive search.","",[["History","The submarine captain Shamus Chaindrive spent his life hunting treasures and wanted this one above everything else."],["What it does","Teleportation. Ghazi wanted it to study teleporting energized particles, and Carl's team uses it to drop onto the necropolis."],["The danger","Feral gods are what other gods threw into the Nothing. The Gate can let them through."]]],["Necropolis of Anser",[],4,1,7,"An ancient necropolis on the fifth floor where the Dromedarians are trapped.","",[["What it is","A giant tomb in a bowl, built by Bactrian and Dromedarian slaves for the emperor Anser. Hump Town sits on top of it."],["Mysteries","The ghost queen Quetzalcoatlus, Psamathe's possession of her, and the tomb raiders working their way down from the top."]]],["Mad Dune Mage",[],4,6,3,"An enemy holed up in a sandcastle on the fifth floor.","",[["Where","The Sandcastle of the Mad Dune Mage in the land quadrant, guarded by giant snakes, giant spiders and pazuzu \"punk rock\" scorpion-men."],["Context","Gwen's team worries they don't have the numbers to take it."]]],["Dmitri",["Maxim","Popovs","Maxim Popov"],2,1,0,"The Popov brothers, Dmitri and Maxim, fused into one two-headed Nodling crawler. A top-ten threat.","",[]],["D'Nadia",["Princess D'Nadia","Empress D'Nadia"],2,1,0,"A tentacle-faced saccathian royal crawler.","",[["On Danger Zone","Princess D'nadia of the Prism, a Saccathian. She nearly has a stroke laughing when Donut keeps calling Tucker \"Butler.\""],["Politics","She thinks both Borant and the Valtay are jerks, but leans Valtay."]]],["The Hunting Grounds (sixth floor)",["Sixth floor"],5,1,7,"The current floor. Crawlers arrive while hundreds of alien hunters wait in Zockau, released after a grace period.","The sixth floor",[["How it starts","85,223 crawlers arrive. 360 hunters are held in Zockau for a 30-hour grace period, then released. The welcome message ends with \"Run.\""],["Exits","2,344 exits lead to the seventh floor. At least one, unguarded, is in Zockau, with more in the valley beyond."]]],["Zockau",[],5,1,7,"The city where the alien hunters are held at the start of the sixth floor. It has at least one unguarded exit.","",[["What it is","The hunters' starting city on the sixth floor. All hunters are transferred there for the 30-hour grace period before they're released."],["Exits","At least one unguarded seventh-floor exit is inside the city."]]],["Hunter",[],5,1,2,"A paying alien who enters the sixth floor to hunt crawlers for sport.","",[["What they are","Paying aliens with their own classes, levels and factions (the Dark Hive, the Dream, the Skull Empire, the Crafter Alliance and others). They come to the sixth floor to hunt crawlers for sport."],["Danger","Hunters can be permanently killed. Crawlers who kill them earn a red Hunter Killer dagger badge."]]],["Agent Provocateur",[],5,1,11,"A class-upgrade option offered to Carl, focused on invisibility and sabotage.","",[["What it offers","Built around being invisible and causing trouble. It's the upgrade Carl wanted most among the three offered: Revolutionary, Guerilla and Agent Provocateur."],["How it was offered","The choice plays out on a screen with an unusually emotionless voice, and Carl can't interact with it."]]],["Quasar",[],5,3,1,"Carl's newly assigned lawyer: a small, gruff alien with a fast-talking New York-style accent who represents only Carl.","",[]],["Zerzura",[],5,3,11,"A spell Quasar urges Carl to request, famous because a past crawler used it in a legendary deal.","",[["Origin","Carl's lawyer suggested it. Quasar tells the story of Remex the Grand, who used it in a famous, glorious move that ended badly for him."]]],["Chin'Dua",["Dua","Chin'dua"],5,5,2,"A drunken alien hunter Carl marks with the Ring of Divine Suffering.","Draconian, level 50, Striver",[["What happened","The drunk hunter Carl marks with the Ring of Divine Suffering, which infects both Carl and Donut with Left to Fester until Chin'Dua dies."],["Stats","His highest stat is Dexterity, which is the stat Carl would gain."]]],["Ring of Divine Suffering",["Enchanted Night Wyrm's Ring of Divine Suffering"],5,5,10,"A ring that marks a target. Killing the mark gives a stat boost; until then the wearer suffers the Left to Fester debuff.","",[["Origin","Carl got it from Frank Q. It's an enchanted Night Wyrm's ring built for crawler killers."],["Warnings","Mordecai grabs Carl's wrist and demands he take it off. It's dangerous, evil magic."],["How it works","Mark a target, suffer Left to Fester until they're dead, then gain their highest stat."]]],["Left to Fester",["Fester"],5,5,11,"A debuff from marking someone with the Ring of Divine Suffering. It blocks healing until the mark is dead.","",[["How it works","Healing is blocked for the ring's wearer and their party until the marked target dies. It's named in the Cookbook."]]],["Mantis",["Mantises"],5,5,9,"An insectoid alien race. The females carry sword-like arms; several hunters are mantises.","",[["Factions","The Dark Hive, and the Burrowers, a separate clan people mix up with them."],["First seen","Xindy, a flying level 61 female Blood Tracker."]]],["Xindy",[],5,5,2,"A flying level-61 mantis hunter and Blood Tracker from the Dark Hive.","Mantis, level 61, Blood Tracker",[["What happened","Spotted over the hunter camp as Carl makes his move. Chin'Dua wonders why she's \"so worked up.\""]]],["Vrah",[],5,5,1,"The mantis mayor of Zockau. Xindy is her little sister.","",[]],["Dark Hive",[],5,5,8,"A mantis faction that sends hunters onto the sixth floor.","",[["Known members","Xindy (a Blood Tracker) and others."]]],["Susan",[],5,6,5,"Miriam Dom's Hellspawn Familiar: a famously vicious royal corgi, now a demonic pet.","",[["Who she is","The infamous Pembroke Welsh corgi given to the future Queen Elizabeth II on her 18th birthday, now a demonic Hellspawn Familiar and Miriam's pet. \"All Dogs Go to Heaven\" clearly didn't apply."]]],["Hunter Killer",[],5,6,12,"A badge tally for crawlers who kill hunters.","",[["How it shows","A spinning red dagger badge next to your crawler-killer skulls and boss stars. Donut gets her first one almost by accident, with a magic missile while running away."]]],["Crawler Everly",[],5,6,0,"A Cookbook author from the 5th edition whose notes cover hiring mercenaries.","",[["In the Cookbook","Hired five mercenaries, four from the merc guild on the Desperado Club's sixth floor and a healer from Club Vanquisher."]]],["Butcher's Masquerade",[],5,8,12,"A party near the end of the sixth floor with a prize counter that takes hunters' hands as tickets.","",[["What it is","A grand party, the Butcher's Masquerade, that crawlers can get invited to on the sixth floor. Hunters' hands work as tickets at its prize counter."]]],["Ursine",[],5,9,9,"A bear-folk race. A large, strict Ursine town sits across the river.","",[["What they are","Bear-folk with a large settlement just across the river, about 40 km from Carl's first sixth-floor position. They're \"very peculiar there.\""]]],["Point Mongo",[],5,11,7,"Donut's new name for the large Ursine settlement after she takes it over.","",[["What it is","The large Ursine settlement, renamed after its new ruler's pet. Donut has to wear the town's gem while she's there."],["Problem","Dinosaur attacks are getting worse, which starts the quest \"The Recital.\""]]],["Kiwi",[],5,11,3,"A level-60 Mongoliensis pack leader, the head of a gang of unhinged raptors.","Mongoliensis Pack Leader, level 60",[]],["The Recital",["Recital"],5,11,12,"A quest about growing dinosaur attacks around Point Mongo.","",[["Setup","First a chicken, then an Ursine. The townsfolk shrugged at first, but the dinosaur attacks keep growing."]]],["Clint",["Clint Smashgrab"],5,13,1,"A one-legged Were-Kin scout serving Signet. His people were once the Chee.","",[]],["Chee",[],5,13,9,"A peaceful race of carpenters whose land the High Elves seized. None remain as they were.","",[["History","Peaceful carpenters, until the High Elves wanted their land. What's left of them became the Were-Kin, like Clint Smashgrab."]]],["Were-Kin",[],5,13,9,"What became of the Chee: shapeshifters who aren't quite werewolves.","",[["Known one","Clint Smashgrab, a level 50 Light Recon Specialist with a metal bar where one boot should be."]]],["High Elves",[],2,6,9,"Proud, xenophobic elves known for hunting down the late king's mixed-blood children.","",[["Signet","As King Finian's half-naiad daughter, she was always in danger from High Elves who hunt the king's mixed-blood children. Her storyline is set up to bring revenge down on them."],["Sixth floor","They ruled over others, including taking the Chee's land."]]],["Areson",[],5,14,1,"An elite working with Signet and helping protect her people from the hunters. He has brothers.","",[]],["Imogen",["Queen Imogen"],5,14,1,"Signet's half-sister, who now rules the High Elves. Long ago she was the Sorcerer General who attacked the Chee.","",[]],["Nadine",["Miss Nadine"],5,14,1,"A huge Bearded Sage Caterpillar who was once a Chee teacher.","Bearded Sage Caterpillar, level 50",[]],["Edgar",[],5,15,1,"A talking tortoise among Signet's followers.","",[]],["Fort Freedom",[],5,15,7,"The Naiad Confederacy's fortress in a former river palace, the target of Signet's revenge quest.","",[["What it is","The Naiad's former river palace, now the Naiad Confederacy's fortress. Signet's quest is to help assault it and assassinate its leaders."]]],["Naiad Confederacy",[],5,15,8,"A faction holed up in Fort Freedom whom Signet blames for her mother's death.","",[["Reputation","Known for drowning outsiders. Signet blames them for her mother's assassination."]]],["Enthusiastic Double Gonorrhea",["Arrow of Enthusiastic Double Gonorrhea"],5,15,11,"A miserable, non-lethal poison found on looted hunter arrows.","",[["Source","Arrows looted from hunters, tipped with this very nasty, non-lethal poison."]]],["Holger",[],5,16,1,"A mulleted Were-Kin who travels with Clint at Signet's orders.","",[]],["CrawlCon",[],5,21,13,"A galaxy-wide Dungeon Crawler World fan convention. Carl gets a booth and appears virtually.","",[["What it is","A fan convention with thousands of physical attendees and billions of virtual visitors. Carl gets a free fan booth. Hurk, Effex and other figures appear there."],["Events","Art judging, panels and autograph tables, all done virtually for crawlers."]]],["Akland",[],5,22,2,"A moon elf artillery hunter from the Dream.","Moon Elf, level 51, Artillery Specialist",[["What happened","Caught by Samantha, he begs and offers Carl everything he has. Carl marks him with the ring. His highest stat is Constitution."]]],["The Dream",[],5,22,8,"A hunter faction of moon elves.","",[["What they are","A powerful moon elf hunter faction. A dead Dream hunter had only one name on his list, the last one, and had circled it over and over."]]],["Skull Empire",[],5,22,8,"A hunter faction claiming territory on the sixth floor.","",[["Who they are","An orc empire, a far bigger deal than the Tuskling-ruled Orcish Supremacy. King Rust rules. His children include Crown Prince Stalwart, Prince Maestro and Princess Formidable."],["On the sixth floor","They send hunters too, like the Future Huntress."]]],["Claude Sludgington the Fourth",[],5,27,4,"A lightning-throwing amphibian borough boss.","Level 65 Borough Boss",[["What it is","An Eryops Gigantis, a giant amphibian that shoots lightning from its eyes and gets a 10x constitution bonus when it's rooted in place. Notoriously hard to kill."],["The fight","He shows up at the last possible moment at a party near the water."]]],["Big Tina",["Tina"],5,28,3,"A dangerous dinosaur in a pink boa, linked to attacks on Point Mongo and other towns.","",[]],["Hurk",[],5,31,13,"A cheerful gleener who sits beside Carl at CrawlCon.","",[["Who he is","A jovial Gleener judge at the CrawlCon art contest who keeps stifling his laughter. He explains G'valt's grumpiness."]]],["Gleener",[],5,31,9,"A bluish, human-sized alien race.","",[["What they are","Fish-like aliens that look like human-sized kua-tin. Their aquatic homeworld makes them preferred hosts for some parasitic races."]]],["Circe Took",["Circe"],5,32,13,"A mantis minor hive queen and businesswoman. Once a famous hunter, now an amusement park owner and CrawlCon moderator.","",[]],["Uptown Hal",["Hal"],5,33,13,"A CrawlCon panelist.","",[["Moment","Buried in his screen and notes, he only speaks up to correct Sydnee when she calls something a betrayal."]]],["Sydnee Iglacia",["Sydnee"],5,33,13,"A saccathian Crawl Historian on a CrawlCon panel.","",[["Who she is","A crawl historian in a dirty, toga-like sheet who looks forward to book sales if Carl dies."]]],["Drick",[],5,33,2,"An old, scarred moon elf from the Dream, clearly a former crawler.","",[["Who he is","An old, heavily scarred, albino, bald moon elf of the Dream on a CrawlCon panel. Still visibly muscular, he's obviously a former crawler. He suspects Carl is listening."]]],["Burrowers",[],5,34,8,"A mantis clan, often confused with the Dark Hive.","",[["Distinction","They were the ones squatting in a hive system, not the Dark Hive. Most people don't know the difference. Edict says a gear contract with them is already in effect."]]],["Diwata",[],5,36,6,"A minor, vengeful nature goddess who can grow trees and summon animals. Some dryads worship her.","",[]],["Edict",[],5,38,2,"A male mantis merchant from the Dark Hive.","Mantis, level 50, Merchant",[["Who he is","A level 50 male mantis merchant. Males lack the females' sword arms, which makes him look pitiful. He can't hand over gear already under contract to the Burrowers."]]],["Prudence",[],5,44,1,"An Ursine barmaid terrified of Big Tina.","",[]],["Viscount Fog",[],5,46,1,"A long-dead vampire hunter whose mount still roams.","",[["Who he was","A great hunter of vampires and undead, now dead. He trained his mount, Sierra, a Northropi vampire, which remains as a bereft minion."]]],["Sierra",[],5,46,4,"Viscount Fog's vampire mount, now a boss.","Level 65 Neighborhood Boss",[["The fight","A level 65 neighborhood boss, a Northropi vampire, met in a lightning storm. It grabs Carl in its talons, and holy water only makes it screech."],["Origin","Trained by Viscount Fog, the late vampire hunter. Now a bereft minion."]]],["Odious Creepers",["Creepers"],5,48,3,"Extremely powerful sixth-floor monsters, slow by day and able to merge with others at night.","",[["What they are","The AI calls them some of the most powerful monsters ever to appear on a sixth floor in the show's history."],["Good news, bad news","Like Shambling Berserkers, they're slow during the day."]]],["Pearson",[],5,58,1,"A changeling who disguised himself as a bartender on the previous floor.","",[]],["Zabit",[],5,67,2,"A four-armed Atoll Beastmaster hunter.","",[]],["Horton",[],5,70,13,"A mushroom-headed figure Elle teases.","",[]],["Bianca",["Bianca Del Ciao"],5,6,5,"Miriam Dom's goat, turned by an enhanced pet biscuit into a draft-horse-sized demonic creature wreathed in black flame. She pulls Miriam's cart.","Hellspawn Familiar, level 32",[]],["Remex the Grand",[],5,3,0,"A crawler from a past season whose exit deal using Zerzura is famous enough that Quasar studied it in school.","",[["Who he was","A crawler from a past season whose end was tragic and controversial. A planned cataclysmic explosion was supposed to go off with his death."],["Legacy","His Zerzura move is studied in school, according to Quasar. \"Shame how it ended for him.\""]]],["Vadim",[],4,20,0,"A fifth-floor crawler from the water quadrant, along with Britney.","",[["Who he is","Vadim Zbar, a Kuhli (lizard-like, despite the fish name) Gut Rearranger, a healer/rogue hybrid. He and Britney are the only survivors from the water quadrant, and they don't want to go back."],["Lusca","He's on the bridge during the big fight, where Carl calls on him for Torch."]]],["Orthrus",[],4,28,3,"The name Emberus kept shouting while he searched.","Juvenile Gate Guardian, level 10",[["What happened","The fire god Emberus storms through the fifth floor shouting \"Orthrus!\" over and over. He's blind and searching for something."],["Meaning","Someone has let him out of the Nothing."]]],["Trailblazing Crazy Cat Lady",[],1,2,14,"First crawler ever to enter the World Dungeon with a cat. This is the achievement that sets up Donut's whole transformation.","",[]],["Early Adopter",[],1,2,14,"For being among the first 5,000 crawlers into a brand-new World Dungeon. The AI calls you a sucker.","",[]],["Empty pockets",[],1,2,14,"For entering the dungeon with no supplies at all, not even food.","",[]],["Why aren't you wearing pants?",[],1,2,14,"For entering the dungeon with no pants. Carl's boxers become legendary.","",[]],["Unarmed combat",[],1,2,14,"For walking into a \"World Dungeon\" without a weapon. Either brave or an idiot, says the AI.","",[]],["Loner",[],1,2,14,"For entering without any human companions. A cat doesn't count.","",[]],["Fall into an obvious trap",[],1,2,14,"For walking straight into an obvious trap, the AI's first jab at Carl.","",[]],["Goblin",[],1,2,3,"The dungeon's first and most common enemies: small, crude and armed with dangerous steam-powered machines.","First met at level 2",[["First contact","Carl's first fight is against goblins driving a Goblin Murder Dozer, a spinning steam machine that ends in a boiler breach countdown."],["Varieties","Engineers, Bomb Bards, Shamankas and plain level-2 grunts. Goblin explosives become Carl's specialty."],["Gear","Goblin dynamite (unstable), smoke bombs and the Copper Chopper."]]],["Goblin Engineer",[],1,2,3,"The goblin who drives and builds the machines. The AI describes engineers as \"the incels of the goblin world.\"","First met at level 3",[["What they do","They run and repair goblin contraptions like the Murder Dozer."],["Later","Captured engineers build Carl's Copper Chopper."]]],["You've inflicted damage on a mob",[],1,5,14,"For the first time you hurt a monster. \"Hopefully it won't hit back!\"","",[]],["You've killed a mob",[],1,5,14,"For your first monster kill. The AI wonders if he had a family.","",[]],["You've killed a mob a higher level than yourself",[],1,5,14,"For beating a monster that outlevels you.","",[]],["You've entered a guildhall",[],1,5,14,"For opening the door to a guildhall. Congratulations on knowing how doors work.","",[]],["Podophilia",[],1,5,14,"For crushing an enemy to death with bare feet. The AI reveals its foot obsession and promises more rewards for it.","",[]],["Boom",[],1,5,14,"For setting off a wall-shaking explosion, Carl's first step toward his explosive specialty.","",[]],["Level-Up, Baby",[],1,5,14,"For gaining your first level.","",[]],["Heal Critter",[],1,5,11,"A pet-only healing spell. Carl learns the hard way that it won't work on Donut once she's a crawler.","Spell (from a scroll)",[["What happened","Carl gets a scroll of it at the very start. When he reads it on a wounded Donut, it fails (\"No Valid Target\"), because she's no longer a pet."],["Later","Donut gets a spellbook of it for healing her own pets."]]],["Potion of Healing",[],1,5,10,"The standard health potion. Basic loot from the earliest boxes, and a constant lifeline.","",[["In use","Carl keeps them close for emergencies when his tiny mana pool can't cover a heal."]]],["Potion of Mana",[],1,5,10,"The standard mana refill potion, from the first adventurer boxes.","",[["In use","It's precious early on, when both Carl and Donut can only manage a few casts."]]],["Enchanted Nightgaunt Cloak of Stoutness",[],1,5,10,"Carl's signature cloak, stretched over long bony fingers. +4 Constitution plus resistance to poison, ice and piercing.","",[["How he got it","From a gold apparel box at the start. Mordecai gasps when it appears."],["What it does","+4 Constitution, poison and ice resistance, and anti-piercing protection. The hood has pointed ear shapes."],["Life with it","He wears it over boxers and a jacket, and once uses it to wipe vomit off Donut's face."]]],["Enchanted Trollskin Shirt of Pummeling",[],1,5,10,"The shirt Mordecai calls even better than the cloak: +7 to the Regeneration skill.","",[["How he got it","The same gold apparel box as the Nightgaunt Cloak."],["Why it's good","Serious regeneration, which is huge for a brawler with almost no healing magic."]]],["Enchanted Toe Ring of the Splatter Skunk",[],1,5,10,"A toe ring with +3 Strength and +3 Powerful Strike. Carl wanted shoes.","",[["How he got it","From the gold shoe box. He was furious to get a toe ring when he had no shoes."],["What it does","+3 Strength and +3 to Powerful Strike, plus jokes about hippies."]]],["Loot",[],1,6,14,"For wearing something you found in the dungeon.","",[]],["Oooh, Magic",[],1,6,14,"For wearing magical gear for the first time.","",[]],["Enchanted Crown of the Sepsis Whore",[],1,7,10,"Donut's smoky, dark-gemmed crown. It made her a royal of the Blood Sultanate forever.","",[["What it does","Lets her inflict the Septic debuff. Wearing it permanently put her in the Blood Sultanate's royal line of succession."],["The catch","On the ninth floor, royals must kill the Sultan and every other family member before they can go down."]]],["Bad Llama",[],1,8,3,"A level 3 first-floor llama: \"It's a llama, but it's bad.\"","First met at level 3",[["In the game","If it were human, it'd be covered in prison tattoos. One of Donut's first kills, with an assist from Carl."]]],["Tally",[],1,9,1,"The first Bopca Protector Carl meets: a level 63 caretaker of a saferoom, in a paper hat, barely taller than the counter.","Bopca Protector, level 63",[["Who he is","Runs Carl and Donut's first real saferoom and serves them food made to order. He asks Carl's spice tolerance on a scale of one to five."],["Why it matters","Their first taste of a safe, cozy space in the dungeon."]]],["Scatterer Brood Guardian",[],1,10,3,"A level 4 giant cockroach, \"baptized in rage and Monster Energy drinks,\" too big to squish.","First met at level 4",[["In the fight","Bigger than the regular Scatterers and almost Donut's size. Carl pulls his toad cudgel instead of punching it."]]],["Boss Babe",[],1,11,14,"For damaging a dungeon boss. The AI notes this is usually the last achievement most crawlers ever get.","",[]],["Wisp Armor",[],1,12,11,"A self-only armor spell: 5 mana, 5 minutes plus a minute per spell level. Carl's first spellbook.","Spell (from a tome)",[["How he got it","The Tome of Wisp Armor from a bronze boss box. For a while it's the most valuable thing he owns."],["The catch","It cost more mana than Carl even had at the time."]]],["Confusing Fog",[],1,12,11,"A scroll spell that fills an area with disorienting fog. Carl uses it to break line of sight in early fights.","Spell (from a scroll)",[["In use","In the Juicer's gym, the fog lasts only 15 to 20 seconds, enough to scramble the troglodytes."]]],["Potion of Iron Skin",[],1,12,10,"A potion that raises natural armor for several minutes. Carl got a stack of five early on.","",[["In use","Before risky fights, Carl drinks one and makes Donut drink one too."]]],["Goblin Bomb Bard",[],1,15,3,"A level 5 goblin even more unhinged and sadistic than the rest. They ride Copper Choppers into battle.","First met at level 5",[["What they are","Goblins who love explosives far too much. The Copper Chopper is their preferred assault vehicle."]]],["Goblin Shamanka",[],1,15,3,"A level 7 goblin spellcaster (\"Shamanka\" just means female shaman), with sharpened teeth and a pierced, forked tongue.","First met at level 7",[["In the game","A magic-using goblin whose looks take some getting used to."]]],["War Criminal",[],1,19,14,"For killing more than 20 non-combatants in a single attack.","",[]],["Bitchmeat",[],1,21,14,"For being attacked by another crawler in a safe zone, where the system had to step in and save you.","",[]],["Troglodyte Pygmy",[],1,23,3,"Small, muscular lizard-men with kangaroo legs, and an intelligence just shy of an oft-dropped toddler.","First met at level 2",[["In the game","Level 2 mobs that look like upright Komodo dragons from the waist up. They swarm the Juicer's gym."]]],["Two Chicks at the Same Time",[],1,25,14,"For killing two mobs at once by using their own bodies against each other.","",[]],["Enchanted Shuriken of Bloodlust",[],1,25,10,"A stack of 100 small throwing stars from a boss box. Low damage, but there are a lot of them.","",[["What they are","Nothing special on their own. Volume is the point."]]],["Swine",[],1,26,4,"The Ball of Swine, also called the Porkchop Express: a level 15 borough boss, a battle formation of Tusklings rolled into one ball.","Level 15 Borough Boss",[["What it is","Alone, Tuskling courtiers aren't worthy foes. Together, in their ancient formation, they become a single giant boss."],["The fight","Donut is out of magic missiles, so Carl leads with his fists."]]],["Tuskling Knight",[],1,26,3,"A tottering, wine-sipping level 4 Tuskling, a pig-folk \"knight\" whose title means about as much as their dating standards.","First met at level 4",[["Context","Tusklings are mostly jokes alone and dangerous in formation (see Ball of Swine)."]]],["Brindle Grub",[],1,30,3,"Level 2 larvae on the first floor that grow into cow-tailed grubs and then pupate into something worse.","First met at level 2",[["Loot","Vials of Brindle Grub Hemolymph, used in alchemy."],["Context","Carl finds them killed by Crawler Agatha."]]],["Danger Dingo",[],1,30,3,"A level 5 first-floor dingo, voiced by the AI in a terrible Australian accent. Kobolds also ride them as mounts.","First met at level 5",[["Lesson","Carl feeds one early on. Later that kindness pays off when it swallows the boss Ralph whole."]]],["Bully and a Thief",[],1,30,14,"For stealing from a lower-level crawler.","",[]],["Battlefield Construction",[],1,30,14,"For building a structure and deploying it in battle.","",[]],["This Little Piggy Went to Market",[],1,30,14,"For killing more than five enemies during boss fights with bare feet. The AI is delighted.","",[]],["Enchanted Pedicure Kit of the Sylph",[],1,30,10,"A magical 12-piece foot-care kit. Its buff gives Carl extra seconds to react to foot-triggered traps.","",[["What it does","Pedicure tools that leave a lasting buff. This is the AI's foot obsession at work."]]],["Unvaccinated Clurichaun Rev-Up Consultant",[],1,32,3,"A level 3 slingshot-wielding Rev-Up foot soldier. \"If you hear banjo music, run.\"","First met at level 3",[["Context","The bottom tier of Krakaren's multilevel-marketing empire. Clurichauns are distant cousins of leprechauns."]]],["Laminak Rev-Up Consultant Elite",[],1,32,3,"The second tier of the Rev-Up empire: level 6 winged consultants who look like miniature soccer moms.","First met at level 6",[["Loot","Their corpses become alchemy material, prized for their \"essence.\" Carl was hoping for potions."]]],["Wait, Bosses Can Leave Their Rooms?",[],1,33,14,"The second floor's rude welcome: bosses there can roam.","",[]],["Krakaren Clone",[],1,34,4,"A level 10 neighborhood boss, one copy of the Krakaren collective mind. Kill one and two more are born.","Level 10 Neighborhood Boss",[["What it is","A Krakaren, not the Krakaren. Part of a hive mind set against scientific thought, running the Rev-Up scheme."]]],["Dungeonpreneur",[],1,35,14,"For inventing a stackable weapon, device or potion. Your name goes into the Dungeon Codex.","",[]],["Enchanted BigBoi Boxers",[],1,35,10,"Bonuses: +2 Constitution, later +5 Dexterity too.","",[["What they are","White boxers covered in red hearts, with an Incredible Hulk joke. They give +2 Constitution and a level 15 Protective Shell once every 30 hours."],["Upgrade","The first Scroll of Upgrade went into them, adding more bonuses."]]],["Rage Elemental",[],1,38,3,"A level 93 horror from the 13th floor, summoned to kill rule-breakers and their entire party.","First met at level 93",[["How it appears","It's the penalty for peeing or pooping outside designated areas in certain safe places. It kills everyone in the offender's party."],["What it looks like","A colossal badger-like skull with curved goat horns. It roars and the ground shakes."]]],["What goes up",[],1,39,14,"For surviving the dreaded Reverse Gravity spell.","",[]],["Like a Moth to the Flame",[],1,39,14,"For damaging a monster more than 75 levels above you, and living.","",[]],["Cow-Tailed Brindle Grub",[],1,40,3,"The level 3 final stage of the Brindle Grub before it pupates. Too big to run over with the Chopper.","First met at level 3",[]],["Kobold Rider",[],1,41,3,"A level 5 kobold who rides a Danger Dingo. The AI notes kobold DNA is nearly the same as a chihuahua's.","First met at level 5",[]],["Grease Monkey",[],1,41,14,"For building and deploying a wheeled device.","",[]],["Frenzied Gerbil",[],1,45,4,"A tiny, furious gerbil. Ralph the Frenzied Gerbil is a level 11 neighborhood boss, and later they come packed in throwable balls.","Level 11 Neighborhood Boss",[["First floor","Ralph's boss fight ends when a dingo eats him."],["Fifth floor","Carl gets a set of throwable balls that each turn out to hold the same thing, a frenzied gerbil."]]],["I'll take the ceramic dalmatian, Pat",[],1,46,14,"For discovering a reward room, which offers items you can't get in loot boxes. Usually it's one pick per room.","",[]],["Menagerie",[],1,46,14,"For discovering a pet reward room, the kind where Carl and Donut found Mongo.","",[]],["PETA Enthusiast",[],1,47,14,"For turning a hostile, non-sapient enemy into an ally that fights for you.","",[]],["Bomb Squad Tech",[],2,2,10,"One of the three Earth classes the AI recommended to Carl, along with Prize Fighter and the class he chose, Compensated Anarchist.","",[]],["Village Guard Swordsman",[],2,3,3,"Level 75 third-floor village guards: bulky, silent and armed with long blades. They only work during the day.","First met at level 75",[["Rules","They protect population centers from Over City Ruins creatures, but only while the sun is up."]]],["Former Circus Lemur",[],2,4,3,"A level 8 knife-throwing lemur in a painted human-skull mask, left over from Grimaldi's Traveling Circus.","First met at level 8",[["Dark note","They killed the three Bautista sisters, all crawlers."]]],["Terror the Clown",[],2,4,3,"A level 10 circus clown monster. \"It's okay if you just pissed yourself. You wouldn't be the first.\"","First met at level 10",[["Context","Part of what's left of Grimaldi's circus on the third floor."]]],["It's Elementary, My Dear Crawler",[],2,5,14,"For receiving your first quest.","",[]],["Torch",[],2,5,11,"Donut's light spell: a curl of light that follows the caster. She calls it stupid. Mordecai calls it useful.","",[["How it works","Its strength grows the more she uses it."]]],["Puddle Jumper",[],2,5,11,"Donut's teleport spell. It moves her and up to three others a short distance.","",[["What it does","Mordecai calls it \"a good one.\" It becomes a key escape tool."]]],["Second Chance",[],2,5,11,"Donut's 10-mana spell that raises a dead lower-level monster as her undead minion.","",[["How it works","The minion has a fraction of its former power but follows her orders. It's the start of her minion army."]]],["Enchanted Anklet of the Fallen Oak",[],2,6,10,"A rattling anklet: +1 Dexterity, +1 Constitution and the Double Tap skill. Its description argues you shouldn't wear it.","",[["What it does","Minor stat boosts plus Double Tap. It rattles like seed pods, which makes it a distraction."]]],["Meet an Elite",[],2,6,14,"For meeting an Elite, a powerful one-of-a-kind NPC or mob. Where there's one, there are usually more.","",[]],["Mold Lion",[],2,7,3,"Third-floor lion monsters. Donut raises one as an undead minion, and Signet asks Carl to keep them off her.","First met at level 15",[["In play","Undead Mold Lions are a third as strong as they were alive but still useful fodder."]]],["Lazarus",[],2,8,14,"For surviving an offensive spell above level 15.","",[]],["Heather the Bear",[],2,9,4,"A level 19 neighborhood boss: a roller-skating circus bear who has performed since she was a cub, now infested with bone-white worms.","Level 19 Neighborhood Boss",[["Her story","One of Grimaldi's circus performers, kept asleep by the Water Lily curse. Carl is asked to kill her."],["Why it matters","Her fate shows how cruel the circus storyline is, and her worms turn up again in Apollon's \"ice cream.\""]]],["Blood and Ink Elemental",[],2,9,3,"A level 50 three-headed ogre that Signet summons out of blood and ink, part of her tattoo army.","Summoned Minion of Tsarina Signet, level 50",[["What it is","One of Signet's summoned minions. Her tattoos move on her skin until she calls them out."]]],["Clammy the Clown",[],2,10,3,"A level 9 circus clown with long, yellowed, badger-like nails. \"A face not even a mother could love.\"","First met at level 9",[]],["Street Urchin",[],2,12,3,"Level 8 spiky creatures that come out at night on the third floor and clean up the bodies piled outside village gates.","First met at level 8",[["In the game","Their spines can pierce right through a foot. Villagers leave the bloodless dead outside for them."]]],["One Quadrillion",[],2,13,14,"For being one of the first ten crawlers to reach a quadrillion vi
