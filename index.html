team rides it during the hostage handoff and ends up taking its controls."]]],["Drop Bear",["Gnomish Drop Bear"],4,3,3,"One of the Dirigible Gnomes' earliest fast-attack planes, a biplane with a screaming, rabid-koala face painted on it.","",[["What it is","A gasoline-powered biplane. There are only a handful left."],["In use","Carl's group finds an intact one and uses it in the attack on the sky fortress."]]],["Pandinus",[],4,23,7,"A pazuzu town in the fifth floor's land quadrant. Smaller than Hump Town, with inns but no Desperado Club.","",[["Who lives there","Pazuzu, half-human, half-scorpion centaur-like creatures."],["Why it matters","It's the team's base in the land quadrant, and the spot they aim for when using the Gate of the Feral Gods."]]],["Ikicha",[],5,5,0,"A crawler from a past season whose writings described the sixth-floor world as icy and cold.","",[["Why it matters","Comparing old accounts (Ikicha's ice, Azin's kite birds) shows that the sixth floor changes from one season to the next. This time it's mostly jungle."]]],["Keith H",["Keith"],5,31,1,"A rude six- or seven-year-old human at CrawlCon whose art Carl has to judge. Carl doesn't like him.","",[["Moment","He opens with \"My daddy says you're the cat's bitch.\" Carl gives him the lowest score."]]],["G'valt",["G’valt"],5,31,1,"A grumpy, robed contestant at CrawlCon whose label reads \"Session of Love.\"","",[["Moment","Hurk says he's sulking because they added his drama to his name. He later passes out during the judging."]]],["Effex",[],5,41,13,"A nervous Soother handler at CrawlCon who manages the photo and autograph table next to the Popovs.","",[["Role","He slides photos over for Carl to sign. He's a stickler about the premium-pass photo rules, including counting a symbiote as an extra person."]]],["Dreadnought",["Dreadnoughts","Dreadnaught"],4,2,8,"The Dirigible Gnomes' huge airships, like the Wasteland under Commandant Kane, which rule the skies of the fifth floor.","",[["What they are","Flying fortresses and the base of the gnomes' air superiority, fitted with bombing equipment and support craft like balloons and Drop Bears."]]],["Nightgaunt",["Nightgaunts"],1,5,9,"A faceless, bony-fingered horror. Carl's favorite cloak is made in its image.","",[["Carl's cloak","The Enchanted Nightgaunt Cloak of Stoutness, from a gold apparel box on the first floor, gives +4 Constitution and poison resistance. Long fingerbones line it, and the hood has pointed ears."],["In the world","The Nightgaunt Precipice is one of the fifth-floor map choices."]]],["Lesser Demon",["Lesser Demons"],3,14,9,"Fire demons who keep engines and furnaces burning. Fire Brandy on the Nightmare Express is one.","",[["What they are","Lesser demons are put in charge of fires that need stoking. Fires that have to burn extra hot get the rarer Sheol-born kind."],["Known one","Fire Brandy, the exhausted level 75 fire(wo)man of the Nightmare Express, and a non-combatant."]]],["Pooka",["Pookas"],3,12,3,"Fuzzy, goblin-like neighborhood bosses behind slotted doors on the fourth floor. Later it becomes clear they're meant to stand in for drug dealers.","",[["What they are","Each sits behind a door at the end of a passage, like Imani described."],["The metaphor","In the Iron Tangle's allegory, the Krakaren make the drugs and the Pooka hand them out. They seem to represent the Plenty."]]],["Djinn",[],2,15,9,"Wind spirits. Quint the pharmacist is half Djinn, and he hates being called a genie.","",[["What they are","Elemental beings. Half-Djinns are common among the galaxy's merchants."],["Quirks","Charisma bonuses don't work on them, as Mordecai warns. Quint insists: \"It's Djinn. Not Genie.\""]]],["Lepus",[],3,6,9,"One of the most widespread semi-intelligent species in the known universe. Red Cornets are a devolved form of them.","",[["Why it matters","The Red Cornet's description traces it back to the Lepus."]]],["Nekhebit",[],3,24,6,"A long-forgotten goddess, jealous and terrible, abandoned when the elf mothers chose to worship Apito instead.","",[["Where it shows up","In the lore attached to a weapon Carl's team finds on the fourth floor."]]],["Burgundy",[],2,18,1,"A young, dark-haired assistant in the Magistrate's household, with one pale blue eye and one brown eye. Really a vampire.","",[["The tell","The map labels her human, just as it wrongly labels Katia."],["What happens","Carl's group later finds her badly burned in the house, which exposes what's really going on there."]]],["Benjamin",[],2,20,1,"Ricky Joe's pet salamander on a stick. When it stops moving, a third-floor family brawl breaks out.","",[["What happens","When the salamander dies, the dwarf family loses it. In the chaos, Mongo swallows Benjamin and Ricky Joe's forearm."]]],["Mysterious Letter",[],2,17,10,"A blood-stained letter Carl pulls from the orc GumGum's corpse, along with a Gate Pass. It turns out to be key to the third floor's quest.","",[["What it is","A folded page stained red. Mordecai works out what it really means."],["In use","Carl takes it out at a key moment, while Donut rehearses her \"lines.\""]]],["Death Watch Extreme Dungeon Mayhem",["Death Watch"],1,41,13,"Prince Maestro's sadistic program. Its \"Death Watch\" segment pulls crawlers out of certain death so the audience can torment them.","",[["How it works","The studio is leased by different productions. Crawlers appear because sponsors paid for it, and they're told so bluntly."],["Carl's move","Instead of sitting quietly, Carl demands to go on the show itself before the segment ends."]]],["Dungeon Crawler After Hours",[],1,27,13,"Odette's interview show, which airs right after the main recap. Carl and Donut's first talk-show appearance.","",[["How it works","An independent program that pays for its own production plus an advertising stipend. Lexis is an associate producer."],["Why it matters","It's where Carl and Donut's public personas start, and where Odette becomes a major figure in their story."]]],["Danger Zone",[],2,12,13,"Danger Zone with Ripper Wonton, a round-table panel show mixing crawlers with galactic celebrities.","",[["Format","Crawlers sit at a real round table and the celebrities appear by hologram. Director: Evo. Host: Ripper Wonton."],["Panel","Manasa, Tucker, Princess D'nadia and others. It's where Donut goes on her \"Butler\" bit."]]],["Odette's show",["Odette show"],1,30,13,"How everyone refers to Dungeon Crawler After Hours, Odette's popular post-recap interview program.","",[["Timing","It airs after the hour-long main episode. Top crawlers like Lucia Mar get whisked onto it."]]],["Hobgoblin",["Hobgoblins"],1,17,9,"The bigger, nastier cousin of the goblin, and the source of the best goblin explosives.","",[["Their gear","Hobgoblin Pus (a C4-like remote explosive), hobgoblin dynamite, and the Hob-Lobber."],["As a race","Hobgoblin shows up among the race options when Carl has to choose a race."]]],["Swamp Orc",["Swamp Orcs"],3,12,9,"An orc subrace. War Mage Dismember on the fourth floor is a Swamp Orc Flesher.","",[["Example","Dismember's minions are tiny, flapping, hairy things that \"want to give you a hug.\""]]],["Fathom Dwarf",["Fathom Dwarves"],2,20,9,"A dwarf subrace on the third floor. The chaotic family of Eunice, Ricky Joe and their many siblings belongs to it.","",[["Example","Eunice, a level 30 Fathom Dwarf mother who doesn't take any nonsense."]]],["Dirigible Gnome",["Dirigible Gnomes"],3,34,9,"Militarized gnomes who rule the skies of the fifth floor from airship dreadnoughts.","",[["What they are","One side of the three-way stalemate around the Necropolis of Anser, with the Dromedarians and Bactrians. They bombed the camels in the past."],["Technology","FarSeerer bomb sights, Drop Bear planes, balloons like the Vahana, and the dreadnought Wasteland."],["Notable gnomes","Commandant Kane, Leon the Commissar, Wynne."]]],["Wall Monitor",["Wall Monitors"],3,26,3,"Lizard creatures on the Iron Tangle. Carl kills so many that the whole species is wiped out on the floor.","",[["What happens","Wiping them out earns Carl a Platinum Asshole's Box and the Extinction Sigil tattoo."],["Consequence","Lizard-class mobs deal 20% more damage to him from then on."]]],["Shock Chomper",["Shock Chompers"],3,4,3,"Level 20 train-car monsters on the fourth floor, described as \"lesser nagas with mommy issues.\"","",[["In action","They arrive on every train, along with Bonkers. Carl and Donut camp the platform and kill them as the doors open."]]],["Bonker",["Bonkers"],3,4,3,"The crawlers' nickname for the Cave Mudge Bonker: a pig-bodied brute with a nail-studded club.","",[["What it is","About as low in Cave Mudge society as a common laborer. They pour off the fourth floor's trains with the Shock Chompers."]]],["Krakaren",["Krakarens"],1,32,9,"A collective-mind organism. Krakaren Prime spawns two clones for every one killed, and they run the Rev-Up multilevel-marketing scheme.","",[["First floor","Krakaren and her \"downline consultants\" run a pyramid scheme (\"It's not a pyramid!\"). Krakaren Clone is a level 10 neighborhood boss."],["Iron Tangle","They reappear as drug producers in the fourth floor's allegory."],["The bigger picture","The Apothecary is the better translation of the name. The galaxy fears its spread."]]],["Brindled Vespa",["Brindled Vespas"],1,42,3,"Huge, spitting hornets that swarm a hallway in seconds. The Maestro sets them on Li Jun's group.","",[["In action","They spit globs of white goo at anything in range. They don't care whose side anyone is on."]]],["Bomb Chicken",[],1,40,3,"Donut and Imani's preferred name for Carl's giant mobile bomb on the first floor. Carl had already spray-painted a different name on it.","",[["What happened","Carl builds a massive improvised bomb and spray-paints a name on it. Everyone else thinks \"Bomb Chicken\" fits better."]]],["Tummy Acher",["Tummy-Acher"],1,46,3,"A friendly little meatball creature with legs and a mohawk. Odette says Carl should've picked it as his pet.","",[["Context","One of the pitiful pet options at the end of the first floor. Odette says they're friendly and easy to care for."]]],["Scree",[],3,32,1,"Parasitic worm-like aliens better known as Infiltrators. Distant cousins of the Valtay, they take over a host body completely.","",[["How they work","Unlike Valtay, who keep bodies alive with a secretion, Scree fully take over their hosts, wearing a body like clothes."],["Book 4","At the end of the fifth floor, Mongo crunches a Scree worm, ending the saga of Frank Q and Maggie My."]]],["Jaxbrin",[],3,29,1,"Jaxbrin Amusements, Ltd., the toy company that makes the stuffed \"babies\" Louis summons. Later his sponsor.","",[["What it is","Its plush summons (like Grulke Infantry) fight for Louis for a short time."],["Why it matters","Louis is relieved when they sponsor him, hoping they'll restock his supply."]]],["Fannar",[],3,13,1,"Eva's ex, who left her for one of his students. Eva brings it up to mock Katia.","",[["Context","Katia mentions him as someone who called her useless. Eva uses the history to needle her."]]],["Allister",["Crawler Allister"],3,13,0,"A 13th-edition Cookbook contributor whose notes deal with inventory rules and third-party access.","",[["In the Cookbook","Notes that the 15-second wait for removing inventory items was removed, and warns about letting others into your inventory."]]],["Cleiton",[],5,70,0,"A human crawler who opens the talent show at the Butcher's Masquerade with comedy from his homeland.","",[["Context","The first act announced on stage. Donut is thrilled to hear she's going on last."]]],["Liana",[],2,6,7,"The Liana Sector of the Hunting Grounds, the High Elf realm once ruled by King Finian.","",[]],["Sheol",[],2,24,7,"The mysterious 15th floor of the World Dungeon, whose fires forge rare glass and breed hotter demons.","",[["In items","The Sheol Glass Reaper Case is forged there. Combined with an overloaded soul crystal, it makes a city-leveling bomb."],["Demons","The rarer Sheol fire demons are brought in when a fire has to burn extra hot."]]],["Mukta",[],1,41,0,"The kua-tin Administrator who sends Carl and Donut to Prince Maestro's show and orders Carl to sit down.","",[["Role","A dungeon Admin who messages crawlers directly about transfers. She warns of \"consequences\" when Carl resists."]]],["Glurp",[],1,42,1,"\"Glurp, glurp!\" The bloodthirsty chant of Prince Maestro's studio audience.","",[["Context","The crowd screams it whenever something dies on screen. It sums up the show's tone."]]],["Yvette",[],1,43,0,"Frank Q and Maggie My's teenage daughter. She never took part in their killings.","",[["Her story","Frank and Maggie posed as a married couple and ambushed the crawlers who trusted them. Footage shows Yvette in some of those scenes, but never killing anyone."],["Why it matters","Donut is struck by her name, and by the fact that she didn't want to hurt people."]]],["Gideon",[],4,34,1,"A crawler who's very active in the general chat. He reaches out to Carl and Donut at the end of the fifth floor.","",[["Context","Donut greets him enthusiastically (\"OMG HI GIDEON!\")."]]],["Tran",[],1,47,0,"A tired-looking level 28 human Swashbuckler in Gwen's group, with a metal-detecting ability.","",[["Role","He scouts for hidden metal for Gwen's team. Gwen relays that his reports confirm Carl's hunch about an electric line."],["Big moment","He's one of the crawlers trapped in the sub during the Lusca fight, alongside Vadim."]]],["Skarn",[],4,2,1,"A level 3 juvenile changeling orphan in Hump Town, looked after by the patrol camel Flint.","",[["His story","His village was bombed by the gnomes. He survived and the dromedarians took him in. He watches the desert patrol through a telescope and dreams of joining it."],["In the shapeshifting","He's still clumsy at changing shape, with features lumping together awkwardly."]]],["Flint",[],4,2,1,"A dromedarian desert-patrol camel who took in the orphan Skarn.","",[["Who he is","Out on patrol until after dark. He tells Skarn that gnomes are bomb-dropping cowards and anyone who uses bombs is a coward too, which is awkward for Carl."]]],["Bogdon Ro",["Bogdon"],4,4,0,"A human Legatus who sits in the lower half of the top-ten leaderboard through the fifth floor.","",[["On the board","Climbs from level 31 to 44 over the fifth floor."]]],["Gravo",[],4,18,1,"A dour Forsoothed (soother) co-host of the Veriluxx New Toys Showcase, who's forced to perform a cowboy persona.","",[["Role","Co-hosts with Liddi. Carl describes him as a zero-personality tax accountant made to perform for children (\"Yeehaw!\")."]]],["Tish",[],4,21,1,"Ghazi's wife, the one he left behind. Her furious goodbye note is found at the shrine.","",[["Her note","She was there the whole time but \"wasn't enough,\" and she hopes Ghazi does the right thing."],["Why it matters","Her note explains Ghazi's sad, obsessive spiral over Lika."]]],["Twister",["Tiddy Twister"],4,5,10,"The Tiddy Twister, Louis's pimped-out convertible van. It comes with him into the dungeon.","",[["Its story","His mom's Chevy Astro, which he and his friend Jojo turned into a convertible. Its picture got about 100,000 Instagram likes."],["On the fifth floor","The team sends people to protect it during the storm, and Louis worries about it constantly."]]],["Mexx-55",["Mexx"],1,41,13,"The robotic disk that runs the rented production trailer and guides crawlers onto Prince Maestro's show.","",[["Role","A floating, soft-voiced AI from Senegal Production Systems, Unlimited. Its voice changes when a different controller takes over."],["Later","A deluxe model, Mexx-6000, runs the higher-end trailers."]]],["Death Challenge",[],3,33,12,"A pop-up gambling event, not a boss battle, where viewers in systems that allow it bet on whether a crawler survives a fight.","",[["How it works","The system announces it with Carl's face and bloody \"Death Challenge!\" lettering. Odette explains it on air."],["Carl's first","His on the fourth floor ends with a building-sized monster split in half, and another viral clip."]]],["Elite",["Elites"],1,32,12,"A special tier of monster or NPC, tougher than normal and often tied to a show's quest line.","",[["How it works","Shown as \"This is an Elite\" in a description. Elites can also be bosses, like Grimaldi, an elite City Boss."]]],["City Boss",[],2,10,12,"A big boss tier above borough bosses. On the early floors they guard stairwells and city-scale areas.","",[["Examples","Ringmaster Grimaldi (level 85, elite) and Lusca, the Octo-Shark Brood Mother Queen (level 82)."]]],["Province Boss",[],4,2,12,"A boss tier above city bosses. Attacking one is dangerous and earns special recognition.","",[["Context","Donut got a \"Platinum That Wasn't Too Smart, Was It? Box\" for attacking one on the fifth floor."]]],["Country Boss",[],2,7,12,"Behemoth-class bosses. Mordecai's example is a Divine Guardian on the 12th floor, guarding a fire gate to the 13th.","",[["Why it matters","It's a reminder of how far down the dungeon goes, and how big the threats get."]]],["Admin",["Admins","Dungeon Admin"],1,35,12,"Dungeon Administrators: kua-tin staff whose power over crawlers is absolute. You can't even draw a weapon around them.","",[["Rules","Any violence against an Admin means immediate execution. Weapons are disabled in their presence."],["Known Admins","Zev (low-level but able to end you) and Mukta."]]],["System AI",["the AI"],1,8,12,"The unnamed intelligence that runs the dungeon's messages, loot and achievements, with a very particular sense of humor.","",[["Personality","Snarky, crude and theatrical. It has an obvious foot obsession and uses its \"sexy voice\" for certain achievements."],["How it behaves","It hands out loot to make the show more entertaining. Keeping you alive is good for ratings, until screwing you over is better."]]],["Quest Box",["Quest Boxes"],2,4,12,"A reward box for completing quests, in gold or platinum depending on the quest.","",[["First one","Carl's first quest, ending the circus's \"reign of terror\" on the third floor, paid a Gold Quest Box."],["Platinum","A Platinum Quest Box gave him 5,000 gold and a rare Scroll of Upgrade."]]],["Earth Class",[],2,1,12,"Classes made from Earth's own culture and professions, offered to human crawlers with a Silver Earth Box as an incentive.","",[["How it works","Shown under their own heading when picking a class. Carl's Compensated Anarchist is one."],["Incentive","Choosing an Earth Class awards a Silver Earth Box."]]],["Fan Box",["Fan Boxes"],2,13,12,"A reward box whose contents are voted on by viewers. You get them for being popular, or for being a spectacular mess.","",[["How it works","The first comes with an admin note explaining the voting. Higher tiers come from follower milestones and crowd-pleasing moments."],["Example","Carl got a Silver Fan Box for the most \"switchovers\" in a battle."]]],["Guildhall",["Guild Hall"],1,3,12,"Training halls where a guildmaster teaches crawlers the basics. Safe zones, but the floor timer keeps running.","",[["First one","The Tutorial Guild Hall, where Carl and Donut meet Mordecai."],["Rules","Once you've been trained, entering another training guild on that floor can be risky, as Mordecai warns."]]],["Strength",[],1,4,12,"The stat for physical power: melee damage and carrying capacity.","",[["Carl's start","Strength 6 (Donut started at 11)."],["Boosts","The Toe Ring of the Splatter Skunk and the Grull gauntlet (fist mode only) raise it."]]],["Constitution",[],1,4,12,"The stat for toughness: health and resilience.","",[["Carl's start","Constitution 5. Donut started at only 2."],["Boosts","The Nightgaunt Cloak gives +4. Rings of constitution helped Carl reach 12 early on."]]],["Dexterity",[],1,4,12,"The stat for agility, precision and evasion.","",[["Carl's start","Dexterity 5. Donut started at 8."],["Boosts","Donut's Fae Scale crupper, the Grull gauntlet and the Talon Strike gem."]]],["Intelligence",[],1,4,12,"The stat for magic, mana and mental ability. Carl's starting 3 was famously low.","",[["Mordecai's line","Intelligence tells you a bike belongs to a police officer. Wisdom tells you not to pee on it."]]],["Charisma",[],1,4,12,"The stat for presence, persuasion and how audiences and NPCs react to you. Donut's specialty.","",[["Starting gap","Carl had 4. Donut had 25."],["Quirks","Charisma doesn't work on everyone. Half-Djinns are immune to its bargaining effects."]]],["Mana",[],1,5,12,"The resource spells cost. Carl's tiny early mana pool limits him to a cast or two.","",[["In practice","Wisp Armor costs 5 mana, Fear costs 3. Mana potions refill it."]]],["You've discovered and read an official dungeon sign",[],1,2,14,"For reading your first official dungeon sign.","",[]],["You've killed an armed mob with your bare hands",[],1,5,14,"For killing an armed monster with nothing but your fists.","",[]],["You found stairs",[],1,30,14,"For finding a stairwell down to the next floor.","",[]],["You call that a trap?",[],1,41,14,"For injuring a monster with something you deliberately left lying around. Your first trap.","",[]],["You Can't Fight City Hall!",[],2,10,14,"For discovering a city boss. At that point in the season, no crawler had faced one and lived.","",[]],["The early bird gets to squirm",[],3,2,14,"For going down the stairs more than six hours before the floor collapses.","",[]],["Welcome to the neighborhood!",[],3,2,14,"For buying a home.","",[]],["The Quarry Sees Another Spring",[],4,1,14,"For entering a stairwell while in the top 10. You're a survivor, and a more valuable target.","",[]],["You Crossed a Line You Didn't Even Know Was There",[],5,6,14,"For using an artifact of Divine Suffering for the first time.","",[]],["The Hand that Claws the Master",[],5,6,14,"For permanently killing a non-crawler, someone who doesn't respawn. Carl gets a stack of them at once.","",[]],["Sister Ines Quiteria",["Sister Ines","Ines","The Reaper of Havana"],6,5,0,"A soft-spoken Cuban nun who came into the dungeon as a Cat Girl with the Poet Laureate class. She travels with Paz and Anton, two cousins who are fiercely protective of her.","Crawler #8,199,462 · Cat Girl Poet Laureate · level 47",[["First impression","Her Havana brown cat look gets Donut's back up the moment they meet, and her habit of reciting religious verse doesn't help."],["Her group","Ren says the trio once had a bigger party that took a beating on the sixth floor. Word is Anton had to kill two of their own people early on, after those two tried to kill the nun.",5],["Since then","Her grief and her faith both harden after Havana's shrine fight. Carl starts to worry about what she is turning into.",17],["The Reaper of Havana","As the floor wears on she becomes a major threat in her own right, and her title starts showing up next to her name.",55]]],["Paz Lo",["Paz"],6,5,0,"An armored Santero, a kind of warrior cleric, who worships the god Ogun. He is cheerful and steady, quick to laugh, and Anton's cousin.","Crawler #8,199,454 · Human Santero · level 45",[["Class","Santeros draw on the Orishas. His presence stirs up restless spirits, and that comes into play in the ghommid town."],["Known quirk","Ren mentions that Paz has a spell that kills him if he casts it, a little like Carl's famous bomb."],["What happens to him","After the shrine fight, Sister Ines turns Paz into a card with her team flag rather than lose him.",16],["Return","He comes back changed, as the God Predator, a former crawler whose level and title now mark him as something new.",72]]],["Anton Lopez",["Anton"],6,5,0,"A prison-tattooed crossbowman with the Fugitive class. He is quiet and suspicious of strangers, and he guards Sister Ines like a bodyguard.","Crawler #8,199,451 · Human Fugitive · level 47",[["Reputation","He's known as a crack shot with his crossbow. Rumor says he killed two of his own party early in the crawl to protect the nun."],["The shrine","He's the one who picks up the metal piece in Ogun's shrine, and the god's punishment follows.",15],["Fate","Ogun smites him. His death weighs on Carl for days afterward.",16]]],["Khulan",[],6,57,0,"A crawler on Ren's squad, married to Chuluuna. She is the third member of their group at the capitol stairwell.","",[["At the end","She is the only member of Ren's squad left standing. She collapses over her husband's body.",58]]],["Osvaldo",[],6,5,0,"A Brazilian crawler who owns a pet called Gimli. He makes the top-ten list for the first time on the eighth floor.","Top ten (first appearance)",[["Friends","Paz's group is close to Osvaldo's, though they aren't in the same guild."],["Bad blood","He, Burcu and Prepotente got into a fight after Imogen died at the end of the previous floor.",8]]],["Rezan",[],6,61,0,"A sharp-tongued crawler in the Cuba chat. He reports how demon portals are killing people near his stairwell.","",[]],["Mandla",[],6,61,0,"A crawler in the Cuba chat who works out how the demon portals kill. His answer is to fight them naked.","",[]],["Robert the Human",[],6,37,0,"An opposing deckmaster Donut faces alone in the phase-two choosing arena. He wears a sailor hat.","",[["What's left","Donut keeps his sailor hat. It shortens her card-draw countdown.",38]]],["Chuluuna",[],6,57,0,"A member of Ren's squad. He has a strength-based class that lets him turn his skin to stone, and he can cast Chain Lightning.","",[]],["Burcu",[],6,8,0,"A crawler who joins the top-ten list at number ten on the eighth floor.","Top ten",[["History","She, Osvaldo and Prepotente had a falling-out after Imogen died at the end of the previous floor."]]],["Zeynep",[],6,32,0,"A level-52 crawler with the class Boring Ol' Mage, out dancing in the Desperado Club on a dangerous night. She apologizes for her drunk, jealous friend.","Boring Ol' Mage · level 52",[]],["Garret",[],6,58,5,"Ren's pet, a huge Tummy Acher. It is even bigger than the stone-skinned Chuluuna.","Tummy Acher",[]],["Rosetta",["Rosetta Thagra","Crawler Rosetta"],6,12,1,"Rosetta Thagra survived an earlier crawl and wrote in the ninth edition of the Cookbook, mostly explosives recipes. She now hosts a talk show, and she calls people \"comrade.\"","Cookbook, 9th Edition",[["On air","Her interview with Carl goes after his past, and his mother in particular."],["In the Cookbook","Her notes are blunt and full of practical violence. Several warn about fairies and sprites.",31]]],["Armita",[],6,0,1,"Odette's friend and old party member. She now works as a demigod attendant in the Celestial Ascendency, and in the prologue the deal with Huanxin is her idea.","",[]],["Uzzi",[],6,0,1,"Mordecai's brother and a member of Odette's old party during her own crawl, seen in the prologue.","",[["The prologue","He takes the hardest path through the final puzzle, and the price is terrible."]]],["Hold Steady",[],6,0,1,"A bird-like member of Odette's old crawl party. In the prologue he keeps a floating puzzle charged with magic.","",[]],["Huanxin Jinx",["Huanxin"],6,0,13,"A rich grixist heiress who sponsors the storm goddess Dodola every season. She is petty, she knows exactly how much leverage she has, and she wants a big cut.","Grixist · CEO of Icon Industries",[["Old history","Her bargain with Odette's crawl party goes bad in the prologue. She, Odette and Mordecai are still tangled up in it."],["This floor","She sponsors Eileithyia, which puts her right in the middle of Katia's problem.",17]]],["Harbinger",[],6,12,13,"A devil-goat caprid who lurks off-camera during Carl's interviews and speaks in a demon language. Carl knows him as one of his sponsors' people.","Caprid",[]],["Baroness Victory",[],6,36,13,"A stone-faced legal figure, formerly of the Skull Empire, offered to Carl as his Faction Wars adjutant. She's related to Queen Ugloo, and she says she can still be impartial.","Esquire",[["Why she's picked","Her rivals sued to keep her out of the game, and that sells Quasar on her. Carl chooses her."]]],["Pater Coal",[],6,18,1,"The Hobbledehoy high cleric in charge of the Emberus shrines in Club Vanquisher. He is one of the few mortals in constant contact with the god. He is calm and fussy, and he performs a mortifying welcome custom on new worshippers.","Hobbledehoy High Cleric Supreme of Emberus · level 101",[["Later","He brokers expensive church services for Carl and offers to front him a very large loan.",56]]],["Potsy",[],6,18,1,"One of about twenty ram-headed Ares warrior-cleric brothers who guard the Club Vanquisher door. They worship Hellik, so they hate Carl on sight.","Ares Warrior Cleric Middle Priest · level 40",[["The window","The brothers pray to a stained-glass door they believe shows Hellik. Everyone else, its maker included, knows it shows Taranis."]]],["Yasmine",[],6,52,1,"A wisp who works as secretary of the Club Vanquisher temple portal. She worships Áine.","Wisp · level 75",[]],["Damascus Steel",["Damascus"],6,5,1,"A Desperado Club stripper Donut adores. She told him he is \"Mongo's new daddy.\" He's an ifrit and the Penis Parade's assistant lead dancer.","Ifrit · level 75",[["The tattoo","He has the same spiderweb tattoo on his elbow that Carl has, and he leads Carl somewhere hidden.",23]]],["Anaconda",[],6,5,1,"One of Donut's stripper friends from the Desperado Club. He once told her he'd only ever met cat girls, never a real cat.","",[]],["Dong Quixote",[],6,6,1,"An older Penis Parade dancer with a booming Spanish voice and a weakness for dramatic lines.","",[]],["Author Steve Rowland",[],6,6,1,"A troll stripper at the Penis Parade with one of the strangest names in the club. Samantha takes a liking to him.","Troll",[]],["Gluteus Maxx",[],6,6,1,"A short, hairy muscleman dancer at the Penis Palace. He is a bit of a jerk, a good dancer, and a little in love with Donut.","",[["Fighting style","He punches things wearing twin war gauntlets.",52]]],["Doctor Bones",[],6,34,1,"The Desperado Club's skeletal announcer and DJ, not a stripper. Donut thinks he's the best DJ since DJ Diesel.","",[["Useful","He has several crowd-control spells, and a better version of Carl's slug spell.",52]]],["Charles",[],6,31,1,"The badger who tends bar on the Desperado Club's middle floor. Samantha decides he could be her backup soulmate.","Badger bartender",[]],["Minge",[],6,32,4,"A huge feral demon unleashed inside the Desperado Club. She has a long, ugly grudge against Samantha.","Minor Feral Demon · level 225",[]],["Night Wyrm",[],6,19,1,"A hissing, Samantha-like demigod who heads the \"family with many eyes\" and hands out deadly tasks through the Lock Box that bears its name.","Demigod",[["The family","It talks in a sing-song voice about sacrificing the weak for the good of the many. Its jobs run through the Guild of Suffering.",23]]],["Rosemarie",[],6,23,1,"A rowdy dwarf regular at the Desperado Club's male revues. She once got in trouble for pelting a troll dancer in the eye with a coin, and she hands out \"Certified pole dancer\" buttons.","Dwarf",[["Day job","She manages the top-floor Meat Shields location.",34]]],["MaeMae",[],6,26,1,"The nickname Shi Maria prefers. Samantha uses it when she talks about her \"new best friend.\"","",[]],["Ruby",[],6,20,1,"A little changeling orphan Carl and Donut met during the fifth-floor camel and changeling storyline. She has compression sickness, a birth defect, so whatever shape she takes is missing pieces.","Changeling",[["Now","Mordecai has quietly been looking after Ruby and the other vulnerable changelings kept out of the castle fight. He'd kept it hidden from Carl and Donut."]]],["Epitome Tagg",["Tagg"],6,21,13,"A Faction Wars warlord who leads the Dream. He keeps his composure until his mother's face turns up somewhere it shouldn't be.","Warlord, the Dream",[]],["Luke",[],6,21,13,"A small, goblin-like alien from the Lemig Sortion who sounds like a surfer dude. He's sure everyone in the Faction Wars meeting is doomed.","Lemig Sortion",[]],["Epitome Noflex",[],6,21,13,"Epitome Tagg's mother, or at least someone wearing her face at the Faction Wars meeting.","",[]],["Mudskipper Cascadia",["Cascadia"],6,1,13,"Borant's executive producer for Dungeon Crawler World: Earth. She gives the floor announcements.","Executive producer",[["Under pressure","The seventh floor was her baby. After it was ruined, she's left juggling crisis after crisis.",21],["The card game","An achievement describes her as the recently divorced lead engineer behind the floor's carefully built card fights.",40]]],["Prime Minister Glory",["Glory","His Glory"],6,8,13,"A gleener who is the boss of the entire Syndicate. Mordecai says it's very unusual for him to show up on the recap show.","Gleener · head of the Syndicate",[]],["Kevin (announcer)",["Kevin the announcer"],6,8,13,"The orange-hued, four-eyed lizard who announces the recap episodes and later covers fights live from Earth orbit.","",[]],["Paulie",["Goff"],6,51,1,"A memory from a homeless shelter. He goes by Paulie, but his real name is Goff, and he's a Residual. He gives the same rehearsed warning every day in the hope that a crawler hears it.","Residual",[["What he is","He carries the memories of a real man named Paulie. Orren later says the voice behind him is part of a collective mind whose individual pieces are disposable.",51]]],["Judge Lucian",["Lucian"],6,46,1,"A cat show judge from Donut's past, turned into one of the heads of a monstrous hydra and acting as its leader.","",[]],["Tami-Lynn",[],6,46,1,"Carl's young stepmother, his father's second wife. She has a pit bull tattoo on her neck.","",[["The memory","The floor makes Carl watch an old memory of her in his father's trailer, and he learns what she did."],["The hydra","She is one of the hydra's heads, and she shows no regret."]]],["Asher",["Ash"],6,45,1,"Carl's half-brother, his father's young son with Tami-Lynn. Carl never knew him.","",[["What Carl keeps","Carl takes Asher's crayon drawings of airplanes and storm clouds and hangs one in his bare room.",49],["Why it matters","By the end of the floor, Carl has decided he will make Asher's death mean something.",72]]],["Walter",[],6,32,1,"A level-101 Sai who guards the Larracos level of the Desperado Club. The Sai used to be firefighters and became the club's reliable, not very bright, loyal guards.","Sai guard · level 101",[]],["Monk Seals",["Monk Seal","Monk Seal Picket Sentry"],6,5,3,"Caribbean seals that are also, literally, monks. They practice Caribbean Kung Fu, worship fighting and guard the coast from their sworn enemies, the land crabs.","Picket Sentries ~ level 70",[["The war","Each season the land crabs spawn in the ocean, which the seals consider holy. This is the Chowder War.",6],["As cards","Collected seals make strong totems. They yell kung-fu noises and do little flips.",7],["Later","With Sister Ines's warning, the seals stop the crabs' sneak attack, and the fight turns into a brutal war of attrition.",54]]],["Red Maníseros Land Crabs",["Land Crabs","land crabs"],6,6,3,"Forest crabs that must spawn in the sea each year, which makes them enemies of the monk seals. They fight with the art of Juego de maní.","",[["The plan","They mass on the island's southern border and plan to circle around and overwhelm the seals at sea.",24]]],["Ghommids",["Ghommid"],6,10,9,"A catch-all name for creatures that visit this world from the land of the dead. They come in endless one-off varieties: harmless, cute, angry or diarrhea-inducing. They settle where the veil is thin, such as cemeteries.","",[["The settlement","A spirit turned one ghommid town into a horde of ravenous undead.",10],["Once cured","Back to normal, they're jovial, and the town turns into a cartoonish little place full of shops.",17]]],["Pox Slugs",["Pox Slug","slugpox","SlugPox"],6,15,3,"Small, drunk, angry slugs, likened to Juggalos, that burst out of a slugpox infection. Each new one is a level higher than the last.","Starts at level 1",[["Slugpox","It's an old, nasty spell. A healer can fix it, if you can find the right one.",17]]],["Duendes",["duende"],6,7,3,"Common level-20 goblins in rags, about a foot tall, that hoard shoes. They swarm wherever they find footwear.","Level 20",[]],["Memory ghosts",["memory ghost"],6,4,12,"The eighth floor's see-through people: recordings of real Earth residents going about a normal day. They can't see crawlers. When a ghost's car crashes, its clothes stay behind.","",[["The point","The whole floor is built from recorded memories, and the show uses that to put crawlers face to face with people from their own lives.",38]]],["Squonk",[],6,9,3,"A pitiful legendary creature from the Eastern United States. It's so ugly and miserable that it cries constantly and dissolves into water on its own.","Level 35",[]],["Carbunclo",[],6,10,3,"A small fox-like creature with a gem in its head. Paz's squad fights one in the mock battle arena, and it wets itself and teleports away.","",[]],["Vorpals",["vorpal"],6,32,3,"Celestial foot soldiers kept sealed behind a hidden Desperado Club door as a last resort. Mordecai says vorpal is a condition, not a species: creatures deputized by the gods, which are drawn to demons and grow more violent near them.","",[]],["Zombie Turkeys",["Zombie Turkey","zombie turkeys"],6,42,3,"Level-10 undead turkeys from an Iowa turkey barn. Their description warns that zombie movie rules apply.","Level 10",[]],["Sharp-Elbows",["Sharp Elbows"],6,42,4,"Deckmaster number nine of ten, an ogre necromancer. The AI keeps her description deliberately short out of spite.","Level 80",[]],["Evicted demons",["evicted demon","Demon Eviction"],6,54,3,"Demons forced out of Sheol by a Demon Eviction event, possessing fresh corpses and the weakened. To go home, each must drag another soul down with it.","",[["Handle with care","The Cookbook warns that this isn't ordinary possession. The shell is destroyed the moment the demon moves in. Never teleport a possessed shell away from you.",55]]],["Pleasure demons",["pleasure demon"],6,60,3,"Huge level-140 demons out of Sheol. Their ranged attack opens a one-minute portal marked as the entrance to the fifteenth floor, and it pulls in anything nearby.","Level 140",[]],["Easter Bunny",[],6,8,3,"In a mostly redacted recap episode, an undead Easter Bunny tears crawlers apart and stuffs the pieces into plastic eggs.","",[]],["Sasquatch",["squatch","bigfoot","squatchy"],6,4,3,"A bigfoot in Bermuda shorts that Elle spots crossing a road early on the eighth floor. Elle builds a whole \"squatch squad\" of totems after that.","",[]],["Nykur",[],6,4,3,"An Icelandic water horse, normally gray. The one Katia sees is pink for no clear reason, and it gets hit by a memory car right outside her saferoom.","",[]],["Gumberoo",[],6,22,3,"A huge bear-hippo cryptid. Elle collects one for her squad.","",[]],["Asojano",["Lord of Smallpox"],6,11,4,"An Orisha called the Lord of Smallpox. He used to be a god, and he faded once his worshippers died out. He is disease incarnate who kills and heals in equal measure, and his reed hat makes him bump into things.","Level 130 City Boss · non-corporeal spirit",[["Why he's here","He came to the ghommid town only to look at the world he used to rule. Even so, his leftover power poisoned the place."],["Talks only through a priest","He insists that mortals speak to him through a priest, so Paz has to do the talking."],["As a card","He later becomes one of Donut's six totems. He's powerful and very slow to follow orders.",22]]],["The Bedlam Bride",["Bedlam Bride","The Screamer","The Widow Endless"],6,8,4,"One of Shi Maria's many names. The others include the Screamer, the Reviled and Kwaku's Love. Donut thinks this one is the only name with any style.","",[["What she is","A Reaper Spider Minion and a demigod, level 140. Reaper Spiders have celestial blood and are usually found on the fifteenth floor. Away from there, they often work as traveling merchants.",26],["The quest","An escort quest to take her to the city of Larracos.",26]]],["Shi Maria",["Shi-Maria","MaeMae"],6,8,15,"A gigantic spider demigod with a woman's face. Her special attacks include permanent insanity and permanent blindness. A lore book lists her under twenty-odd names.","Reaper Spider Minion · level 140",[["Samantha's friend","She swallowed Samantha's head, and the two became fast friends. Samantha calls her MaeMae.",26],["Her story","She says she's looking for her husband and swears she didn't kill him.",26],["As a card","Carl wounds her just enough for Donut to turn her into a totem. She's lethal, and she enjoys violence a little too much.",27],["Carl's warning","Never trust her. She is always plotting.",27]]],["Der Schachmeister",[],6,29,4,"A level-25 deckmaster in the mock arena's challenge tier. He fights by debuffing and disabling, and he has no regard for his own safety.","20-card deck",[]],["Der Kornwolf",[],6,29,3,"A level-100 wolf totem that Der Schachmeister summons.","Level 100",[]],["The Visitor",[],6,41,4,"Deckmaster seven of ten, a Nightgaunt. In 1903 a Nullian brought one to Earth illegally, it escaped, and it was shot dead in rural Iowa, which made it an urban legend.","Level 70",[["Cloak trouble","Carl's nightgaunt-skin cloak makes it furious."]]],["Reminiscence Hydra of Malicious Compliance",["the hydra"],6,46,4,"A nine-headed boss built from people out of Carl and Donut's pasts and made especially for the Royal Court of Princess Donut. It's based on a very old Dungeon Crawler World design once called the Scolopendra Nymph.","Level 125 City Boss",[]],["Madre de Aguas",[],6,55,4,"The \"Mother of Waters\": a giant boa from Cuban legend that protects the island's fresh water and can command the local creatures. A nun had been controlling her.","Level 125 City Boss",[["Unleashed","Freed from the charm, she's furious, and a zombie fish has bitten her."],["After that","The zombie curse takes her, and something far worse moves into her body.",58]]],["Amayon",[],6,58,4,"One of the four princes of Sheol. He slips into the realm through the zombified body of the Madre de Aguas and sits on a rooftop pouring hellfire into the sky.","Demon Prince of Sheol",[["Quest link","Apito's quest gives Carl a rare chance to question him about who killed her son, Geyrun."]]],["Rude-Dolph the Blood-Nosed Slay-Deer",["Rude-Dolph"],6,28,3,"A legendary Eastern United States reindeer that works as a puppet master. He can't be touched until all eight of his puppet reindeer are dead, and he fires a laser from his nose.","Level 100",[]],["Mushika",[],6,29,3,"A giant rat from Indian mythology. It's the opponent in Donut's first win at challenge difficulty, and it dies very quickly.","Level 50",[]],["Raul",[],6,24,15,"A land crab warrior of the Sun-Kissed Cloud Rank who meditates nonstop to break through to the heavenly rank. He chants self-help mantras and swears he will never kowtow.","Red Maníseros Land Crab · level 70",[["Stats","High Intelligence, middling Dexterity and Strength, but a claw that crushes at three times his Strength. His Chi Cultivator spell could triple his power for good.",25],["On the team","He's a totem who fights with Geraldo, and his ascension is never far from his mind.",28]]],["Geraldo",[],6,6,15,"A level-70 monk seal and Carl and Donut's first squad member. He is loud, full of kung fu noises, and usually unimpressed.","Monk Seal Picket Sentry · level 70",[]],["Yago",[],6,6,15,"The first monk seal Carl's group runs into on the beach. He ends up as Sister Ines's squad's totem.","Monk Seal Picket Sentry · level 70",[]],["Skylar Spinach",[],6,14,15,"A screeching totem that is two-thirds of an Enraged Ghommid Splitter. Each fatal hit splits it in two, and each new primary half is tougher.","Level 66 · Constitution 90 · 60-second summon",[]],["Uzi Jesus",["Heyzoos","HeyZoos"],6,22,15,"An undead totem from Ecuador with a ranged attack and healing, also called Heyzoos. His catchphrase is a profane twist on \"I am the way.\"","Level 140 · Constitution 200 · 75-second summon",[["Attitude","He's powerful, but he barely listens, so he's tricky to rely on.",29]]],["Jola",[],6,34,15,"A mythical Icelandic creature that joins Donut's deck. Donut says he's great as long as no children are around.","",[]],["Lazarus-A-Bang-Bang",["Lazarus A-Bang-Bang","Lazarus"],6,39,15,"A unique totem created through a Combo and frozen in place with a Glow-Up. He's a ranged healer who deals afflictions, his reveal is outrageously over the top, and he greets everyone with \"I'm back, bitches!\"","Unique · 200-second summon · Constitution 80",[]],["Alpha Carl",["Alpha Male Carl"],6,46,15,"A totem version of Carl from the hydra fight: slicked-back hair, finger guns and swagger. Carl hates him.","Level 69",[["Stuck with him","He adds himself to Donut's cards on his own, and she can't tear him out until she gets another card.",47]]],["King Croissant",["King Croissant, the Younger, Better, and Smarter Cat"],6,46,15,"A kitten totem from the hydra fight, described as the cat Bea and Carl had really wanted. He sings in a booming baritone.","Level 60",[]],["Leveled-Up Frank",[],6,47,15,"A totem version of Frank Q that comes out of the hydra fight and attaches itself to Donut's cards.","",[["Later","A sober, level-100 Night Elf Blood Assassin version of him turns up in a big card battle.",67]]],["Zhe",[],6,67,15,"A totem of Li Jun and Li Na's cousin. She's a vicious fighter who tears out hearts.","",[]],["Xing Tian",[],6,67,15,"Li Na's level-80 totem, a headless man from Chinese myth.","Level 80",[]],["Annie",["Útburður"],6,67,15,"Katia's level-80 Útburður totem, an Icelandic ghost.","Level 80",[]],["Dodola",[],6,0,6,"A storm goddess. Huanxin Jinx sponsors her every season, which means a rich player drives her body. In the prologue Mordecai tries to summon her.","",[]],["Adad",[],6,0,6,"A huge storm god run by the AI. He shows up alongside Dodola in the prologue and rains acid.","",[]],["Ogun",[],6,5,6,"Paz and Anton's god. Mordecai calls him a big, common god of blacksmiths and protection, and grumpy. His worshippers can't be charmed, and their weapons hit harder.","God of Blacksmithery and Armor",[["Shrine","He gives his worshippers a quest to repair his broken shrine.",14],["In person","He is the last survivor of an ancient pantheon and believes punishment should be delivered in person. The system rates him a strong contender for the celestial throne.",16]]],["Yemaya",[],6,15,6,"A river goddess and an old friend of Eileithyia. Once she ruled every body of water, and she was the queen of love and bringer of life. She was nearly forgotten, and her broken shrine is the key to Katia's plan.","Goddess of Rivers",[["Returned","Rebuilding the shrine lets her ascend again. She looks like the Starbucks mermaid, which Donut points out right away.",17]]],["Eileithyia",[],6,15,6,"A goddess of childbirth and female pain, and Yemaya's faithful friend. She offers boons to anyone who brings Yemaya back.","Goddess of Childbirth and Female Pain",[["Her buff","In her presence women hit five times harder, and damage dealt to women drops to a quarter.",17],["Sponsor","This season Huanxin Jinx sponsors her.",17]]],["Oshun",[],6,15,6,"A dazzling Orisha who looks like a ghost in a yellow dress made of light. Her charisma is so strong Carl feels it physically. Repairing her shrine would shield everyone from five fatal blows and boost their charisma.","",[]],["Ysalte",["The Vinegar Bitch","Vinegar Bitch","The Downward Spiral"],6,64,6,"A goddess of hopelessness and insanity, better known as the Vinegar Bitch. She sometimes shows up at the end of Faction Wars and kills every crawler near her. Mordecai's advice is simply to run.","Level 250",[["Sponsor","Mordecai remembers that the Nebular team has been sponsoring her lately.",64],["In the Cookbook","The Semeru dwarves of the ninth floor call her the Downward Spiral, a scheming earth-and-water trickster hated by gods and demons alike.",64],["Her touch","Near her, potions outside your inventory turn to vinegar. The earliest people of Larracos worshipped her, and she has a soft spot for outcasts.",66]]],["Semiramis",[],6,25,6,"A goddess who re-ascends partway through the floor. Her name comes up as one of a string of system messages about old gods being woken.","",[]],["Legba",["Papa Legba"],6,15,6,"An Orisha with a shrine in the ghommid temple. Fixing it gives a fifty percent chance to avoid future smites and teaches Confusing Fog.","",[]],["Áine",[],6,52,6,"The goddess the wisp secretary Yasmine worships.","",[]],["Orishas",["Orisha"],6,11,9,"Ancient gods who faded as their worshippers died out and their temples fell. They slipped past the veil and became little more than ghommids, able to visit the physical world only now and then.","",[["The temple","Their broken shrines stand in the ghommid temple. Repairing one can lift its Orisha back into the Halls.",15]]],["The Ghosts of Earth",["eighth floor"],6,1,7,"The eighth floor. Crawlers pick one of 293 recreated regions of Earth, filled with memory ghosts of the people who once lived there. Each region holds two stairwells, the floor runs in three phases, and the clock starts at 21 days.","Floor 8 · 21 days",[["Skipped floor","The crawl jumped straight here from the sixth floor. Mordecai says the AI is handing out better loot to make up for it."],["Phases","Phase one is hunting and collecting totems. Phase two sends squads to key fights. Phase three opens the stairwells, but only to key holders.",27]]],["El Capitolio Nacional de Cuba",["El Capitolio","the capitol building","El Capitol"],6,1,7,"Havana's historic capitol building, a marble-and-tile cousin of the US Capitol. Carl and Donut arrive here, and one of the region's two stairwells is inside.","",[["Traps","Carl rings the exit stairwell with alarm and teleport traps on the first day.",4]]],["Havana",[],6,1,7,"Cuba's capital and Carl and Donut's phase-one region, picked by Donut because it's near the Bahamas. The streets are full of memory ghosts and pileups of phantom cars.","",[]],["Old Havana",[],6,4,7,"The historic district Carl and Donut pass through on their way west toward Miramar.","",[]],["The Bahamas",["Bahamas"],6,1,7,"The region Prepotente picked. Donut deliberately avoided it, because the Bahamas lore book Carl got is a clue about where Bea was when the world ended.","",[]],["Mock Battle Arena",[],6,9,7,"A hangar-sized practice room for card battles. Fights at easy, medium or challenge difficulty cost gold, and generated mobs can't hurt you there, though the environment still can.","1,000 / 2,000 / 5,000 gold",[["Prices go up","Medium difficulty later costs 2,500 gold.",28]]],["Pueblo de los Olvidados",["ghommid settlement","ghommid village","Medium Ghommid Settlement"],6,10,7,"A ghommid settlement inside a Havana cemetery that's been corrupted into a town of ravenous undead. Its quest is compulsory, so nobody leaves until it's resolved.","",[["The cause","An Orisha's presence drives the residents mad. You can fix his shrine or kill him.",11],["Freed","It becomes a cheerful working town again, though still a graveyard, with shops where the tombs were.",17]]],["La Iglesia de los Olvidados",[],6,14,7,"The temple at the center of the ghommid town. It holds a ring of broken Orisha shrines.","",[]],["Penis Parade",["Penis Palace"],6,5,7,"The Desperado Club's male revue, and a favorite of Donut's. Its ranking rises the deeper the floor, and the middle floor has a sister club called the Penis Palace.","",[["Secret","The strip club is a front for something else.",19]]],["Guild of Suffering",[],6,19,8,"A secret assassins' guild run by the Night Wyrm's \"family with many eyes.\" Its entrance is hidden behind the Penis Parade.","",[["Way in","A spiderweb-carved door at the end of a hidden hallway, past a portal.",23]]],["Production Facility",[],6,21,7,"The show's production building on the ocean floor. Carl visited it for CrawlCon, and it hosts the Faction Wars warlords' meeting.","",[]],["Monroe County",["Monroe County, Florida"],6,38,7,"The Florida Keys region where Carl lands for phase two. A trail of streetlamp-lit deckmasters leads to a huge dirt mound.","",[]],["Dallas County",["Dallas County, Iowa"],6,41,7,"A chunk of Iowa farmland set on top of a dirt mound in the Florida Keys, slowly crumbling into the sea. Carl climbs up to fight the region's key holder there.","",[]],["Iglesia San Hilarion",[],6,52,7,"An old, empty Catholic church that holds the region's second stairwell.","",[]],["Guanajay",[],6,53,7,"A small Cuban town Carl and Donut race through at night on the way to the coast.","",[]],["Homestead",["Homestead, Florida"],6,49,7,"A town in southern Florida, about forty minutes north of the Keys. Louis remembers the air force base, the racetrack and the alligators.","",[]],["Royal Court of Princess Donut",["Princess Posse","The Royal Court"],6,3,8,"Carl and Donut's squad name, embroidered on their ridiculous flag: a pair of heart-print boxers with a bomb patch. Donut's fans call themselves the Princess Posse.","",[["Faction Wars","The Princess Posse is also the crawlers' Faction Wars team.",35]]],["Open Intellect Pacifist Network",[],6,7,8,"One of Carl's mysterious sponsors, listed as a non-profit. It owns the Shadow Boxer show and the interview programs Carl keeps getting booked on.","Sponsor",[["What Carl suspects","At least one, maybe several, of their people used to own the Cookbook.",13]]],["Residuals",["Residual"],6,50,8,"Something the AI won't let Zev explain. Paulie says the mudskippers call his kind Residuals.","",[["What they are","Orren confirms Paulie was a Residual, and says Agatha is one too, of a different kind.",51]]],["Nebular Balance",["Nebulars","Nebular"],6,9,8,"A nomadic religious cult, the same people behind the Nebular Sin Patrol hunters on the sixth floor.","Sponsor",[["Who they sponsor","Sister Ines, and later a goddess.",64]]],["Lemig Sortion",[],6,12,8,"A truly democratic Faction Wars government of many races, though mostly small green ones. The whole population votes on everything. Carl's dropped castle crushed half their army.","",[]],["Prism Kingdom Clan",["Prism"],6,21,8,"Empress D'Nadia's Faction Wars team. She files emergency action items meant to get the crawlers thrown out.","",[]],["Reavers",[],6,21,8,"A megacorporation and system government that has won Faction Wars several times. Warlord Fangs leads them.","",[["Trying to quit","They try to pull out of Faction Wars, but the quarantine rules won't let them.",48]]],["Grixist Swarm",["Icon Industries","grixist"],6,17,8,"Huanxin Jinx's people. She's also CEO of Icon Industries.","",[]],["Hills Cyclops",[],6,2,9,"Mordecai's form for the eighth floor: pink, bald, one-eyed and cone-headed. Donut says he looks like a one-eyed knockoff of Patrick Star. The system describes Hills Cyclops as the weakest and dumbest cyclops-style monsters.","",[]],["Cat Girl",[],6,4,9,"A humanoid cat race. Sister Ines is one, and Donut is deeply offended by it.","",[]],["Havana Brown",[],6,5,9,"A cat breed. Sister Ines's cat-girl form looks like one, and Donut insists that nobody ever gets along with Havana browns.","",[]],["Hobbledehoy",[],6,18,9,"A generic term for small humans: no halfling feet, no elf ears, just scaled down, with outsized egos and tempers. They tend to get themselves killed in mixed cities.","",[]],["Ifrit",[],6,23,9,"Demons that leak into places of sin and debauchery as you get closer to Sheol. They're attuned to lust, envy and greed rather than just sex. They're smart and cunning, and they usually smell nice.","",[]],["Wisp",[],6,52,9,"A wisp NPC race. Yasmine, the Club Vanquisher temple secretary, is one.","",[]],["The Scavenger’s Daughter",["Scavenger’s Daughter"],6,3,10,"A unique divine back patch for Carl's jacket that shows a neat pile of skulls. It fills with power near gods and demons, and its abilities stay hidden until it's worn.","Divine · Unique · Fleeting",[["Divine items","Their buffs and debuffs change depending on how close certain gods are."],["In use","Near a deity she \"opens her eyes,\" and Carl's smash attacks become enormously stronger. When her bar fills, he has to release it.",16]]],["Mysterious Bone Key",["bone key"],6,3,11,"A one-time benefit on the Scavenger's Daughter patch. It forges a key that opens any lock in the dungeon, but it destroys the patch and the jacket it's sewn on, and it takes the key from one of Carl's own bones. The harder the lock, the bigger the bone, and the bone never grows back.","One use",[]],["Enchanted Nipple Ring of the Superior Fire Demon’s Hand Maiden",["nipple ring"],6,2,10,"A glowing red nipple ring for female quadrupeds, which in practice means Donut. It removes cursed items, makes her immune to natural fire and lava, protects her in Sheol and powers up her fire spells. Mordecai calls it practically a celestial item.","Quadruped · female only",[["Lore","It comes from the hellspawn familiars who \"chaperone\" Sheol's superior fire demons."]]],["Enchanted Prison Tattoo Kit",["tattoo kit","stick and poke kit"],6,3,10,"A stick-and-poke kit that lets an artist tattoo anyone, willing or not. Tattoo artistry can grant magical buffs, or curses.","",[["In use","Katia uses it to tattoo the Desperado Club logo on someone who needs a pass.",27]]],["Enchanted Right Back Atcha Personal Shield",["Right Back Atcha"],6,3,10,"An overeager little auto-deploying buckler. It has a chance to catch physical and magical bolts and throw them back. The system compares it to a touchy guy who calls himself T-Bone.","",[]],["Squad flag",["flag","flags","team flag"],6,1,10,"Each squad leader gets twenty flags printed with a logo the system designs. Plant one in a creature below 5% health and it turns into a T'Ghee totem card. Lost flags are never replaced.","20 per squad",[["Princess Posse flag","Carl and Donut's flag is a pair of heart-print boxers with a bomb patch, and it says The Royal Court of Princess Donut. Donut is furious about it.",4]]],["Enchanted Tiara of the Inebriated Dragonfly",[],6,24,10,"A citrine-studded tiara named for a children's story about a drunk dragonfly locked out by his wife. It cuts potion cooldowns and gives the wearer a Hover skill.","",[]],["The Orchid of Eileithyia’s Grace",["orchid","the orchid"],6,19,10,"A flower that only women can eat (and male seahorses, the system jokes). It knocks the eater out for an hour at 1% health with no healing allowed. Anyone who survives that gets one of three permanent boons from Eileithyia.","Female only",[["Why it matters","It's Katia's way out of a deadly trap, but it's sealed inside the Night Wyrm's lock box."],["Cost","Eating it would send Katia to the twelfth floor and turn her into an NPC for a while.",33]]],["Lock Box of the Night Wyrm",[],6,19,10,"A box attuned to Katia that holds the Orchid of Eileithyia's Grace. It opens only after she breaks three seals by finishing three grim tasks. If she dies first, the prize is destroyed.","Attuned to Katia",[["The seals","One task was killing someone she had partied with. Another requires an assassination for the Guild of Suffering."]]],["Enchanted Pauper’s Ring of the Steadfast Emberus",["Pauper’s Ring"],6,56,10,"A ring that only a worshipper of Emberus can wear. It strips most draining and disease debuffs and numbs others. To anyone who doesn't worship Emberus it looks like an ordinary Strength ring, and on them it turns cursed.","Emberus worshippers only",[]],["Book Burner",[],6,49,10,"An upgrade patch showing a burning book. Once a day it makes an opponent forget a spell for 30 hours, with a slight chance of failing for every level the target has over you. It also adds 15% to Intelligence.","",[]],["Wand of Nighty-Night",[],6,49,10,"A ten-charge wand that casts a five-minute Sleep on a single non-boss target. Casting it more than once stacks the effect.","10 charges",[]],["Book of Voodoo",["The Filthy Little Crawler’s Book of Voodoo","Your Book of Voodoo"],6,40,10,"An indestructible book named after the old Voodoo message boards at conventions. When you meet another crawler who owns one, their name is added to it permanently, and the two of you can trade private messages or post to everyone.","Cannot be traded or destroyed",[]],["Sailor hat",[],6,37,10,"A white sailor hat Donut takes off her first phase-two opponent. It looks ridiculous on her, and it cuts her card-draw countdown by two seconds.","",[]],["Xistera extension",["xistera"],6,4,10,"A jai-alai-style basket attachment for Carl's gauntlet. He uses it to fling bombs, heavy balls and, when he has to, Samantha.","",[]],["Eye in the Sky",["Eye in the Sky scroll"],6,53,11,"A rare and powerful locating spell, usually cast from a scroll. Mordecai describes it as somewhere between Find Crawler and a broadcast of your exact location.","",[["Scrolls","A big stack of them turns up in later loot. Mordecai says to save them.",59]]],["Teleport trap",["teleport traps","Loop-De-Loop"],6,4,10,"Carl's two-part traps: anyone who triggers the beacon gets sent to wherever the paired trap is placed. They're perfect for dumping guards into a locked closet.","",[["Loop-De-Loop","An emergency version swaps places with Donut when someone touches it.",58]]],["Size-Up potion",["Size-Up"],6,1,10,"Potions that show more detail about a monster, such as stats and spells. Carl wants half of Prepotente's supply.","",[]],["Tier 3 Doggie Door",["Doggie Door"],6,63,10,"A personal-space upgrade that lets the door open onto any door you've used on the current floor. It works as fast travel, and guests and party members can share it.","",[]],["The Eye of the Bedlam Bride",[],6,71,10,"A tattoo of an eye that appears on Carl's chest. It came with no description at all. It blinked, closed and vanished into his skin.","Tattoo",[]],["Hover",[],6,24,11,"A skill that lets Donut float two or three feet off the ground for about 90 seconds, five times a day. Unlike Levitate, damage doesn't cancel it.","Level 10 · 5 per day",[]],["The Martyr’s Path",["Martyr’s Path"],6,18,11,"An eighth-floor-only benefit that marks every step Carl takes outdoors. At 5% health he can make every marked step erupt in flame, and it also fires automatically if he dies. It comes with +10% Strength.","",[]],["Self-Immolation",[],6,47,11,"A once-a-day spell Carl gets as Emberus's Devotee. It wraps him in a sphere of Sheol fire with a one-foot gap around his body, and the range grows with each level.","Level 10",[["Sheol fire","Fire with rabies: wood turns to ash and rock turns to lava."]]],["Chi Cultivator",[],6,25,11,"Raul's signature spell. If it ever succeeds, it triples his power permanently, but it takes many casts, and each one burns all his mana.","",[]],["Why Are You Hitting Yourself?",["Why are you Hitting Yourself"],6,1,11,"A spell Donut gets at the start of the eighth floor that makes the target hurt itself. Donut loves it.","",[]],["Bad Attitude",[],6,1,11,"A Donut spell that drains Intelligence and lowers resistances. Mordecai says it combos well with Carl's Fear.","",[]],["Brain Freeze",[],6,1,11,"A single-target Donut spell that drains health and, at level 10, blinds the target for a short time.","",[]],["Circle of Containment",[],6,0,11,"A spell Chaco uses in the prologue to lock something in place inside a magical ring.","Level 15 (Chaco)",[]],["Graupel",[],6,65,11,"One of Elle's ice spells.","",[]],["Find Crawler",[],6,49,11,"A skill that shows nearby crawlers. Carl drinks a potion that gives it to him at level 5.","",[]],["T’Ghee",["T’Ghee cards","T’Ghee totem"],6,1,12,"The eighth floor's card system. Monsters struck with a squad flag turn into cards, and fights become real-time deck battles. Carl knows T'Ghee mostly through Allister, a Cookbook author for whom it was a religion.","",[["How it works","Squads fill their totem slots with flagged monsters over the first fourteen days. Totems that haven't been placed vanish when phase two starts."],["The rules","There are five card types: totems, utility, snare, mystic and special. A deck needs six totems. You draw four cards to start, and one more every ten seconds.",8]]],["Squad",["squads"],6,1,12,"On the eighth floor, crawlers are split into unbreakable squads of up to five. Each squad gets six extra slots to fill with totems, and one leader holds the deck.","",[]],["Totem cards",["totem","totems","Totem card"],6,1,15,"Monsters turned into cards by a squad flag. When summoned they fight as minions for a limited time and obey more or less depending on their level and nature. Tearing a card in half dismisses it.","",[["In battle","A deck needs six totems. If one is killed, it's knocked out for the rest of the fight.",8]]],["Utility cards",["utility card"],6,4,15,"Cards played on your own summoned totems: buffs, time extensions and combos.","",[]],["Snare cards",["snare card"],6,8,15,"Cards played on an enemy's summoned totem. Their debuffs carry over to later summons of the same card.","",[]],["Mystic cards",["mystic card"],6,8,15,"Cards that work like spells and affect squads, squad leaders or the deck itself.","",[]],["Special cards",["special card"],6,8,15,"Cards with assorted effects, usually one-time consumables that act on the caster.","",[]],["Deckmaster",[],6,29,12,"The player who holds and plays a squad's deck. In a real fight, enemy totems can't hit a deckmaster who has at least one totem summoned, though they can hit everyone else.","",[["Phase two","The phase-two path is lined with ten frozen deckmasters, and each one comes to life when a squad leader approaches.",39]]],["Combo",["Golden Combo","Combo card"],6,4,15,"A very rare consumable utility card that fuses two monster cards into one creature for the shorter of their two summon timers. Afterward both are out for the rest of the fight.","Very rare · consumable",[["Golden Combo","A stronger version shows up later in the floor.",43]]],["Glow-Up",[],6,27,15,"A consumable card that permanently locks in whatever buffs a totem currently has. A Time Extend made permanent, for example, doubles that totem's summon time in every later fight.","Consumable",[]],["Time Extend",[],6,7,15,"A common utility card that doubles how long a summoned totem lasts.","Common",[]],["Flee",["Flee card"],6,7,15,"A card that lets you escape a battle that's going badly.","Consumable",[["Phase three twist","A key holder who plays Flee automatically hands a key to their opponent.",53]]],["Force Discard",[],6,22,15,"A rare mystic card that sends a random card from the opponent's hand to their discard pile.","Rare mystic",[]],["Greased Lightning",[],6,11,15,"A utility card that makes a totem 25% faster.","Utility",[]],["Blue Stuff",[],6,11,15,"A utility card that refills a totem's mana.","Utility",[]],["Hobble",[],6,22,15,"A consumable snare card that slows an enemy totem.","Consumable snare",[]],["Hole in the Bag",[],6,22,15,"A snare card that drains an enemy totem's mana.","Snare",[]],["Lamp",[],6,41,15,"A consumable card the party picks up partway through phase two.","Consumable",[]],["Stout",[],6,7,15,"A utility card that adds 25% to a totem's health for the rest of the fight.","Utility",[]],["The Thief",["Thief"],6,17,15,"A mystic card that steals a card out of the opponent's hand.","Mystic",[]],["Damnation",[],6,27,15,"A snare card. When the targeted totem's timer runs out, it goes to the discard pile, so it's gone for the rest of the fight.","Snare",[]],["Steal Totem",[],6,47,15,"An absurdly powerful consumable mystic card that takes a totem from your opponent.","Consumable mystic",[]],["The Midnight Express",["Midnight Express"],6,59,15,"A rare consumable special card with two big men in tights on the front. Ren gives it to Carl along with the rest of her cards.","Consumable special",[["Effect","For three minutes it makes someone else the deckmaster.",68]]],["Phases",["Phase One","Phase Two","Phase Three"],6,1,12,"The eighth floor's three-part structure. In phase one (fourteen days), squads stay in their starting region and fill their totem slots. In phase two they relocate to fight for an exit key. In phase three the stairwells open.","",[["Phase three","Only squads holding a key can get through the stairwell doors. A key holder who flees a card battle loses a key to their opponent.",53]]],["Floor keys",["key","keys","exit key"],6,1,12,"This floor's stairwells won't open without a key, and the keys can't be won until phase two.","",[["Phase two","Each squad races a 46-hour clock along a path of deckmasters, collecting tokens to unlock the key holder.",38],["Rules","You can't drop or hand off a key voluntarily.",53]]],["Warlord",["warlords","co-warlord"],6,2,12,"A Faction Wars team leader. Donut, introducing herself with a long string of titles, is warlord of the Princess Posse, and Carl is her co-warlord.","",[["The meeting","The other warlords come to the production facility in person. Among them are Empress D'Nadia of the Prism, Warlord Fangs of the Reavers and Epitome Tagg of the Dream.",21]]],["Adjutant",[],6,2,12,"A Faction Wars advisor chosen by a team's warlord. The adjutant gets the expanded rule set and goes into battle alongside the warlord.","",[]],["Emergency Action Items",["Emergency Action Item","action item"],6,21,12,"Rule changes Faction Wars warlords propose and the audience votes on. If the system rejects one, nobody ever learns what it said.","",[]],["Thorn Room",["Celestial Thorn Room"],6,15,12,"A rare kind of room where crawlers face a choice that can upend everything: betray your friends for riches, or fight. The ghommid temple holds a Celestial one, with seven shrines and one Sun of Reawakening.","",[]],["Upgrade patches",["upgrade patch"],6,3,12,"Patches that grant buffs once sewn onto an eligible garment, such as Carl's jacket. They're fleeting items: removing one destroys it. The small peace-sign patch makes neutral mobs less aggressive and improves bongo playing.","",[]],["Divine items",["divine item"],6,3,12,"Gear once worn (or sneezed on) by a god. It hides what it does until equipped and gains new powers near gods and some demons. Some deities may give you debuffs from it instead.","",[]],["Devotee",[],6,47,12,"Carl's new rank with Emberus after his \"Baptism by Fire.\" It's as high as a non-cleric can go. It upgrades his burn immunity, grants Self-Immolation and raises his tithe to 10%.","",[]],["Drug dens",["drug den"],6,24,12,"Secret rooms hidden behind panels in Desperado Club hallways. They show up on the Night Wyrm's map of the club's hidden passages.","",[["Self-serve","Imani describes one like a frozen-yogurt bar where you mix your own bowl.",28]]],["Travis Priest",["Glory Bound","Creamsicle Charm","blitz sticks"],6,30,12,"Desperado Club drugs Mordecai sorts out for the party. Travis Priest is a vicious, addictive painkiller and Creamsicle Charm is ground fairy wings. Blitz sticks show you fake memories, and Glory Bound puts you in a coma to relive a real memory, which makes it the worst of them.","",[["The cure","Getting off Glory Bound means a deliberately bad trip, reliving one of your worst memories."]]],["Mercenaries",["mercenary","Meat Shields"],6,2,12,"Hired fighters, bought at Meat Shields locations. Carl gets 100,000-gold mercenary coupons out of his boxes.","",[["Barracks","Hiring a lot of them requires a guildhall barracks upgrade.",34]]],["Despondent",[],6,69,12,"A permanent debuff the system puts on every worshipper of a certain goddess.","",[]],["Oh shit! A country boss",[],6,2,14,"For coming face to face with a country boss you'd only heard rumors about, like seeing the big boss at work for the first time.","",[]],["Ménage à Quatro",[],6,2,14,"For surviving a four-way boss battle.","",[]],["Fuck This Floor",[],6,2,14,"For going down the stairs less than an hour after reaching a floor.","",[]],["Pacifist",[],6,2,14,"For getting through an entire floor without hurting a single mob. The system is not amused.","",[]],["Collective Bargaining",[],6,2,14,"For being one of more than 1,000 crawlers who got the same box at the same moment. The system takes it as a sign it should toughen the rules.","",[]],["Fashion of the Gods",[],6,3,14,"For receiving a divine item.","",[]],["Interloper",[],6,11,14,"For inviting a red-tagged NPC boss into a saferoom, and him actually getting inside.","",[]],["Crybaby",[],6,14,14,"For being rendered Terrified.","",[]],["Secondary Gig",[],6,19,14,"For taking on another job on top of everything else. It unlocks a new sub-tab of quests.","",[]],["We Want Meat! We Want Meat!",[],6,23,14,"For entering a male strip club. It comes with ten gold for tips.","",[]],["The Molly Maguires",[],6,23,14,"For finding the main room of a hidden guild you belong to.","",[]],["Cascadia’s Turquoise Taco",[],6,40,14,"For ending a carefully designed card fight before it even started. The AI notes the lead engineer won't be pleased.","",[]],["Smeat",[],6,40,14,"For fighting as a minion bodyguard in deck combat. In other words, cannon fodder.","",[]],["Cliffhanger",[],6,41,14,"For scaling a cliff with your bare hands.","",[]],["Prepare for Trouble",[],6,41,14,"For facing two card-wielding opponents who work very well together at the same time.","",[]],["LBC",[],6,48,14,"For taunting an opponent with a garment, in Carl's case his nightgaunt-skin cloak.","",[]],["Pincushioned",[],6,48,14,"For having both eyeballs pierced at once.","",[]],["Watch where you’re waving that thing, big boy",[],6,48,14,"For using a wand creatively to help kill an opponent. It raises wand-casting to level five.","",[]],["Mass Layoffs",[],6,48,14,"For surviving a boss the AI built entirely by itself. It reads more like the AI's own breakthrough than Carl's.","",[]],["Columbia House",[],6,56,14,"For taking on a debt, named after the old twelve-albums-for-a-penny deal.","",[]],["The Fumble",[],6,56,14,"For losing the ball at the goal line with everything at stake.","",[]],["Holy Hell",[],6,58,14,"For being in the presence of Sheol royalty.","",[]]],"APPEAR":{"Carl":"7ffffdecafe3.3fffffb.3ffffffff.3ffffffff.7ffffefffffffffffff.3fffffffffffffffffe","Princess Donut":"7fffffffffdf.3ffffff.3ffffffff.3ffffffff.7fdffffffffffffffff.3fbfffffffffffffffe",
